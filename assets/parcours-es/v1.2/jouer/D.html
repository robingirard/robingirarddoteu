function barres(svgId, rows, configs, coul, legendId) {
  const N = NOMS[S.lang], t = T[S.lang], svg = document.getElementById(svgId); svg.innerHTML = "";
  const W = Math.max(300, Math.round(svg.getBoundingClientRect().width) || 640), L = 6, R2 = 40, top = 6, h = 12, gap = 3;
  const block = configs.length * (h + gap) + 26, H = top + block * JEUX.length + 30;
  const xmax = Math.max(...rows.map(r => r.cout_kg)) * 1.05, x = v => L + (W - L - R2) * v / xmax;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  for (let v = 0; v <= xmax; v += 1) {
    svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - 26, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - 12, "text-anchor": "middle", class: "lbl"}, fmt(v)));
  }
  svg.appendChild(el("text", {x: W - 4, y: H, "text-anchor": "end", class: "lbl"}, t.axe));
  JEUX.forEach((j, i) => {
    const y0 = top + i * block, rs = rows.filter(r => r.jeu === j && configs.includes(r.config));
    if (!rs.length) return;
    const best = rs.reduce((a, b) => (b.cout_kg < a.cout_kg ? b : a));
    svg.appendChild(el("text", {x: L, y: y0 + 13, style: "font-weight:600"}, N[j]));
    configs.forEach((c, k) => {
      const r = rs.find(q => q.config === c); if (!r) return;
      const y = y0 + 20 + k * (h + gap);
      svg.appendChild(el("rect", {x: x(0), y, width: Math.max(1, x(r.cout_kg) - x(0)), height: h, rx: 3, fill: css("--s" + coul[c])}));
      svg.appendChild(el("text", {x: x(r.cout_kg) + 4, y: y + h - 2, style: r === best ? "font-weight:700" : ""}, fmt(r.cout_kg, 2)));
      const hit = el("rect", {x: 0, y: y - 1, width: W, height: h + 2, fill: "transparent"}); svg.appendChild(hit); hover(hit, info(r));
    });
  });
  document.getElementById(legendId).innerHTML = configs.map(c => `<span><i style="background:${css("--s" + coul[c])}"></i>${N[c]}</span>`).join("");
}

function section1() {

  const lignes = JEUX.map(j => {
    const g = c => rows.find(r => r.jeu === j && r.config === c); if (!g("electrolyseur")) return "";
    const best = SANS.map(g).reduce((a, b) => (b.cout_kg < a.cout_kg ? b : a));
    const cav = g("electrolyseur").cout_kg - g("electrolyseur_cavite").cout_kg;
    const elmin = Math.min(...["electrolyseur", "electrolyseur_reservoir", "electrolyseur_cavite"].map(c => g(c).cout_kg));

    ? `Plus le contrat peut être gros, moins l'horaire coûte : ${fmt(lo, 2)} à ${fmt(hi, 2)} €/kg à 1,5 fois la consommation, ${fmt(lo3, 2)} à ${fmt(hi3, 2)} à 3 fois. Le surplus se revend au prix horaire : un grand PPA donne à l'électrolyseur plus d'heures couvertes, au prix d'une revente d'électricité.`
    : `The larger the contract may be, the less hourly matching costs: ${fmt(lo, 2)} to ${fmt(hi, 2)} €/kg at 1.5 times consumption, ${fmt(lo3, 2)} to ${fmt(hi3, 2)} at 3 times. The surplus is resold at the hourly price: a large PPA gives the electrolyser more covered hours, at the price of reselling electricity.`;
  const val = (g, a, j, c) => { const e = get(g, a, j, "electrolyseur"), x = get(g, a, j, c); return e && x ? e.cout_kg - x.cout_kg : NaN; };
  const lignes = [];
  for (const a of [2030, 2040]) for (const j of JEUX) {
    const p = get("plafonne", a, j, "electrolyseur"); if (!p) continue;
    lignes.push(`<tr><td>${N[j]}</td><td>${a}</td><td class="num">${p.heures_plafonnees}</td>` +
      ["electrolyseur_cavite", "electrolyseur_reservoir"].map(c => `<td class="num">${fmt(val("central", a, j, c), 2)}</td><td class="num">${fmt(val("plafonne", a, j, c), 2)}</td>`).join("") + "</tr>");
  }
  document.getElementById("tab_plaf").innerHTML = `<thead><tr>${t.th_plaf.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${lignes.join("")}</tbody>`;
  const regle = JEUX.map(j => {
    const m = get("plafonne", 2030, j, "rfnbo_mensuelle"), e = get("plafonne", 2030, j, "electrolyseur"),
          m0 = get("central", 2030, j, "rfnbo_mensuelle"), e0 = get("central", 2030, j, "electrolyseur");
    if (!m) return "";
    return fr() ? `${N[j]} 2030 : RFNBO mensuel (avec réservoirs) ${fmt(m0.cout_kg, 2)} contre électrolyseur au réseau sans stockage ${fmt(e0.cout_kg, 2)} €/kg avec les prix publiés ; ${fmt(m.cout_kg, 2)} contre ${fmt(e.cout_kg, 2)} avec les prix écrêtés.`
      : `${N[j]} 2030: RFNBO monthly (with tanks) ${fmt(m0.cout_kg, 2)} vs grid electrolyser without storage ${fmt(e0.cout_kg, 2)} €/kg with published prices; ${fmt(m.cout_kg, 2)} vs ${fmt(e.cout_kg, 2)} with capped prices.`;
  }).filter(Boolean);
  const cav40 = JEUX.map(j => { const c0 = get("central", 2040, j, "rfnbo_horaire_cavite"), c1 = get("plafonne", 2040, j, "rfnbo_horaire_cavite");
    return c0 && c1 ? `${N[j]} ${fmt(c0.cout_kg, 2)} → ${fmt(c1.cout_kg, 2)}` : ""; }).filter(Boolean).join(" ; ");
  document.getElementById("read_plaf").innerHTML = (fr()
    ? "Écrêter les prix ne change presque pas le coût des solutions avec cavité, qui évitaient déjà ces heures : c'est l'électrolyseur sans stockage qui devient moins cher. Ce que le stockage perd, il le tenait des heures de défaillance du modèle de prix, que rien ne garantit dans la réalité. "
    : "Capping prices hardly changes the cost of the options with a cavern, which already avoided those hours: it is the electrolyser without storage that gets cheaper. What storage loses, it owed to the scarcity hours of the price model, which nothing guarantees in reality. ") +
    regle.join(" ") + "<br>" + (fr() ? `2040, horaire avec cavité (€/kg), publiés → écrêtés : ${cav40}.` : `2040, hourly with cavern (€/kg), published → capped: ${cav40}.`);
}

function limites() {
  const N = NOMS[S.lang];
  // jeux où le reformeur bat l'électrolyseur avec cavité en 2040 de moins que l'écart des deux coûts fixes : le verdict en dépend
  const ecarts = JEUX.map(j => [j, get("central", 2040, j, "electrolyseur_cavite").cout_kg - get("central", 2040, j, "reformeur").cout_kg])
    .filter(([, d]) => d > 0 && d < KG_SMR);
  const jeux = ecarts.length ? ecarts.map(([j, d]) => `${N[j]} (${fmt(d, 2)} €/kg)`).join(", ") : "—";
  document.getElementById("lim").innerHTML = LIMITES[S.lang].map(x => `<li>${x.replace("{smr}", fmt(KG_SMR, 2)).replace("{jeux_smr}", jeux)}</li>`).join("");
}

function hyp() {
  const t = T[S.lang];
  document.getElementById("hyp").innerHTML = `<thead><tr>${t.thh.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.hyp.map(h => `<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}</td><td>${h.statut}</td></tr>`).join("") + "</tbody>";
}

function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  document.getElementById("lang").textContent = t.lang;
  seg("annee", "annee", [[2030, "2030"], [2040, "2040"]]);
  seg("prix", "prix", [["central", t.prix_a], ["plafonne", t.prix_b]]);
  seg("capex", "capex", [["annee", t.capex_a], ["bas", t.capex_b]]);
  document.getElementById("lab_capex").style.display = S.annee === 2030 && S.prix === "central" ? "" : "none";
  seg("annee2", "annee2", [[2030, "2030"], [2040, "2040"]]);
  seg("part", "part", [["100", "100 %"], ["red", `${t.part_red} (${S.annee2 === 2030 ? "42" : "60"} %)`]]);
  section1(); section2(); section3(); limites(); hyp();
  const jeux = JEUX.map(j => `${D.meta.jeux[j].attribution || NOMS[S.lang][j]} (${D.meta.jeux[j].licence})`).join(" ; ");
  const v = D.meta.versions, versions = `pommes ${v.pommes}, pommes_craft ${v.pommes_craft}`;
  document.getElementById("pied").innerHTML = `<p>${t.pied.replace("{jeux}", jeux).replace("{versions}", versions).replace("{n}", D.meta.n_resolutions)
    .replace("{grille}", D.meta.commit_grille).replace("{commit}", D.meta.commit).replace("{date}", D.meta.date)}</p>`;
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr";
  const u = new URL(location.href); u.searchParams.set("lang", S.lang); history.replaceState(null, "", u); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let _rz; addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(render, 150); });
render();
</script>
</body>
</html>
