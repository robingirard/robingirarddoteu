function limites() {
  const t = T[S.lang], r0 = ref("europe"), rm = ref("france_miroir");
  const pmax = Math.max(...L_().filter(r => r.config === "europe").map(r => r.prix_max_FR || 0));
  document.getElementById("lim").innerHTML = t.limites.map(l => `<li>${l.replace("{pmax}", fmt(pmax)).replace("{ram}", D.meta.ram_go ? fmt(D.meta.ram_go) : "≈ 15")
    .replace("{fm}", rm ? fmt(rm.flux_FRES_twh, 1) : "–").replace("{fe}", r0 ? fmt(r0.flux_FRES_twh, 1) : "–")}</li>`).join("");
}

function hyp() {
  const t = T[S.lang];
  document.getElementById("hyp").innerHTML = `<thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.hyp.map(h => `<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}${h.remarque ? ` <span class="note">— ${h.remarque}</span>` : ""}</td><td>${h.statut}</td></tr>`).join("") + "</tbody>";
}

function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  document.getElementById("lang").textContent = t.lang;
  seg("x", "x", [["ES", t.x_ES], ["DE", t.x_DE]]);
  seg("annee", "annee", [...new Set(D.tables.jeux.map(r => r.annee))].sort().map(a => [a, String(a)]));
  seg("zone", "zone", [["X", S.x], ["FR", "FR"]]);
  for (const [id, key, [lo, hi], step] of [["taux", "taux", AN.plage_taux, 0.5], ["duree", "duree", AN.plage_duree, 5]]) {
    const i = document.getElementById(id); i.min = lo; i.max = hi; i.step = step; i.value = S[key];
    i.oninput = () => { S[key] = Number(i.value); render(); }; }
  cout(); strip(); gains(); partage(); gaz(); mono(); calage(); limites(); hyp();
  const jeux = Object.entries(D.meta.jeux_prix).map(([j, m]) => `${m.attribution || NOMS[j] || j} (${m.licence})`).join(" ; ");
  const v = D.meta.versions || {}, versions = `pommes ${v.pommes}, pommes_craft ${v.pommes_craft}`;
  document.getElementById("pied").innerHTML = `<p>${t.pied.replace("{jeux}", jeux).replace("{versions}", versions).replace("{n}", D.meta.n_resolutions)
    .replace("{grille}", D.meta.commit_grille).replace("{commit}", D.meta.commit).replace("{date}", D.meta.date)}</p>`;
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr";
  const u = new URL(location.href); u.searchParams.set("lang", S.lang); history.replaceState(null, "", u); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let _rz; addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(render, 150); });
render();
</script>
</body>
</html>
