const D = {"meta":{"date":"2026-11-23","commit":"5596db0","machine":"macOS-26.6.2-arm64-arm-64bit","n_resolutions":29,"temps_total_s":288.2,"solveur":"HiGHS","rapide":false,"series":["tyndp2026_NT+_2030","tyndp2026_NT+_2035","tyndp2026_NT+_2040","tyndp2024_NT_2030","etage1_tyndp2026_ppe_g30-d1075_2035","fos_sur_mer_reference_2030"],"series_raccordement":["tyndp2026_NT+_2035","tyndp2026_NT+_2035","tyndp2026_NT+_2035","tyndp2026_NT+_2030","tyndp2026_NT+_2040","etage1_tyndp2026_ppe_g30-d1000_2035","etage1_tyndp2026_ppe_g30-d1075_2035","etage1_tyndp2026_tyndp_g30-d1075_2035"],"memoire_max_go":{"site_merite_go":9.9033,"site_raccordement_go":10.002,"systeme_go":10.002},"cout_batterie_eur_an":1250611.7003,"annuite_renforcement_eur_mw":8386.0162,"groupes_cout":{"tyndp2026_NT+_2030":237.505,"tyndp2026_NT+_2035":318.1652,"tyndp2026_NT+_2040":398.8253,"tyndp2024_NT_2030":187.3652,"etage1_tyndp2026_ppe_g30-d1075_2035":318.1652,"fos_sur_mer_reference_2030":187.3652,"etage1_tyndp2026_ppe_g30-d1000_2035":318.1652,"etage1_tyndp2026_tyndp_g30-d1075_2035":318.1652},"versions":{"pommes":"0.11.0","pommes_craft":"0.6.0","linopy":"0.10.1","highspy":"1.15.1"},"empreintes":{"N_data_center/model.py":"56c7cf3f6d1e","N_data_center/grid.py":"fa3b7c8038bb","N_data_center/hypotheses.yaml":"bc410421c985","pommes_cases/systeme_fr.py":"2268a0cb436d","pommes_cases/blocks.py":"5ea650cf2b54"},"commit_grille":"b1e7689"},"perimetre":{"fr":"Deux étages. Le site : un data center de 100 MW de puissance raccordée demandée, à consommation plate, preneur de prix face à six séries horaires françaises publiées ; il peut faire tourner ses groupes de secours, puiser dans ses onduleurs ou une batterie de 2 h, décaler une part de son calcul dans la journée, brider son calcul (coût du calcul perdu) ou s'arrêter. On y pose aussi le raccordement flexible, en trois couches : demander la puissance qu'on consomme plutôt que 100 MW, puis accepter une puissance C plus basse pendant les heures de plus forte demande résiduelle française, et comparer au renforcement évité. Le système : 2 à 10 GW de data centers dans la France de 2035 (parc fixé du TYNDP 2026 NT+, trois années météo, voisins au prix horaire), en ruban rigide, avec groupes qui s'effacent au-dessus de leur coût, ou avec une part de calcul flexible. Le modèle voit l'adéquation (heures de rareté, délestage, prix) ; il ne voit ni la fréquence, ni l'inertie, ni les réserves, ni le réseau électrique lui-même : la « stabilité » au sens dynamique est hors du modèle. Prévision parfaite de l'année. Un cas d'école, pas une prévision.","en":"Two levels. The site: a data centre with 100 MW of requested grid connection, flat consumption, price taker under six published French hourly price series; it can run its backup generators, draw on its UPS or a 2 h battery, shift part of its compute within the day, throttle its compute (cost of lost compute) or shut down. The flexible connection is asked there too, in three layers: request the power actually consumed rather than 100 MW, then accept a lower power C during the hours of highest French residual demand, and compare with the avoided reinforcement. The system: 2 to 10 GW of data centres in France in 2035 (fixed TYNDP 2026 NT+ fleet, three weather years, neighbours at the hourly price), as a rigid flat load, with generators that step in above their cost, or with a flexible share of compute. The model sees adequacy (scarcity hours, load shedding, prices); it sees neither frequency, nor inertia, nor reserves, nor the grid itself: “stability” in the dynamic sense is outside the model. Perfect foresight over the year. A textbook case, not a forecast."},"hyp":[{"bloc":"site","nom":"puissance raccordée demandée par le site (P)","valeur":"100","unite":"MW","source":"choix du cas : un hyperscale ou un site IA fait au moins 100 MW (AIE, Energy and AI, 2025 ; note § 1)","statut":"choix du cas"},{"bloc":"site","nom":"facteur de charge du site (consommation / P)","valeur":"0.85","unite":"-","source" function table(id, head, rows) {
  document.getElementById(id).innerHTML = `<thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr class="${r._cls || ""}">${r._cells.map(c => `<td>${c}</td>`).join("")}</tr>`).join("") + "</tbody>";
}
const fill = (s, o) => Object.entries(o).reduce((a, [k, v]) => a.split(`{${k}}`).join(v), s);
const kpi = (id, items) => document.getElementById(id).innerHTML = items.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");
const levs = r => ["groupes", "onduleurs", "batterie", "deplacable", "bridage", "arret"].filter(k => r[k]);
const sysRow = id => D.systeme.moyenne.find(r => r.id === id);
const racc = (serie, v, c, n) => D.raccordement.find(r => r.serie === serie && r.variante === v && r.c === c && (c === 100 || r.n === n));
// valeur d'un MW évité (€/MW/an) : annuité du renforcement amont, ou part capacitaire pendant l'attente des travaux
const valeurMW = k => { const [t, v] = k.split("_"); return t === "renf" ? AF * (+v) : +v; };
const ecoFlex = (c, k) => Math.max(0, L_MW - c * P.puissance_mw / 100) * valeurMW(k);

function render_verdict() {
  const t = T[S.lang];
  const m = D.merite.filter(r => r.serie === CENT), g = m.find(r => r.config === "groupes_500"), ex = m.find(r => r.config === "existants");
  const ex40 = D.merite.find(r => r.serie === "tyndp2026_NT+_2040" && r.config === "existants");
  const rc = racc(CENT, "base", 80, 177), s0 = sysRow("rigide_0"), s10 = sysRow("rigide_10"), s10b = sysRow("rigide_10_imp75");
  if (!g || !ex || !rc || !s0 || !s10) { document.getElementById("verdict_txt").textContent = "—"; return; }
  const mf = Math.max(0, L_MW - 80), ef = mf * AF * P.renforcement_eur_mw;
  document.getElementById("verdict_txt").textContent = fill(t.verdict, {
    p: fmt(P.puissance_mw), l: fmt(L_MW), hg: fmt(g.groupes.heures), mwh: fmt(g.groupes.mwh), co2: fmt(g.co2_t), cg: fmt(g.groupes_cout),
    gain: K(ex.gain_eur), gpm: fmt(ex.gain_eur / (ex.charge_mw * 8760), 2), gain40: ex40 ? K(ex40.gain_eur) : "—",
    mj: fmt(P.puissance_mw - L_MW), ej: K((P.puissance_mw - L_MW) * AF * P.renforcement_eur_mw), renf: fmt(P.renforcement_eur_mw / 1000),
    cmw: 80, nr: 177, sr: K(rc.surcout_eur), co2r: fmt(rc.co2_sup_t), ef: K(ef), eq: fmt(rc.surcout_eur / (mf * AF) / 1000),
    pc: K(mf * P.part_capacitaire_eur_mw_an),
    pm0: fmt(s0.prix_moyen, 1), pm10: fmt(s10.prix_moyen, 1), hr0: fmt(s0.heures_rarete), hr10: fmt(s10.heures_rarete),
    marge: fmt(s10.marge_gw, 1), prof: fmt(100 * s10.profondeur_max),
    imp75: s10b && s10b.delestage_au_dela_gw > 0.01 ? fill(t.imp75_txt, {x: fmt(s10b.delestage_au_dela_gw, 1)}) : ""});
}

function render_merite() {
  const t = T[S.lang], sel = document.getElementById("serie");
  const ids = [...new Set(D.merite.map(r => r.serie))];
  sel.innerHTML = ids.map(i => `<option value="${i}"${i === S.serie ? " selected" : ""}>${t.series[i] || i}</option>`).join("");
  document.querySelector("[data-t=merite_note]").textContent = fill(t.merite_note, {cy: fmt(P.onduleurs_cyclage)});
  const rows = D.merite.filter(r => r.serie === S.serie && r.config !== "rigide");
  table("merite", t.th_merite, rows.map(r => {
    const L = levs(r), mwh = L.reduce((a, k) => a + r[k].mwh, 0), h = Math.max(0, ...L.map(k => r[k].heures));
    const dec = L.filter(k => ["groupes", "bridage", "arret"].includes(k)).map(k => r[k].prix_declenchement).filter(x => x !== null), pm = L.filter(k => r[k].mwh > 0);
    const pmoy = pm.length ? pm.reduce((a, k) => a + r[k].prix_moyen * r[k].mwh, 0) / pm.reduce((a, k) => a + r[k].mwh, 0) : null;
    return {_cls: r.config === "existants" ? "sel" : "", _cells: [t.conf[r.config] || r.config, fmt(mwh), fmt(h), dec.length ? fmt(Math.min(...dec)) : "—",
      fmt(pmoy), fmt(r.gain_eur / 1000, 1), mwh > 1 ? fmt(r.gain_eur / mwh) : "—", fmt(r.co2_t)]};
  }));
  const ex = rows.find(r => r.config === "existants"), sp = rows.find(r => r.config === "existants_sp");
  const g0 = rows[0];
  document.getElementById("groupes_serie").textContent = g0 ? fill(t.groupes_serie, {cg: fmt(g0.groupes_cout), hp: fmt(g0.h_plafond)}) : "";
  kpi("revenus", [[ex ? K(ex.gain_eur) : "—", t.rev[0]], [sp ? K(sp.gain_eur) : (ex ? K(ex.gain_eur) : "—"), t.rev[1]], [K(L_MW * P.capacite_eur_mw), t.rev[2]],
    [K(P.batterie_part * P.puissance_mw * P.fcr_eur_mw), t.rev[3]], [K(D.meta.cout_batterie_eur_an), t.rev[4]]]);
}

function render_racc() {
  const t = T[S.lang];
  const series = [...new Set(D.raccordement.map(r => r.serie))];
  document.getElementById("racc_serie").innerHTML = series.map(i => `<option value="${i}"${i === S.rserie ? " selected" : ""}>${t.series[i] || i}</option>`).join("");
  const vars = [...new Set(D.raccordement.filter(r => r.serie === S.rserie).map(r => r.variante))];
  if (!vars.includes(S.variante)) S.variante = "base";
  document.getElementById("variante").innerHTML = vars.map(v => `<option value="${v}"${v === S.variante ? " selected" : ""}>${t.variantes[v] || v}</option>`).join("");
  const vals = [...P.renforcement_variantes.map(v => `renf_${v}`), ...P.part_capacitaire_variantes.map(v => `pc_${v}`)];
  document.getElementById("valeur_mw").innerHTML = vals.map(v => `<option value="${v}"${v === S.valeur ? " selected" : ""}>${t.valeurs[v] || v}</option>`).join("");
  const dispo = D.raccordement.filter(r => r.serie === S.rserie && r.variante === S.variante);
  const cs = [...new Set(dispo.map(r => r.c).filter(c => c < 100))].sort((a, b) => b - a);
  const ns = [...new Set(D.raccordement.map(r => r.n).filter(n => n > 0))].sort((a, b) => a - b);
  if (cs.length && !cs.includes(S.c)) S.c = cs[0];
  document.getElementById("c_btn").innerHTML = cs.map(c => `<button type="button" data-c="${c}" aria-pressed="${c === S.c}">${c} MW</button>`).join("");
  document.getElementById("n_btn").innerHTML = ns.map(n => `<button type="button" data-n="${n}" aria-pressed="${n === S.n}"${dispo.some(r => r.n === n && r.c === S.c) ? "" : " disabled"}>${n} h</button>`).join("");
  document.querySelectorAll("#c_btn button").forEach(b => b.onclick = () => { S.c = +b.dataset.c; render_racc(); });
  document.querySelectorAll("#n_btn button").forEach(b => b.onclick = () => { S.n = +b.dataset.n; render_racc(); });
  const r = racc(S.rserie, S.variante, S.c, S.n), txt = document.getElementById("racc_txt");
  const L = r ? r.charge_mw : L_MW, v = valeurMW(S.valeur), mj = P.puissance_mw - L;
  const juste = D.raccordement.find(z => z.serie === S.rserie && z.variante === "juste");
  if (!r) { txt.textContent = t.non_calc; kpi("racc_kpi", []); document.getElementById("racc_bar").innerHTML = ""; document.getElementById("racc_leg").innerHTML = ""; }
  else {
    const mf = Math.max(0, L - S.c * P.puissance_mw / 100), ef = mf * v + (r.economie_turpe_eur || 0), eq = mf > 0 ? r.surcout_eur / (mf * AF) : null;
    kpi("racc_kpi", [[K(r.surcout_eur), t.kpi_racc[0]], [fmt(r.co2_sup_t), t.kpi_racc[1]], [K(ef), t.kpi_racc[2]], [eq === null ? "—" : fmt(eq / 1000), t.kpi_racc[3]],
      [K(mj * v), t.kpi_racc[4]], [fmt(r.groupes_heures_pleine), t.kpi_racc[5]]]);
    if (r.ecart_mwh <= 0) txt.textContent = fill(t.racc_pas_ecart, {l: fmt(L), mj: fmt(mj), ej: K(mj * v), s: K(r.surcout_eur)});
    else {
      const b = ef - r.surcout_eur;
      const turpe = r.economie_turpe_eur > 0 ? fill(t.turpe_oui, {t: K(r.economie_turpe_eur)}) : fill(t.turpe_non, {cv: fmt(100 * (r.couverture_turpe || 0))});
      txt.textContent = fill(t.racc_txt, {l: fmt(L), p: fmt(P.puissance_mw), mj: fmt(mj), ej: K(mj * v), sj: juste ? K(juste.surcout_eur) : "—",
        n: fmt(r.n), ecart: fmt(mf), emwh: fmt(r.ecart_mwh), s: K(r.surcout_eur), co2: fmt(r.co2_sup_t), mf: fmt(mf), ef: K(ef), turpe,
        bilan: b >= 0 ? fill(t.bilan_pos, {x: K(b)}) : fill(t.bilan_neg, {x: K(-b)}), eq: eq === null ? "—" : fmt(eq / 1000)});
    }
    const items = Object.entries(r.couvert || {}).filter(([, x]) => x > 0.5), tot = items.reduce((a, [, x]) => a + x, 0) || 1, W = 880;
    let x = 0, g = "";
    for (const [k, val] of items) { const w = (W - 2) * val / tot;
      g += `<rect x="${x + 1}" y="10" width="${w}" height="34" fill="${COUL[k]}"/>` + (w > 60 ? `<text x="${x + 6}" y="32" font-size="16" fill="#fff">${fmt(val)}</text>` : ""); x += w; }
    document.getElementById("racc_bar").innerHTML = g;
    document.getElementById("racc_leg").innerHTML = items.map(([k]) => `<span style="--c:${COUL[k]}">${t.lev[k]} (MWh)</span>`).join("");
  }
  // courbe : surcoût de la couche 2 selon C pour chaque N, et l'économie choisie
  const W = 880, Hh = 320, ml = 70, mr = 16, mt = 14, mb = 40, cx = [100, 90, 80, 70, 60];
  const pts = ns.map(n => cx.map(c => racc(S.rserie, S.variante, c, n)).map((q, i) => q ? [cx[i], q.surcout_eur / 1000] : null).filter(Boolean)).filter(a => a.length > 1);
  const eco = cx.map(c => [c, ecoFlex(c, S.valeur) / 1000]);
  const ys = [0, ...pts.flat().map(p => p[1]), ...eco.map(p => p[1])], y1 = Math.max(...ys) * 1.1 || 1, y0 = Math.min(0, ...ys);
  const X = c => ml + (W - ml - mr) * (100 - c) / 40, Y = val => mt + (Hh - mt - mb) * (1 - (val - y0) / (y1 - y0));
  let g = "";
  for (let i = 0; i <= 4; i++) { const val = y0 + (y1 - y0) * i / 4;
    g += `<line x1="${ml}" y1="${Y(val)}" x2="${W - mr}" y2="${Y(val)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="4" y="${Y(val) + 5}" font-size="16" fill="var(--muted)">${fmt(val)}</text>`; }
  cx.forEach(c => g += `<text x="${X(c)}" y="${Hh - 20}" font-size="16" fill="var(--muted)" text-anchor="middle">${c}</text>`);
  g += `<line x1="${X(100 * L_MW / P.puissance_mw)}" y1="${mt}" x2="${X(100 * L_MW / P.puissance_mw)}" y2="${Hh - mb}" stroke="var(--muted)" stroke-dasharray="2 3"/>`;
  g += `<text x="${W - mr}" y="${Hh - 2}" font-size="16" fill="var(--muted)" text-anchor="end">${t.axe_c}</text><text x="${ml}" y="${mt - 2}" font-size="16" fill="var(--muted)">${t.axe_k}</text>`;
  const cols = ["var(--ok)", "var(--accent)", "var(--danger)"];
  const path = (a, c, dash) => `<path d="${a.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ")}" fill="none" stroke="${c}" stroke-width="2"${dash ? ' stroke-dasharray="6 5"' : ""}/>`;
  pts.forEach((a, i) => { g += path(a, cols[i % 3]) + a.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${cols[i % 3]}"/>`).join(""); });
  g += path(eco, "var(--ink)", true);
  document.getElementById("racc_courbe").innerHTML = g;
  document.getElementById("racc_courbe_leg").innerHTML = ns.map((n, i) => `<span style="--c:${cols[i % 3]}">${fill(t.leg_courbe.n, {n})}</span>`).join("") + `<span style="--c:var(--ink)">${t.leg_courbe.eco}</span>`;
}

const sysId = (c, g) => c === "rigide_imp75" ? `rigide_${g}_imp75` : `${c}_${g}`;
function render_sys() {
  const t = T[S.lang], ids = new Set(D.systeme.moyenne.map(r => r.id));
  const cfgs = ["rigide", "groupes", "flexible", "rigide_imp75"], gws = [0, 2, 4, 6, 8, 10];
  const has = (c, g) => ids.has(sysId(c, g));
  if (!has(S.config, S.gw)) S.config = "rigide";
  document.getElementById("config").innerHTML = cfgs.filter(c => gws.some(g => has(c, g)))
    .map(c => `<option value="${c}"${c === S.config ? " selected" : ""}${has(c, S.gw) ? "" : " disabled"}>${t.configs[c]}</option>`).join("");
  document.getElementById("gw_btn").innerHTML = gws.filter(g => has("rigide", g))
    .map(g => `<button type="button" data-gw="${g}" aria-pressed="${g === S.gw}">${g}</button>`).join("");
  document.querySelectorAll("#gw_btn button").forEach(b => b.onclick = () => { S.gw = +b.dataset.gw; render_sys(); });
  const id = sysId(S.config, S.gw), m = sysRow(id);
  if (!m) return;
  const rig = S.config === "rigide" || S.config === "rigide_imp75" ? m : sysRow(`rigide_${S.gw}`);
  kpi("sys_kpi", [[fmt(m.prix_moyen, 1), t.kpi_sys[0]], [fmt(m.heures_rarete, 1), fill(t.kpi_sys[1], {s: fmt(P.seuil_rarete)})], [fmt(m.defaillance_gwh, 1), t.kpi_sys[2]],
    [S.gw && rig ? fmt(100 * rig.profondeur_max) + " %" : "—", t.kpi_sys[3]], [S.gw ? fmt(100 * S.gw / m.pointe_gw, 1) + " %" : "—", t.kpi_sys[4]]]);
  let pt = "";
  if (S.gw && rig) {
    if (rig.profondeur_max > 0 && rig.marge_gw !== null) pt = fill(t.prof_txt, {marge: fmt(rig.marge_gw, 2), gw: fmt(S.gw), prof: fmt(100 * rig.profondeur_max),
      seuil: fmt(rig.marge_gw / (1 - P.profondeur_epri)), imp: fmt(rig.ntc_import_gw)});
    else pt = t.prof_rien;
    if (rig.delestage_au_dela_gw > 0.01) { const z = sysRow(S.config === "rigide_imp75" ? "rigide_0_imp75" : "rigide_0");
      pt += " " + fill(t.prof_au_dela, {x: fmt(rig.delestage_au_dela_gw, 1), z: z ? fmt(z.defaillance_max_gw, 1) : "—"}); }
    if (rig !== m) pt += " " + fill(t.prof_flex, {b: fmt(100 * m.baisse_max)});
  }
  document.getElementById("sys_prof").textContent = pt;
  table("sys_ws", t.th_ws, D.systeme.ws.filter(r => r.id === id).map(r => ({_cells: [r.ws, fmt(r.cout_objectif_meur), fmt(r.prix_moyen, 1), fmt(r.heures_rarete),
    fmt(r.defaillance_gwh, 1), fmt(r.defaillance_max_gw, 2), r.marge_gw === null ? "—" : fmt(r.marge_gw, 2), `${fmt(r.groupes_dc_gwh || 0, 1)} / ${fmt(r.groupes_dc_heures || 0)}`,
    `${fmt(r.bridage_dc_gwh || 0, 1)} / ${fmt(r.bridage_dc_heures || 0)}`, S.gw ? fmt(100 * r.profondeur_max) + " %" : "—", fmt(r.export_twh, 1), fmt(r.co2_total_mt, 2)]})));
  // coût marginal du n-ième GW
  const mg = D.systeme.marginal, W = 880, Hh = 260, ml = 60, mr = 10, mt = 14, mb = 36;
  const y1 = Math.max(1, ...mg.map(r => r.eur_mwh)) * 1.15, bw = (W - ml - mr) / mg.length;
  const Y = v => mt + (Hh - mt - mb) * (1 - v / y1);
  let g = [0.25, 0.5, 0.75, 1].map(f => `<line x1="${ml}" y1="${Y(y1 * f)}" x2="${W - mr}" y2="${Y(y1 * f)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="4" y="${Y(y1 * f) + 5}" font-size="16" fill="var(--muted)">${fmt(y1 * f)}</text>`).join("");
  mg.forEach((r, i) => { const x = ml + i * bw + bw * 0.15;
    g += `<rect x="${x}" y="${Y(r.eur_mwh)}" width="${bw * 0.7}" height="${Y(0) - Y(r.eur_mwh)}" fill="var(--accent)"/>` +
      `<text x="${x + bw * 0.35}" y="${Y(r.eur_mwh) - 6}" font-size="16" text-anchor="middle" fill="var(--ink)">${fmt(r.eur_mwh, 1)}</text>` +
      `<text x="${x + bw * 0.35}" y="${Hh - 12}" font-size="16" text-anchor="middle" fill="var(--muted)">${fmt(r.de)}→${fmt(r.a)} GW</text>`; });
  g += `<text x="${ml}" y="${mt - 2}" font-size="16" fill="var(--muted)">€/MWh</text>`;
  document.getElementById("marg").innerHTML = g;
  table("valeur", t.th_val, D.systeme.valeur_flex.map(r => ({_cls: r.id === id ? "sel" : "", _cells: [t.configs[r.config], fmt(r.gw), fmt(r.meur_an, 1), fmt(r.keur_mw_an, 1)]})));
}

function render() {
  const t = T[S.lang]; document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("lang").textContent = t.lang;
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  document.getElementById("voit").innerHTML = t.voit.map(x => `<li>${x}</li>`).join("");
  render_verdict(); render_merite(); render_racc(); render_sys();
  document.getElementById("regles").innerHTML = t.regles.map(x => `<li>${x}</li>`).join("");
  document.getElementById("pistes").innerHTML = D.pistes[S.lang].map(x => `<li>${x}</li>`).join("");
  table("hyp", t.th_hyp, D.hyp.map(h => ({_cells: [h.nom, h.valeur, h.unite, h.source, h.statut]})));
  const m = D.meta;
  document.getElementById("pied").textContent = fill(t.pied, {pommes: m.versions.pommes, craft: m.versions.pommes_craft, linopy: m.versions.linopy,
    highs: m.versions.highspy, n: m.n_resolutions, commit: m.commit_grille, date: m.date});
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr"; render(); };
document.getElementById("serie").onchange = e => { S.serie = e.target.value; render_merite(); };
document.getElementById("variante").onchange = e => { S.variante = e.target.value; render_racc(); };
document.getElementById("racc_serie").onchange = e => { S.rserie = e.target.value; render_racc(); };
document.getElementById("valeur_mw").onchange = e => { S.valeur = e.target.value; render_racc(); };
document.getElementById("config").onchange = e => { S.config = e.target.value; render_sys(); };
render();
</script>
</body>
</html>
