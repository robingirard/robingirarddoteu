const NOMS = {

  en: {tyndp2024: "TYNDP 2024 (ENTSO-E)", tyndp2026: "TYNDP 2026 NT+ (ENTSO-E, draft)", etage1_tyndp2026: "POMMES on TYNDP 2026", fos_sur_mer: "fos-sur-mer (Jodry et al. 2026)"},
};

  en: {h_bas: ["h < 5 €", "hours below 5 €/MWh"], moyenne: ["mean", "mean price (€/MWh)"], ecart_type: ["std dev", "standard deviation (€/MWh)"], h_plafond: ["h ≥ 1,000 €", "hours at 1,000 €/MWh or more"]},
};
const JEUX = Object.keys(D.meta.jeux), N8760 = 8760;
const S = {lang: new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr",
           zone: "FR", annee: 2030, jeu: "tyndp2026", obs: 2024, echelle: "300", indic: "h_bas", pq_annee: 2030};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const col = j => css("--c-" + j);
const fmt = (x, d = 0) => x.toLocaleString(S.lang === "fr" ? "fr-FR" : "en-GB", {maximumFractionDigits: d, minimumFractionDigits: d});
const el = (tag, attrs = {}, txt) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt !== undefined) e.textContent = txt; return e; };
const width = svg => Math.max(300, Math.round(svg.getBoundingClientRect().width) || 640);
const nomCourt = j => NOMS[S.lang][j].split(" (")[0];

function seg(ctl, key, options, absent = () => false) {
  const box = document.querySelector(`[data-ctl="${ctl}"]`); box.innerHTML = "";
  for (const [v, label] of options) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(S[key] === v));
    if (absent(v)) b.classList.add("absent");
    b.onclick = () => { S[key] = v; render(); }; box.appendChild(b);
  }
}

const series = (jeu, zone, annee) => D.series.filter(r => r.jeu === jeu && r.zone === zone && r.annee === annee);
const centrale = (jeu, zone, annee) => D.series.find(r => r.jeu === jeu && r.zone === zone && r.annee === annee && r.central);
const histo = (zone, annee) => D.historique.find(h => h.zone === zone && h.annee === annee);
const annees = zone => [...new Set(D.series.filter(r => r.zone === zone).map(r => r.annee))].sort();
const obsAnnees = zone => D.historique.filter(h => h.zone === zone).map(h => h.annee).sort();

// 1. Monotones
function monotone() {
  const t = T[S.lang], svg = document.getElementById("g_mono"); svg.innerHTML = "";
  const W = width(svg), H = W < 480 ? 270 : 320, L = 44, R = 12, top = 12, B = 40;
  const courbes = JEUX.map(j => [j, D.monotones[`${j}|${S.zone}|${S.annee}`]]).filter(([, m]) => m);
  const h = S.obs ? histo(S.zone, S.obs) : null;
  const sel = D.monotones[`${S.jeu}|${S.zone}|${S.annee}`];
  const vals = [...courbes.flatMap(([j, m]) => j === S.jeu ? [...m.hi, ...m.lo, ...(m.c || [])] : (m.c || [])), ...(h ? h.m : [])];
  const vmin = Math.min(0, ...vals), vmax = Math.max(...vals);
  const ymin = S.echelle === "300" ? Math.max(vmin, -60) : vmin;
  const ymax = S.echelle === "300" ? 300 : vmax * 1.04;
  const ymin2 = ymin < 0 ? Math.floor(ymin / 20) * 20 : 0;
  const x = i => L + (W - L - R) * i, y = v => top + (H - top - B) * (1 - (Math.min(Math.max(v, ymin2), ymax) - ymin2) / (ymax - ymin2));
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  for (let hr = 0; hr <= N8760; hr += W < 480 ? 4000 : 2000) {
    svg.appendChild(el("line", {x1: x(hr / N8760), x2: x(hr / N8760), y1: top, y2: H - B, class: "grid"}));
    svg.appendChild(el("text", {x: x(hr / N8760), y: H - B + 16, "text-anchor": "middle", class: "lbl"}, fmt(hr)));
  }
  const span = ymax - ymin2, ystep = span > 2000 ? 1000 : span > 800 ? 200 : span > 250 ? 50 : 20;
  for (let v = Math.ceil(ymin2 / ystep) * ystep; v <= ymax; v += ystep) {
    svg.appendChild(el("line", {x1: L, x2: W - R, y1: y(v), y2: y(v), class: "grid"}));
    svg.appendChild(el("text", {x: L - 6, y: y(v) + 4, "text-anchor": "end", class: "lbl"}, fmt(v)));
  }
  svg.appendChild(el("text", {x: W - R, y: H - 4, "text-anchor": "end", class: "lbl"}, t.x_mono));
  svg.appendChild(el("text", {x: 12, y: top + (H - top - B) / 2, class: "lbl", transform: `rotate(-90 12 ${top + (H - top - B) / 2})`, "text-anchor": "middle"}, t.y_mono));
  const path = arr => arr.map((v, i) => (i ? "L" : "M") + x(i / (arr.length - 1)).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  if (sel) {
    const band = path(sel.hi) + " " + sel.lo.map((v, i) => [i, v]).reverse().map(([i, v]) => "L" + x(i / (sel.lo.length - 1)).toFixed(1) + "," + y(v).toFixed(1)).join(" ") + " Z";
    svg.appendChild(el("path", {d: band, fill: col(S.jeu), "fill-opacity": 0.16, stroke: "none"}));
  }
  // Ligne des 5 €/MWh
  svg.appendChild(el("line", {x1: L, x2: W - R, y1: y(D.meta.bas), y2: y(D.meta.bas), stroke: css("--low"), "stroke-width": 1.2, "stroke-dasharray": "2 3"}));
  svg.appendChild(el("text", {x: L + 4, y: y(D.meta.bas) - 4, style: `fill:${css("--low")}`}, `${fmt(D.meta.bas)} €/MWh`));
  if (h) svg.appendChild(el("path", {d: path(h.m), fill: "none", stroke: css("--obs"), "stroke-width": 1.6, "stroke-dasharray": "6 4"}));
  for (const [j, m] of courbes) if (j !== S.jeu && m.c)
    svg.appendChild(el("path", {d: path(m.c), fill: "none", stroke: col(j), "stroke-width": 1.6, "stroke-opacity": 0.75}));
  if (sel && sel.c) svg.appendChild(el("path", {d: path(sel.c), fill: "none", stroke: col(S.jeu), "stroke-width": 3}));
  // Les heures sous 5 €/MWh de la série centrale mise en avant : un trait sous l'axe
  const c = centrale(S.jeu, S.zone, S.annee);
  if (c && c.h_bas > 0) {
    const x0 = x(1 - c.h_bas / N8760);
    svg.appendChild(el("line", {x1: x0, x2: x(1), y1: H - B + 3, y2: H - B + 3, stroke: col(S.jeu), "stroke-width": 4}));
  }
  document.getElementById("legend_m").innerHTML = courbes.map(([j, m]) =>
    `<span><i class="l" style="border-color:${col(j)}"></i>${NOMS[S.lang][j]}${j === S.jeu ? ` · ${m.n} ${S.lang === "fr" ? "séries" : "series"}` : ""}</span>`).join("") +
    (h ? `<span><i class="d"></i>${S.lang === "fr" ? "observé" : "observed"} ${S.obs}</span>` : "");
  // Lecture
  const fr = S.lang === "fr", rs = series(S.jeu, S.zone, S.annee), Z = ZONES[S.lang][S.zone];
  let txt;
  if (!rs.length) txt = fr ? `Le jeu ${NOMS.fr[S.jeu]} n'a pas de série pour ${Z} en ${S.annee}.` : `The set ${NOMS.en[S.jeu]} has no series for ${Z} in ${S.annee}.`;
  else {
    const lo = k => fmt(Math.min(...rs.map(r => r[k]))), hi = k => fmt(Math.max(...rs.map(r => r[k])));
    const tete = c ? (fr
      ? `${Z}, ${S.annee}, série centrale de ${nomCourt(S.jeu)} (${c.scenario}, météo ${c.meteo}) : prix moyen <b>${fmt(c.moyenne)} €/MWh</b>, <b>${fmt(c.h_bas)} h sous ${fmt(D.meta.bas)} €/MWh</b> (le trait sous l'axe), ${fmt(c.h_plafond)} h à 1 000 €/MWh ou plus, maximum ${fmt(c.max)} €/MWh.`
      : `${Z}, ${S.annee}, central series of ${nomCourt(S.jeu)} (${c.scenario}, weather ${c.meteo}): mean price <b>${fmt(c.moyenne)} €/MWh</b>, <b>${fmt(c.h_bas)} h below ${fmt(D.meta.bas)} €/MWh</b> (the bar under the axis), ${fmt(c.h_plafond)} h at 1,000 €/MWh or more, maximum ${fmt(c.max)} €/MWh.`)
      : (fr ? `${Z}, ${S.annee} : ${nomCourt(S.jeu)} n'a pas de série centrale ici (le scénario central n'est publié que pour la France cette année-là).`
            : `${Z}, ${S.annee}: ${nomCourt(S.jeu)} has no central series here (the central scenario is published for France only that year).`);
    const plage = rs.length > 1 ? (fr
      ? ` Ses ${rs.length} séries vont de ${lo("moyenne")} à ${hi("moyenne")} €/MWh en moyenne et de ${lo("h_bas")} à ${hi("h_bas")} h sous ${fmt(D.meta.bas)} €/MWh.`
      : ` Its ${rs.length} series range from ${lo("moyenne")} to ${hi("moyenne")} €/MWh on average and from ${lo("h_bas")} to ${hi("h_bas")} h below ${fmt(D.meta.bas)} €/MWh.`) : "";
    txt = tete + plage;
  }
  if (h) txt += fr
    ? ` Observé ${S.obs} : ${fmt(h.moyenne)} €/MWh en moyenne, ${fmt(h.h_bas)} h sous ${fmt(D.meta.bas)} €/MWh, dont ${fmt(h.h_negatif)} h à prix négatif — ce qu'un prix de modèle arrêté à 0 ne montre pas.`
    : ` Observed ${S.obs}: ${fmt(h.moyenne)} €/MWh on average, ${fmt(h.h_bas)} h below ${fmt(D.meta.bas)} €/MWh, ${fmt(h.h_negatif)} of them negative — which a model price floored at 0 cannot show.`;
  if (S.echelle === "300" && vmax > 300) txt += fr ? ` Axe coupé à 300 €/MWh : passez l'échelle sur « toute » pour voir le plafond.` : ` Axis cut at 300 €/MWh: switch the scale to “full” to see the cap.`;
  document.getElementById("read_m").innerHTML = txt;
}

// 2. Indicateurs, série par série
function strip() {
  const t = T[S.lang], svg = document.getElementById("g_strip"); svg.innerHTML = "";
  const k = S.indic, fr = S.lang === "fr", Z = ZONES[S.lang][S.zone];
  const lignes = JEUX.filter(j => series(j, S.zone, S.annee).length);
  const obs = D.historique.filter(h => h.zone === S.zone);
  const W = width(svg), L = 4, R = 14, top = 14, rowH = 46, nrows = lignes.length + (obs.length ? 1 : 0), H = top + rowH * nrows + 34;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  const all = [...lignes.flatMap(j => series(j, S.zone, S.annee).map(r => r[k])), ...obs.map(h => h[k])];
  const xmax = Math.max(1, ...all) * 1.06;
  const x = v => L + (W - L - R) * v / xmax;
  const nice = [1, 2, 5, 10, 20, 50, 100, 200, 250, 500, 1000, 2000, 5000];
  const step = nice.find(s => xmax / s <= (W < 480 ? 4 : 7)) || 10000;
  for (let v = 0; v <= xmax; v += step) {
    svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - 30, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - 16, "text-anchor": "middle", class: "lbl"}, fmt(v)));
  }
  svg.appendChild(el("text", {x: W - R, y: H - 2, "text-anchor": "end", class: "lbl"}, INDIC[S.lang][k][1]));
  lignes.forEach((j, i) => {
    const y0 = top + i * rowH, yc = y0 + 28, rs = series(j, S.zone, S.annee);
    svg.appendChild(el("text", {x: L, y: y0 + 11, class: "lbl", style: j === S.jeu ? "font-weight:700" : ""}, NOMS[S.lang][j]));
    rs.forEach((r, n) => { if (r.central) return;
      const jitter = ((n * 7919) % 13 - 6) * 1.1;
      svg.appendChild(el("circle", {cx: x(r[k]), cy: yc + jitter, r: j === S.jeu ? 3.6 : 3, fill: col(j), "fill-opacity": j === S.jeu ? 0.6 : 0.35})); });
    rs.filter(r => r.central).forEach(r => { const cx = x(r[k]), s = 7;
      svg.appendChild(el("path", {d: `M${cx},${yc - s} L${cx + s},${yc} L${cx},${yc + s} L${cx - s},${yc} Z`, fill: col(j), stroke: css("--surface"), "stroke-width": 1.5})); });
  });
  if (obs.length) {
    const y0 = top + lignes.length * rowH, yc = y0 + 28;
    svg.appendChild(el("text", {x: L, y: y0 + 11, class: "lbl"}, fr ? "observé 2019-2025" : "observed 2019-2025"));
    obs.forEach((h, n) => {
      svg.appendChild(el("rect", {x: x(h[k]) - 1.5, y: yc - 7, width: 3, height: 14, fill: css("--obs"), "fill-opacity": h.annee === S.obs ? 1 : 0.5}));
      if (h.annee === S.obs || W >= 480) svg.appendChild(el("text", {x: x(h[k]), y: yc + (n % 2 && h.annee !== S.obs ? -10 : 19), "text-anchor": "middle", class: "lbl", style: "font-size:10px"}, String(h.annee).slice(2)));
    });
  }
  document.getElementById("legend_i").innerHTML = lignes.map(j => `<span><i style="background:${col(j)}"></i>${COURT[j]} · ${series(j, S.zone, S.annee).length}</span>`).join("");
  // Lecture
  const cents = lignes.map(j => [j, centrale(j, S.zone, S.annee)]).filter(([, c]) => c).sort((a, b) => a[1][k] - b[1][k]);
  const u = k === "moyenne" || k === "ecart_type" ? " €/MWh" : " h", d = 0;
  let txt = "";
  if (!lignes.length) txt = fr ? `Aucune série pour ${Z} en ${S.annee}.` : `No series for ${Z} in ${S.annee}.`;
  else {
    const a = cents[0], b = cents[cents.length - 1];
    const lo = Math.min(...lignes.flatMap(j => series(j, S.zone, S.annee).map(r => r[k]))), hi = Math.max(...lignes.flatMap(j => series(j, S.zone, S.annee).map(r => r[k])));
    if (cents.length > 1) txt += fr
      ? `${Z}, ${S.annee} : les séries centrales vont de <b>${fmt(a[1][k], d)}${u}</b> (${COURT[a[0]]}) à <b>${fmt(b[1][k], d)}${u}</b> (${COURT[b[0]]}) ; toutes séries confondues, de ${fmt(lo, d)} à ${fmt(hi, d)}${u}.`
      : `${Z}, ${S.annee}: the central series range from <b>${fmt(a[1][k], d)}${u}</b> (${COURT[a[0]]}) to <b>${fmt(b[1][k], d)}${u}</b> (${COURT[b[0]]}); over all series, from ${fmt(lo, d)} to ${fmt(hi, d)}${u}.`;
    else txt += fr ? `${Z}, ${S.annee} : toutes séries confondues, de ${fmt(lo, d)} à ${fmt(hi, d)}${u}.` : `${Z}, ${S.annee}: over all series, from ${fmt(lo, d)} to ${fmt(hi, d)}${u}.`;
  }
  if (obs.length) { const o = obs.map(h => h[k]);
    txt += fr ? ` Observé 2019-2025 : de ${fmt(Math.min(...o), d)} à ${fmt(Math.max(...o), d)}${u}.` : ` Observed 2019-2025: from ${fmt(Math.min(...o), d)} to ${fmt(Math.max(...o), d)}${u}.`; }
  const morale = {
    h_bas: [" Ces heures quasi gratuites nourrissent la demande flexible : électrolyseurs, recharge des véhicules, stockage de chaleur.", " These near-free hours feed flexible demand: electrolysers, EV charging, heat storage."],
    moyenne: [" Deux jeux de même moyenne peuvent avoir des queues très différentes : comparez leurs monotones.", " Two sets with the same mean can have very different tails: compare their duration curves."],
    ecart_type: [" L'écart-type paie le stockage et la flexibilité : il dépend beaucoup des quelques heures les plus chères.", " The standard deviation is what pays storage and flexibility: it hinges on the few most expensive hours."],
    h_plafond: [" Les heures de défaillance d'un modèle sont un artefact de sa conception (plafond, parc fixé) autant qu'un signal.", " A model's scarcity hours are as much an artefact of its design (cap, fixed fleet) as a signal."],
  };
  txt += morale[k][fr ? 0 : 1];
  document.getElementById("read_i").innerHTML = txt;
}

function artefacts() {
  const t = T[S.lang];
  const rows = JEUX.map(j => D.artefacts.find(a => a.jeu === j && a.zone === S.zone && a.annee === S.annee)).filter(Boolean);
  const head = `<thead><tr>${t.th_art.map((h, i) => `<th class="${i ? "n" : ""}">${h}</th>`).join("")}</tr></thead>`;
  const body = rows.map(a => {
    const cap = a.max >= D.meta.plafond ? (S.lang === "fr" ? `plafond : ${fmt(a.h_au_max)} h à ${fmt(a.max)} €/MWh · ` : `cap: ${fmt(a.h_au_max)} h at ${fmt(a.max)} €/MWh · `) : "";
    const pal = a.paliers.map(([p, n]) => `${fmt(p, p % 1 ? 2 : 0)} €/MWh <small>(${fmt(n)} h)</small>`).join(", ");
    const serie = a.meteo === "inconnue" ? a.scenario : `${a.scenario}, ${a.meteo}`;
    return `<tr class="art"><td>${COURT[a.jeu]}<br><small>${serie}</small></td><td class="n">${fmt(a.valeurs_distinctes)}</td>` +
      `<td class="n">${fmt(100 * a.part_top)} %</td><td class="n">${fmt(a.h_zero)}</td><td class="n">${fmt(a.max)}</td></tr>` +
      `<tr class="pal"><td colspan="5">${cap}${t.paliers}${S.lang === "fr" ? " :" : ":"} ${pal}</td></tr>`;
  }).join("");
  document.getElementById("t_art").innerHTML = head + "<tbody>" + (body || `<tr><td colspan="5">${S.lang === "fr" ? "Aucune série centrale ici." : "No central series here."}</td></tr>`) + "</tbody>";
}

const LEVIERS = ["meteo", "gaz", "demande", "trajectoire", "modele", "defaillance"];
function pq(lv, a) { return D.pourquoi.find(r => r.levier === lv && r.annee === a); }
function pourquoi() {
  const t = T[S.lang], fr = S.lang === "fr", svg = document.getElementById("g_pq"); svg.innerHTML = "";
  const a = S.pq_annee, W = width(svg), narrow = W < 520, rowH = narrow ? 44 : 34, top = 8;
  const L = narrow ? 8 : 250, R2 = 28, H = top + rowH * LEVIERS.length + 30, xmax = 130;
  const x = v => L + (W - L - R2) * v / xmax;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  for (let v = 0; v <= xmax; v += 20) {
    svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - 28, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - 14, "text-anchor": "middle", class: "lbl"}, fmt(v)));
  }
  svg.appendChild(el("text", {x: W - 4, y: H - 1, "text-anchor": "end", class: "lbl"}, t.axe_p));
  const c = css("--accent");
  LEVIERS.forEach((lv, i) => {
    const r = pq(lv, a), y = top + i * rowH + (narrow ? 30 : rowH / 2);
    svg.appendChild(el("text", narrow ? {x: L, y: y - 14, class: "lbl"} : {x: L - 10, y: y + 4, "text-anchor": "end"}, t.leviers[lv]));
    svg.appendChild(el("line", {x1: x(r.bas), x2: x(r.haut), y1: y, y2: y, stroke: c, "stroke-width": 7, "stroke-linecap": "round"}));
    svg.appendChild(el("text", {x: x(r.bas) - 7, y: y + 4, "text-anchor": "end"}, fmt(r.bas)));
    svg.appendChild(el("text", {x: x(r.haut) + 7, y: y + 4}, fmt(r.haut)));
  });
  document.getElementById("legend_p").textContent = fr
    ? "Gaz 30 €/MWh pour la demande et la trajectoire ; année météo par défaut du TYNDP 2026 (WS003 en 2030, WS071 en 2040) hors météo."
    : "Gas 30 €/MWh for demand and trajectory; TYNDP 2026 default weather year (WS003 in 2030, WS071 in 2040) except for weather.";
  const g = lv => pq(lv, a), p = D.ponderees.filter(r => r.annee === a), pt = j => p.find(r => r.jeu === j);
  const m = g("meteo"), gz = g("gaz"), d = g("demande"), tr = g("trajectoire"), mo = g("modele"), df = g("defaillance");
  const pente = gz.ecart / (D.meta.gaz_haut - D.meta.gaz_bas);
  const L1 = fr ? [
    `<b>Météo</b> : ${fmt(m.bas)} à ${fmt(m.haut)} €/MWh sur ${m.n} années météo (POMMES, gaz du TYNDP). Une série à une seule année météo est un tirage ; pondérer les 3 années du TYNDP par leurs poids officiels donne ${fmt(pt("tyndp2026").ponderee, 1)} €/MWh au TYNDP 2026 (${fmt(pt("tyndp2026").defaut, 1)} à l'année par défaut) et ${fmt(pt("etage1_tyndp2026").ponderee, 1)} à POMMES.`,
    `<b>Gaz</b> de ${D.meta.gaz_bas} à ${D.meta.gaz_haut} €/MWh : ${fmt(gz.bas)} → ${fmt(gz.haut)} €/MWh, soit ${fmt(pente, 2)} €/MWh d'électricité par €/MWh de gaz.`,
    `<b>Demande</b> ±7,5 % : ${fmt(d.bas)} → ${fmt(d.haut)} €/MWh autour de ${fmt(d.milieu)}. +7,5 % ajoute plus que −7,5 % n'enlève : la demande en plus crée des heures de défaillance et efface des heures quasi gratuites.`,
    `<b>Trajectoire française</b> (PPE au lieu du TYNDP) : ${fmt(tr.bas)} contre ${fmt(tr.haut)} €/MWh.`,
    `<b>Modèle</b>, à hypothèses, gaz, CO₂ et météo égaux : POMMES ${fmt(mo.bas, 1)}, TYNDP 2026 ${fmt(mo.haut, 1)} €/MWh, ${fmt(mo.ecart, 1)} €/MWh d'écart. Le jeu papier_tyndp décompose cet écart, levier d'exploitation par levier (mini-projet).`,
    `<b>Heures de défaillance</b> : les ${df.n} heures à 1 000 €/MWh ou plus du TYNDP 2024 (NT ${a}) pèsent ${fmt(df.ecart, 1)} €/MWh de sa moyenne (${fmt(df.haut, 1)} → ${fmt(df.bas, 1)}) ; écart-type ${fmt(df.ecart_type)} → ${fmt(df.ecart_type_sans)} €/MWh.`,
  ] : [
    `<b>Weather</b>: ${fmt(m.bas)} to ${fmt(m.haut)} €/MWh over ${m.n} weather years (POMMES, TYNDP gas). A single-weather-year series is one draw; weighting the 3 TYNDP years by their official weights gives ${fmt(pt("tyndp2026").ponderee, 1)} €/MWh for TYNDP 2026 (${fmt(pt("tyndp2026").defaut, 1)} at the default year) and ${fmt(pt("etage1_tyndp2026").ponderee, 1)} for POMMES.`,
    `<b>Gas</b> from ${D.meta.gaz_bas} to ${D.meta.gaz_haut} €/MWh: ${fmt(gz.bas)} → ${fmt(gz.haut)} €/MWh, i.e. ${fmt(pente, 2)} €/MWh of electricity per €/MWh of gas.`,
    `<b>Demand</b> ±7.5 %: ${fmt(d.bas)} → ${fmt(d.haut)} €/MWh around ${fmt(d.milieu)}. +7.5 % adds more than −7.5 % removes: the extra demand creates scarcity hours and removes near-free ones.`,
    `<b>French trajectory</b> (PPE instead of TYNDP): ${fmt(tr.bas)} against ${fmt(tr.haut)} €/MWh.`,
    `<b>Model</b>, at equal assumptions, gas, CO₂ and weather: POMMES ${fmt(mo.bas, 1)}, TYNDP 2026 ${fmt(mo.haut, 1)} €/MWh, ${fmt(mo.ecart, 1)} €/MWh apart. The papier_tyndp set takes this gap apart, one operating lever at a time (mini-project).`,
    `<b>Scarcity hours</b>: the ${df.n} hours at 1,000 €/MWh or more of TYNDP 2024 (NT ${a}) weigh ${fmt(df.ecart, 1)} €/MWh of its mean (${fmt(df.haut, 1)} → ${fmt(df.bas, 1)}); standard deviation ${fmt(df.ecart_type)} → ${fmt(df.ecart_type_sans)} €/MWh.`,
  ];
  document.getElementById("read_p").innerHTML = L1.map(s => `<li>${s}</li>`).join("");
  document.getElementById("t_pal").innerHTML = `<thead><tr>${t.th_pal.map((h, i) => `<th class="${i ? "n" : ""}">${h}</th>`).join("")}</tr></thead><tbody>` +
    D.paliers.map(r => `<tr><td>${COURT[r.jeu]}</td><td class="n">${fmt(r.gaz, 1)}</td><td class="n">${fmt(r.co2, 1)}</td><td class="n">${fmt(r.combustible_co2, 1)}</td>` +
      `<td class="n">${fmt(r.palier, 1)} <small>(${fmt(r.heures)} h)</small></td><td class="n">${fmt(r.rendement_implicite, 2)}</td><td class="n">${fmt(r.nucleaire_h)}</td></tr>`).join("") + "</tbody>";
  const r24 = D.paliers.find(r => r.jeu === "tyndp2024"), r26 = D.paliers.find(r => r.jeu === "tyndp2026");
  const pc = (u, v) => fmt(100 * (u / v - 1)), pcC = pc(r26.combustible_co2, r24.combustible_co2), pcP = pc(r26.palier, r24.palier);
  const cc = Object.entries(D.ccgt).sort((u, v) => v[0] - u[0]).map(([r, v]) => `${fmt(v, 1)} €/MWh (${fr ? "rendement" : "efficiency"} ${fmt(+r, 2)})`).join(", ");
  document.getElementById("read_pal").innerHTML = fr
    ? `Les cycles combinés français du TYNDP 2026 coûtent ${cc} selon leur rendement : ce sont les paliers de ce jeu. Le TYNDP 2024 paie le gaz moins cher et le CO₂ plus cher : le gaz + CO₂ du TYNDP 2026 coûte ${pcC} % de plus, son palier ${pcP} % de plus seulement, parce que les rendements implicites diffèrent (${fmt(r24.rendement_implicite, 2)} contre ${fmt(r26.rendement_implicite, 2)}). Celui de POMMES, au-dessus de tout cycle combiné français, n'en est pas un (non identifié ici). Palier nucléaire : ${fmt(D.meta.nucleaire, 2)} €/MWh, commun au TYNDP 2026 et à POMMES.`
    : `The French combined cycles of TYNDP 2026 cost ${cc} by efficiency: these are the steps of that set. TYNDP 2024 pays cheaper gas and dearer CO₂: the gas + CO₂ of TYNDP 2026 costs ${pcC} % more, its step only ${pcP} % more, because the implied efficiencies differ (${fmt(r24.rendement_implicite, 2)} against ${fmt(r26.rendement_implicite, 2)}). POMMES' step, above every French combined cycle, is not one of them (not identified here). Nuclear step: ${fmt(D.meta.nucleaire, 2)} €/MWh, shared by TYNDP 2026 and POMMES.`;
  document.getElementById("t_hyp").innerHTML = `<thead><tr>${t.th_hyp.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.hyp.map(h => `<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}</td><td>${h.statut}</td></tr>`).join("") + "</tbody>";
}

function tout() {
  const t = T[S.lang];
  const cell = (rs, c, k, dd = 0) => `${c ? `<b>${fmt(c[k], dd)}</b>` : "–"}<br><small>[${fmt(Math.min(...rs.map(r => r[k])), dd)} – ${fmt(Math.max(...rs.map(r => r[k])), dd)}]</small>`;
  const rows = JEUX.filter(j => series(j, S.zone, S.annee).length).map(j => {
    const rs = series(j, S.zone, S.annee), c = centrale(j, S.zone, S.annee);
    return `<tr><td>${COURT[j]}${c ? "" : ` <small>(${t.pas_centrale})</small>`}</td><td class="n">${rs.length}</td>` +
      ["moyenne", "ecart_type", "h_bas", "h_plafond"].map(k => `<td class="n">${cell(rs, c, k)}</td>`).join("") + "</tr>";
  });
  const h = S.obs ? histo(S.zone, S.obs) : null;
  if (h) rows.push(`<tr><td>${S.lang === "fr" ? "observé" : "observed"} ${S.obs}</td><td class="n">1</td>` +
    ["moyenne", "ecart_type", "h_bas", "h_plafond"].map(k => `<td class="n">${fmt(h[k])}</td>`).join("") + "</tr>");
  document.getElementById("t_tout").innerHTML = `<thead><tr>${t.th_tout.map((x, i) => `<th class="${i ? "n" : ""}">${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody>`;
}

function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("lang").textContent = t.lang;
  document.getElementById("perimetre").textContent = D.carte.perimetre[S.lang];
  const ans = annees(S.zone);
  if (!ans.includes(S.annee)) S.annee = ans.reduce((a, b) => Math.abs(b - S.annee) < Math.abs(a - S.annee) ? b : a);
  const obsA = obsAnnees(S.zone);
  if (S.obs && !obsA.includes(S.obs)) S.obs = obsA.length ? obsA[obsA.length - 1] : 0;
  seg("zone", "zone", D.meta.zones.map(z => [z, z]));
  document.querySelectorAll('[data-ctl="zone"] button').forEach(b => { b.title = ZONES[S.lang][b.textContent]; });
  seg("annee", "annee", ans.map(a => [a, String(a)]));
  seg("jeu", "jeu", JEUX.map(j => [j, COURT[j]]), j => !series(j, S.zone, S.annee).length);
  seg("obs", "obs", [...obsA.map(a => [a, String(a)]), [0, t.aucune]]);
  seg("echelle", "echelle", [["300", t.e300], ["tout", t.etout]]);
  seg("indic", "indic", Object.entries(INDIC[S.lang]).map(([k, v]) => [k, v[0]]));
  document.getElementById("consequences").innerHTML = t.consequences.map(c => `<li>${c}</li>`).join("");
  document.getElementById("lim").innerHTML = t.lim.map(x => `<li>${x}</li>`).join("");
  seg("pq_annee", "pq_annee", [[2030, "2030"], [2040, "2040"]]);
  monotone(); strip(); artefacts(); pourquoi(); tout();
  const jeux = JEUX.map(j => { const m = D.meta.jeux[j], cc = (m.licence || "").replace(/-/g, " ").replace("CC BY 4.0", "CC BY 4.0");
    return m.attribution.includes(cc) ? m.attribution : `${m.attribution} (${m.licence})`; }).join(" ; ");
  document.getElementById("pied").innerHTML = `<p>${t.pied.replace("{jeux}", jeux).replace("{hist}", D.meta.historique)
    .replace("{commit}", D.meta.commit).replace("{date}", D.meta.date).replace("{plafond}", fmt(D.meta.plafond))}</p>`;
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr";
  const u = new URL(location.href); u.searchParams.set("lang", S.lang); history.replaceState(null, "", u); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let _rz; addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(() => { monotone(); strip(); pourquoi(); }, 150); });
render();
</script>
</body>
</html>
