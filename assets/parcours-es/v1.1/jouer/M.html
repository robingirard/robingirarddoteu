const S = {lang: new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr", port: "alesund", scen: null};
const fmt = (x, d=0) => x === null || x === undefined ? "—" : Number(x).toLocaleString(S.lang === "fr" ? "fr-FR" : "en-US",
  {maximumFractionDigits: d, minimumFractionDigits: d});
const P = () => D.tables.points.filter(r => r.port === S.port);
const CO2C = () => D.meta.prix_co2_central;
const central = () => P().find(r => r.id === `${S.port}_co2_${CO2C()}`) || P().find(r => r.id.endsWith("central")) || P()[0];
const last = r => r.annees[r.annees.length - 1];
const partMoy = r => r.annees.reduce((s, a) => s + a.ops_mwh, 0) / r.annees.reduce((s, a) => s + a.demande_mwh, 0);
function label(r) {
  const t = T[S.lang].scen, k = r.id.slice(r.port.length + 1);
  if (k.startsWith("co2_")) return t.co2.replace("{x}", k.slice(4)) + (Number(k.slice(4)) === CO2C() ? " · " + t.central : "");
  return t[k] || k;
}
function table(id, head, rows) {
  document.getElementById(id).innerHTML = `<thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr class="${r._cls || ""}">${r._cells.map(c => `<td>${c}</td>`).join("")}</tr>`).join("") + "</tbody>";
}
function render_verdict() {
  const t = T[S.lang], r = central(), a = last(r);
  const eq = a.ops_mw.filter(x => x > 0.05).length;
  const tonne = r.cout_tonne_evitee === null ? "" : (r.cout_tonne_evitee < 0 ? t.tonne_neg.replace("{t}", fmt(-r.cout_tonne_evitee))
    : t.tonne_pos.replace("{t}", fmt(r.cout_tonne_evitee)));
  document.getElementById("verdict").textContent = t.verdict.replace("{port}", t.port[S.port].split(" — ")[0]).replace("{co2}", fmt(r.prix_co2))
    .replace("{ops}", fmt(a.ops_total_mw, 1)).replace("{postes}", t.postes(eq))
    .replace("{reseau}", a.renforcement_mw > 0.05 ? t.reseau.replace("{r}", fmt(a.renforcement_mw, 1)) : "")
    .replace("{pv}", a.pv_mw > 0.05 ? t.pv.replace("{pv}", fmt(a.pv_mw, 1)).replace("{b}", fmt(a.batterie_mwh || 0, 1)) : "")
    .replace("{part}", fmt(100 * partMoy(r))).replace("{atc}", fmt(r.atc_meur, 2)).replace("{atc0}", fmt(r.atc_0_meur, 2))
    .replace("{ate}", fmt(r.ate_t)).replace("{ate0}", fmt(r.ate_0_t)).replace("{tonne}", tonne)
    .replace("{neuf}", a.ops_total_mw - a.ops_neuf_mw > 0.05 ? (a.ops_neuf_mw > 0.05 ? t.neuf.replace("{n}", fmt(a.ops_neuf_mw, 1)) : t.aucun_neuf) : "")
    + (a.ops_total_mw - a.ops_neuf_mw > 0.05 ? t.existant : "");
}
function render_front() {
  const t = T[S.lang], pts = P().filter(r => r.id.includes("_co2_")).sort((a, b) => a.prix_co2 - b.prix_co2);
  const ob = P().find(r => r.id.endsWith("obligation")), c = central();
  const all = [...pts, ...(ob ? [ob] : [])];
  const xs = [...all.map(r => r.ate_t), c.ate_0_t].map(v => v / 1000), ys = [...all.map(r => r.atc_meur), c.atc_0_meur];
  const W = 880, Hh = 340, ml = 70, mr = 16, mt = 14, mb = 40;
  const x0 = 0, x1 = Math.max(...xs) * 1.08, y0 = Math.min(...ys) * 0.9, y1 = Math.max(...ys) * 1.08;
  const X = v => ml + (W - ml - mr) * (v - x0) / (x1 - x0), Y = v => mt + (Hh - mt - mb) * (1 - (v - y0) / (y1 - y0));
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const vy = y0 + (y1 - y0) * i / 4, vx = x0 + (x1 - x0) * i / 4;
    g += `<line x1="${ml}" y1="${Y(vy)}" x2="${W - mr}" y2="${Y(vy)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="6" y="${Y(vy) + 4}" font-size="17" fill="var(--muted)">${fmt(vy, 1)}</text>`;
    g += `<text x="${X(vx)}" y="${Hh - 22}" font-size="17" fill="var(--muted)" text-anchor="middle">${fmt(vx, 1)}</text>`;
  }
  g += `<text x="${W - mr}" y="${Hh - 6}" font-size="17" fill="var(--muted)" text-anchor="end">${t.axe_x}</text><text x="${ml}" y="${mt - 2}" font-size="17" fill="var(--muted)">${t.axe_y}</text>`;
  g += `<path d="${pts.map((r, i) => `${i ? "L" : "M"}${X(r.ate_t / 1000).toFixed(1)},${Y(r.atc_meur).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>`;
  g += pts.map(r => `<circle cx="${X(r.ate_t / 1000)}" cy="${Y(r.atc_meur)}" r="${r === c ? 6 : 4.5}" fill="var(--accent)"/><text x="${X(r.ate_t / 1000) + 7}" y="${Y(r.atc_meur) - 7}" font-size="17" fill="var(--ink)">${fmt(r.prix_co2)}</text>`).join("");
  g += `<circle cx="${X(c.ate_0_t / 1000)}" cy="${Y(c.atc_0_meur)}" r="6" fill="var(--danger)"/>`;
  if (ob) { const x = X(ob.ate_t / 1000), y = Y(ob.atc_meur); g += `<path d="M${x},${y - 7}L${x + 7},${y}L${x},${y + 7}L${x - 7},${y}Z" fill="var(--ok)"/>`; }
  document.getElementById("front").innerHTML = g;
  document.getElementById("front_leg").innerHTML = `<span style="--c:var(--accent)">${t.leg_front.pareto}</span><span style="--c:var(--danger)">${t.leg_front.zero}</span><span style="--c:var(--ok)">${t.leg_front.oblig}</span>`;
}
function render_traj() {
  const t = T[S.lang], sel = document.getElementById("scen");
  if (!S.scen || !P().some(r => r.id === S.scen)) S.scen = central().id;
  sel.innerHTML = P().map(r => `<option value="${r.id}"${r.id === S.scen ? " selected" : ""}>${label(r)}</option>`).join("");
  const r = P().find(r => r.id === S.scen);
  table("traj", t.th_traj, r.annees.map(a => ({_cells: [a.annee, a.escales, a.en_rade, fmt(a.pointe_mw, 1), a.ops_mw.map(x => fmt(x, 1)).join(" · "),
    fmt(a.reseau_mw, 1), fmt(a.pv_mw, 1), `${fmt(a.batterie_mw || 0, 1)} / ${fmt(a.batterie_mwh || 0, 1)}`, fmt(100 * a.part_ops) + " %",
    fmt(a.cout_meur, 2), fmt(a.co2_t)]})));
}
function render_sens() {
  const t = T[S.lang], c = central();
  table("sens", t.th_sens, P().map(r => { const a = last(r); return {_cls: r === c ? "sel" : "", _cells: [label(r), fmt(r.atc_meur, 2), fmt(r.ate_t),
    fmt(a.ops_total_mw, 1), fmt(a.renforcement_mw, 1), fmt(a.pv_mw, 1), fmt(a.batterie_mwh || 0, 1), fmt(100 * partMoy(r)) + " %",
    r.cout_tonne_evitee === null ? "—" : fmt(r.cout_tonne_evitee)]}; }));
}
function render_sem() {
  const t = T[S.lang], w = D.tables.semaines.find(s => s.port === S.port);
  if (!w) return;
  document.getElementById("sem_note").textContent = t.sem_note.replace("{j}", Math.floor(w.heure_0 / 24) + 1);
  const n = w.demande.length, W = 880, Hh = 300, ml = 48, mr = 8, mt = 10, mb = 24;
  const ymax = Math.max(1, ...w.demande, ...w.pv) * 1.08;
  const X = i => ml + (W - ml - mr) * i / (n - 1), Y = v => mt + (Hh - mt - mb) * (1 - v / ymax);
  const line = (a, c, wd) => `<path d="${a.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${c}" stroke-width="${wd}"/>`;
  let g = [0.25, 0.5, 0.75, 1].map(f => `<line x1="${ml}" y1="${Y(ymax * f)}" x2="${W - mr}" y2="${Y(ymax * f)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="4" y="${Y(ymax * f) + 4}" font-size="16" fill="var(--muted)">${fmt(ymax * f, 0)}</text>`).join("");
  for (let d = 1; d < 7; d++) g += `<line x1="${X(24 * d)}" y1="${mt}" x2="${X(24 * d)}" y2="${Hh - mb}" stroke="var(--line)"/>`;
  g += line(w.pv, "var(--sun)", 1.4) + line(w.aux, "var(--danger)", 1.4) + line(w.ops, "var(--accent)", 1.8) + line(w.demande, "var(--ink)", 1.2);
  document.getElementById("sem").innerHTML = g;
  document.getElementById("sem_leg").innerHTML = ["demande:var(--ink)", "ops:var(--accent)", "aux:var(--danger)", "pv:var(--sun)"]
    .map(s => { const [k, c] = s.split(/:(.*)/); return `<span style="--c:${c}">${t.leg_sem[k]}</span>`; }).join("");
}
function render() {
  const t = T[S.lang]; document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("lang").textContent = t.lang;
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  document.getElementById("ports").innerHTML = D.meta.ports.map(p => `<button type="button" data-port="${p}" aria-pressed="${p === S.port}">${t.port[p]}</button>`).join("");
  document.querySelectorAll("#ports button").forEach(b => b.onclick = () => { S.port = b.dataset.port; S.scen = null; render(); });
  render_verdict(); render_front(); render_traj(); render_sens(); render_sem();
  document.getElementById("lit").innerHTML = t.lit.map(x => `<li>${x}</li>`).join("");
  document.getElementById("pistes").innerHTML = D.pistes[S.lang].map(x => `<li>${x}</li>`).join("");
  table("hyp", t.th_hyp, D.hyp.map(h => ({_cells: [h.nom, h.valeur, h.unite, h.source, h.statut]})));
  const m = D.meta;
  document.getElementById("pied").textContent = t.pied.replace("{pommes}", m.versions.pommes).replace("{craft}", m.versions.pommes_craft)
    .replace("{linopy}", m.versions.linopy).replace("{highs}", m.versions.highspy)
    .replace("{n}", m.n_resolutions).replace("{commit}", m.commit_grille).replace("{date}", m.date);
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr"; render(); };
document.getElementById("scen").onchange = e => { S.scen = e.target.value; render_traj(); };
render();
</script>
