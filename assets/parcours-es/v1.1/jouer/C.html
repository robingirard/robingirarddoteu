function seg(ctl, key, options) {

}

function froid(t) { const a = Math.max(0, Math.min(1, (t + 11) / 11)); return a < 0.5 ? mix(css("--c1"), css("--c3"), a * 2) : mix(css("--c3"), css("--c4"), (a - 0.5) * 2); }

  const pire = L.reduce((a, r) => r.surcout_systeme_meur_max > a.surcout_systeme_meur_max ? r : a, b);
  document.getElementById("read_sens").innerHTML = fr
    ? `Le surcoût médian va de ${fmt(Math.min(...m) / 1000, 1)} (${noms(lo)}) à ${fmt(Math.max(...m) / 1000, 1)} Md€/an (${noms(hi)}), contre ${fmt(b.surcout_systeme_meur_med / 1000, 1)} pour le cas : aucune de ces hypothèses ne change l'ordre de grandeur, ni l'écart d'un hiver à l'autre. Le pire hiver monte à ${fmt(pire.surcout_systeme_meur_max / 1000, 1)} Md€/an avec ${court(pire)}, à peine au-dessus du combustible évité (${fmt(pire.combustible_evite_meur_med / 1000, 1)}).`
    : `The median extra cost ranges from ${fmt(Math.min(...m) / 1000, 1)} (${noms(lo)}) to ${fmt(Math.max(...m) / 1000, 1)} bn€/yr (${noms(hi)}), against ${fmt(b.surcout_systeme_meur_med / 1000, 1)} for the case: none of these assumptions changes the order of magnitude, nor the spread between winters. The worst winter reaches ${fmt(pire.surcout_systeme_meur_max / 1000, 1)} bn€/yr with ${court(pire)}, barely above the avoided fuel (${fmt(pire.combustible_evite_meur_med / 1000, 1)}).`;
}

function limites() { document.getElementById("limites").innerHTML = LIMITES[S.lang].map(x => `<li>${x}</li>`).join(""); }

function hyp() {
  const t = T[S.lang];
  document.getElementById("hyp").innerHTML = `<thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.hyp.map(h => `<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}</td><td>${h.statut}</td></tr>`).join("") + "</tbody>";
}

function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  document.getElementById("lang").textContent = t.lang;
  seg("part", "part", (S.voisins === "isolee" ? [1] : [0.25, 0.5, 1]).map(p => [p, `${fmt(100 * p)} %`]));
  seg("voisins", "voisins", [["moyens", t.v_moyens], ["isolee", t.v_isolee]]);
  seg("hiver", "hiver", [["WS037", t.h37], ["WS060", t.h60]]);
  seg("part2", "part2", [0, 0.25, 0.5, 1].map(p => [p, `${fmt(100 * p)} %`]));
  bars(); area(); demande(); sensibilites(); limites(); hyp();
  const ref = D.meta.jeux.etage1_tyndp2026, v = D.meta.versions, versions = `pommes ${v.pommes}, pommes_craft ${v.pommes_craft}`;
  document.getElementById("pied").innerHTML = `<p>${t.pied.replace("{ref}", `${ref.attribution} (${ref.licence})`).replace("{versions}", versions)
    .replace("{n}", D.meta.n_resolutions).replace("{grille}", D.meta.commit_grille).replace("{commit}", D.meta.commit).replace("{date}", D.meta.date)}</p>`;
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr";
  const u = new URL(location.href); u.searchParams.set("lang", S.lang); history.replaceState(null, "", u); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let _rz; addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(render, 150); });
render();
</script>
