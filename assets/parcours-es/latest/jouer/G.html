  table("leviers", t.th_lev, D.tables.variantes.map(r => ({_cells: [
    t.levier[r.variante] || r.variante, fmt(r.defaillance_gwh_3ws), fmt(r.defaillance_max_gw_3ws),
    fmt(r.cout_meur_3ws), fmt(r.defaillance_gwh_pire), fmt(r.semaine_pire_gwh)]})));
}
function fa_grille(valeurs, meilleur) {
  // lignes : EnR ×, turbine ; colonnes : GW de stockage de 100 h ; valeurs[i] suit l'ordre de D.tables.fer_air.points
  const t = T[S.lang], P = D.tables.fer_air.points;
  const gw = [...new Set(P.map(r => r.fer_air_gw))].sort((a, b) => a - b);
  const lignes = [...new Set(P.map(r => `${r.vre}|${r.turbine_gw}`))];
  return {head: [t.fa_th0, ...gw.map(g => t.fa_col.replace("{gw}", fmt(g)))], rows: lignes.map(l => {
    const [k, tu] = l.split("|").map(Number);
    return {_cells: [t.fa_ligne.replace("{k}", fmt(k, 1)).replace("{tu}", tu > 0 ? t.fa_tu : ""), ...gw.map(g => {
      const i = P.findIndex(r => r.vre === k && r.turbine_gw === tu && r.fer_air_gw === g);
      const v = valeurs[i];
      return v === null || v === undefined ? "—" : (i === meilleur ? `<span class="best">${fmt(v, 1)}</span>` : fmt(v, 1));
    })]};
  })};
}
function fa_meilleur(cout, tu) {
  const P = D.tables.fer_air.points;
  let b = -1;
  cout.forEach((c, i) => { if (c !== null && (tu || P[i].turbine_gw === 0) && (b < 0 || c < cout[b])) b = i; });
  return b;
}
function render_fer_air() {
  const t = T[S.lang], F = D.tables.fer_air, P = F.points;
  let g = fa_grille(P.map(r => r.delestage_twh), -1);
  table("fa_deles", g.head, g.rows);
  const sel = document.getElementById("fa_jeu");
  sel.innerHTML = F.jeux.map(j => `<option value="${j.jeu}"${j.jeu === S.fa_jeu ? " selected" : ""}>${t.fa_jeux[j.jeu] || j.jeu}${j.eur_kwh === null ? "" : ` (${fmt(j.eur_kwh, 1)} €/kWh)`}</option>`).join("");
  const j = F.jeux.find(x => x.jeu === S.fa_jeu) || F.jeux[0];
  const bs = fa_meilleur(j.cout, false), ba = fa_meilleur(j.cout, true);
  g = fa_grille(j.cout, ba);
  table("fa_cout", g.head, g.rows);
  document.querySelectorAll("#fa_cout span.best").forEach(e => e.parentElement.classList.add("best"));
  const nom = i => t.fa_ligne.replace("{k}", fmt(P[i].vre, 1)).replace("{tu}", P[i].turbine_gw > 0 ? t.fa_tu : "") +
    (P[i].fer_air_gw > 0 ? t.fa_fa.replace("{gw}", fmt(P[i].fer_air_gw)) : "");
  const sans = F.jeux[0], r = fa_meilleur(sans.cout, false);
  document.getElementById("fa_verdict").textContent = j.eur_kwh === null ? "" : t.fa_verdict
    .replace("{jeu}", t.fa_jeux[j.jeu]).replace("{c}", fmt(j.eur_kwh, 1)).replace("{sans}", nom(bs)).replace("{cs}", fmt(j.cout[bs], 1))
    .replace("{ref}", fmt(sans.cout[r], 1)).replace("{refnom}", nom(r)).replace("{avec}", nom(ba)).replace("{ca}", fmt(j.cout[ba], 1));
}
function render_mix() {
  const t = T[S.lang];
  table("mix", t.th_mix, D.tables.mix.map(r => ({_cells: [
    r.zone, fmt(r.facteur_echelle, 2), fmt(r.demande_twh, 0), fmt(r.enr_twh, 0), fmt(r.lac_twh, 0),
    fmt(r.pv_gw + r.pv_toiture_gw, 0), fmt(r.eolien_terrestre_gw, 0), fmt(r.eolien_mer_gw, 0),
    fmt(r.batterie_gwh, 0), fmt(r.step_gw, 0)]})));
}
function render_chart() {
  const t = T[S.lang], ext = D.tables.extraits.find(e => e.variante === S.variante) || D.tables.extraits[0];
  const n = ext.demande_gw.length, W = 880, H = 300, ml = 46, mr = 8, mt = 10, mb = 24;
  const X = i => ml + (W - ml - mr) * i / (n - 1), Y = v => mt + (H - mt - mb) * (1 - v / ymax);
  const all = [...ext.demande_gw, ...ext.enr_gw, ...ext.lac_gw, ...ext.step_gw, ...ext.batterie_gw];
  const ymax = Math.max(10, ...ext.demande_gw, ...ext.defaillance_gw) * 1.05;
  const line = a => a.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const bars = ext.defaillance_gw.map((v, i) => v > 0.05
    ? `<rect x="${(X(i) - 1.6).toFixed(1)}" y="${Y(v).toFixed(1)}" width="3.2" height="${(Y(0) - Y(v)).toFixed(1)}" fill="var(--danger)"/>` : "").join("");
  document.getElementById("chart").innerHTML =
    `<line x1="${ml}" y1="${Y(0)}" x2="${W - mr}" y2="${Y(0)}" stroke="var(--line)"/>` +
    [0.25, 0.5, 0.75, 1].map(f => `<line x1="${ml}" y1="${Y(ymax * f)}" x2="${W - mr}" y2="${Y(ymax * f)}" stroke="var(--line)" stroke-dasharray="3 4"/>
      <text x="4" y="${Y(ymax * f) + 4}" font-size="10" fill="var(--muted)">${fmt(ymax * f, 0)}</text>`).join("") +
    bars +
    `<path d="${line(ext.demande_gw)}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>` +
    `<path d="${line(ext.enr_gw)}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>` +
    `<path d="${line(ext.lac_gw.map((v, i) => v + ext.step_gw[i] + ext.batterie_gw[i] + (ext.fer_air_gw ? ext.fer_air_gw[i] : 0)))}" fill="none" stroke="#2a9d8f" stroke-width="1.4"/>` +
    `<text x="${ml}" y="${H - 6}" font-size="10" fill="var(--muted)">${t.semaine_note} — ${ext.variante}</text>`;
  document.getElementById("legend").innerHTML =
    `<span style="--c:var(--ink)">${t.legende.demande}</span><span style="--c:var(--accent)">${t.legende.enr}</span>
     <span style="--c:#2a9d8f">${t.legende.lac}</span><span style="--c:var(--danger)">${t.legende.def}</span>`;
}
function render() {
  const t = T[S.lang]; document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("lang").textContent = t.lang;
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  const sel = document.getElementById("variante");
  sel.innerHTML = D.tables.extraits.map(e => `<option value="${e.variante}"${e.variante === S.variante ? " selected" : ""}>${t.levier[e.variante] || e.variante}</option>`).join("");
  render_verdict(); render_scan(); render_leviers(); render_fer_air(); render_mix(); render_chart();
  document.getElementById("lim").innerHTML = t.lim.map(x => `<li>${x}</li>`).join("");
  table("hyp", t.th_hyp, D.hyp.map(h => ({_cells: [h.nom, h.valeur, h.unite, h.source, h.statut]})));
  const m = D.meta;
  document.getElementById("pied").textContent = t.pied.replace("{pommes}", m.versions.pommes).replace("{craft}", m.versions.pommes_craft)
    .replace("{linopy}", m.versions.linopy).replace("{highs}", m.versions.highspy)
    .replace("{n}", m.n_resolutions).replace("{commit}", m.commit).replace("{date}", m.date);
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr"; render(); };
document.getElementById("variante").onchange = e => { S.variante = e.target.value; render_chart(); };
document.getElementById("fa_jeu").onchange = e => { S.fa_jeu = e.target.value; render_fer_air(); };
render();
</script>
</body>
</html>
