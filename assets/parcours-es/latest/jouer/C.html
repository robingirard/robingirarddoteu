  hit.addEventListener("pointermove", ev => { const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.round((ev.clientX - r.left - L) / (r.width - L - R2) * (n - 1))));
    tip.innerHTML = `${t.jours} ${fmt(i / 24, 1)} · ${fmt(e.temperature[i], 1)} °C<br>${t.demande} : ${fmt(e.demande[i], 1)} GW<br>${t.pac} : ${fmt(e.pac[i], 1)} GW<br>${t.manque} : <b>${fmt(e.defaillance[i], 1)} GW</b><br>${S.lang === "fr" ? "import" : "imports"} ${fmt(e.import[i], 1)} GW · ${S.lang === "fr" ? "prix" : "price"} ${fmt(e.prix[i])} €/MWh`;
    tip.style.display = "block"; tip.style.left = Math.min(ev.clientX + 12, innerWidth - 290) + "px"; tip.style.top = (ev.clientY + 12) + "px"; });
  hit.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  document.getElementById("legend_h").innerHTML = `<span><i style="background:${css("--c1")}"></i>${t.demande}</span><span><i style="background:${css("--c2")}"></i>${t.pac}</span><span><i style="background:repeating-linear-gradient(45deg,${css("--ink")} 0 2px,transparent 2px 5px)"></i>${t.manque}</span>`;
  const m = Math.max(...e.defaillance), fr = S.lang === "fr";
  document.getElementById("read_h").innerHTML = fr
    ? `Pointe de la demande : <b>${fmt(Math.max(...tot))} GW</b>, dont ${fmt(Math.max(...e.pac))} GW de PAC au plus froid (${fmt(Math.min(...e.temperature), 1)} °C). Puissance manquante au pire : <b>${fmt(m, 1)} GW</b>.`
    : `Demand peak: <b>${fmt(Math.max(...tot))} GW</b>, of which ${fmt(Math.max(...e.pac))} GW of heat pumps at the coldest (${fmt(Math.min(...e.temperature), 1)} °C). Missing capacity at worst: <b>${fmt(m, 1)} GW</b>.`;
}

function demande() {
  const t = T[S.lang], g = D.tables.regression, fr = S.lang === "fr";
  document.getElementById("read_d").innerHTML = fr
    ? `Régression sur les 3 années publiées : R² = ${fmt(g.r2, 3)}, écart-type des résidus ${fmt(g.rmse_gw, 1)} GW ; le chauffage pèse ${fmt(g.gradient_gw_par_degre, 1)} GW par degré sous ${fmt(g.seuil)} °C (température lissée sur ${fmt(g.tau_h)} h).`
    : `Regression on the 3 published years: R² = ${fmt(g.r2, 3)}, residual standard deviation ${fmt(g.rmse_gw, 1)} GW; heating weighs ${fmt(g.gradient_gw_par_degre, 1)} GW per degree below ${fmt(g.seuil)} °C (temperature smoothed over ${fmt(g.tau_h)} h).`;
  document.getElementById("tab_d").innerHTML = `<thead><tr>${t.th_d.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.tables.validation.map(r => `<tr><td>${r.ws}</td><td class="num">${fmt(r.energie_twh, 1)}</td><td class="num">${fmt(r.energie_tyndp_twh, 1)}</td><td class="num">${fmt(r.pointe_gw, 1)}</td><td class="num">${fmt(r.pointe_tyndp_gw, 1)}</td><td class="num">${fmt(r.ecart_type_gw, 1)}</td></tr>`).join("") + "</tbody>";
  const svg = document.getElementById("scatter"); svg.innerHTML = "";
  const base = R.filter(r => r.voisins === "moyens" && r.part === 0), ref = Object.fromEntries(D.tables.prix_reference.map(r => [r.ws, r.prix_moyen]));
  const W = width(svg), L = 40, R2 = 10, top = 10, B = 38, H = W < 480 ? 230 : 260, lo = 25, hi = 85;
  const x = v => L + (W - L - R2) * (v - lo) / (hi - lo), y = v => top + (H - top - B) * (1 - (v - lo) / (hi - lo));
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  for (let v = 30; v <= hi; v += 10) { svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - B, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - B + 15, "text-anchor": "middle", class: "lbl"}, v));
    svg.appendChild(el("line", {x1: L, x2: W - R2, y1: y(v), y2: y(v), class: "grid"}));
    svg.appendChild(el("text", {x: L - 6, y: y(v) + 4, "text-anchor": "end", class: "lbl"}, v)); }
  svg.appendChild(el("line", {x1: x(lo), x2: x(hi), y1: y(lo), y2: y(hi), stroke: css("--muted"), "stroke-dasharray": "4 3"}));
  svg.appendChild(el("text", {x: W - R2, y: H - 4, "text-anchor": "end", class: "lbl"}, t.axe_sx));
  svg.appendChild(el("text", {x: L + 4, y: top + 10, class: "lbl"}, t.axe_sy));
  base.forEach(r => { const c = el("circle", {cx: x(ref[r.ws]), cy: y(r.prix_moyen), r: 4.5, fill: froid(r.t_min), stroke: css("--surface"), "stroke-width": 1.2});
    svg.appendChild(c); hover(c, `<b>${r.ws}</b><br>${fmt(ref[r.ws], 1)} → ${fmt(r.prix_moyen, 1)} €/MWh`); });
  const xs = base.map(r => ref[r.ws]), ys = base.map(r => r.prix_moyen), mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
  const cov = xs.reduce((s, v, i) => s + (v - mx) * (ys[i] - my), 0), sx = Math.sqrt(xs.reduce((s, v) => s + (v - mx) ** 2, 0)), sy = Math.sqrt(ys.reduce((s, v) => s + (v - my) ** 2, 0));
  document.getElementById("read_s").innerHTML = fr
    ? `Corrélation ${fmt(cov / sx / sy, 2)} entre les deux prix moyens, mais le modèle les resserre (${fmt(Math.min(...ys))} à ${fmt(Math.max(...ys))} €/MWh, contre ${fmt(Math.min(...xs))} à ${fmt(Math.max(...xs))}) : ses voisins ont le même prix toutes les années.`
    : `Correlation ${fmt(cov / sx / sy, 2)} between the two average prices, but the model narrows them (${fmt(Math.min(...ys))} to ${fmt(Math.max(...ys))} €/MWh, against ${fmt(Math.min(...xs))} to ${fmt(Math.max(...xs))}): its neighbours have the same price every year.`;
}

function hyp() {
  const t = T[S.lang];
  document.getElementById("hyp").innerHTML = `<thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.hyp.map(h => `<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}</td><td>${h.statut}</td></tr>`).join("") + "</tbody>";
}

function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  document.getElementById("lang").textContent = t.lang;
  seg("part", "part", (S.voisins === "isolee" ? [1] : [0.25, 0.5, 1]).map(p => [p, `${fmt(100 * p)} %`]));
  seg("voisins", "voisins", [["moyens", t.v_moyens], ["isolee", t.v_isolee]]);
  seg("hiver", "hiver", [["WS037", t.h37], ["WS060", t.h60]]);
  seg("part2", "part2", [0, 0.25, 0.5, 1].map(p => [p, `${fmt(100 * p)} %`]));
  bars(); area(); demande(); hyp();
  const ref = D.meta.jeux.etage1_tyndp2026;
  document.getElementById("pied").innerHTML = `<p>${t.pied.replace("{ref}", `${ref.attribution} (${ref.licence})`).replace("{n}", D.meta.n_resolutions)
    .replace("{commit}", D.meta.commit).replace("{date}", D.meta.date)}</p>`;
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr";
  const u = new URL(location.href); u.searchParams.set("lang", S.lang); history.replaceState(null, "", u); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let _rz; addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(render, 150); });
render();
</script>
</body>
</html>
