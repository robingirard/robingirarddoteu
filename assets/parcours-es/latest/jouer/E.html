* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; margin: 10px 0 12px; }
.controls label { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--ink); padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.readout { font-size: 15px; background: color-mix(in srgb, var(--accent) 8%, transparent); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
svg { display: block; width: 100%; max-width: 100%; }
svg text { fill: var(--ink); font-size: 12px; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .lbl { fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; z-index: 5; max-width: 280px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; vertical-align: top; padding: 6px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
details summary { cursor: pointer; font-weight: 600; }
footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
footer p { margin: 0 0 6px; }
@media (max-width: 520px) { h1 { font-size: 1.35rem; } .controls { gap: 8px 12px; } }

    g_aide: "Jeu POMMES sur le TYNDP 2026 : un contexte par prix du gaz (de 15 à 65 €/MWh). La chaudière à gaz paie ce gaz (et 45 €/t de CO₂, ETS2) ; l'électricité est celle que ce même gaz a produite.",
    axe_g: "prix du gaz du scénario (€/MWh)", axe_g2: "€/MWh de vapeur",
    h_titre: "Hypothèses : valeur, unité, source, statut", h_aide: "Elles sont lues par le modèle (hypotheses.yaml) : en changer une change le calcul.",
    th: ["hypothèse", "valeur", "unité", "source", "statut"],
    pied: "Prix : {jeux}. Calcul : pommes 0.9.0, pommes_craft 0.5.1, HiGHS ; {n} résolutions, commit {commit}, {date}. Coûts des chaudières : Danish Energy Agency, Technology Data for Industrial Process Heat (2026). Artefacts des prix de modèle : paliers, plancher à 0 €/MWh, plafond de défaillance. Prix fos-sur-mer et TYNDP 2024 : année météo différente de celle du TYNDP 2026. Code (MIT) et notebook : dossier E_vapeur du dépôt pommes-case-studies.",
  },
  en: {
    kicker: "POMMES case study · case E", lang: "Français",
    titre: "Steam at 180 °C: electrify everything, keep gas, or both?",
    chapo: "A plant's gas boiler reaches the end of its life. What should replace it: an electric boiler, an electric boiler with heat storage, or both boilers side by side, each running in the hours when it is cheaper? pommes sizes each option at least cost, under several price futures.",
    ecole: "A textbook case, not a forecast",
    v_titre: "1. The steam cost, option by option",
    v_aide: "Central series of each price set. Gas comes from the scenario that produced these prices. A 1.25 MW boiler falls under ETS2, the carbon market for buildings, transport and small industrial sites: its CO₂ costs 45 €/t by default. Full cost: annuities, O&M, energy.",
    annee: "Year", co2: "CO₂ price paid by the site", sto: "Heat storage cost",
    co2_ets2: "ETS2 (45 €/t)", co2_jeu: "EU ETS: the scenario's", co2_0: "none", sto_c: "61 €/kWh (ADEME)", sto_b: "24 €/kWh (SINTEF)",
    axe: "steam cost (€/MWh)", tableau: "The table",
    th_v: ["price set", "configuration", "€/MWh", "gas (MW)", "electric (MW)", "storage (MWh)", "electric share", "tCO₂/yr"],
    s_titre: "2. Electrify or keep gas: the verdict from one series to the next",
    s_aide: "Each dot is a price series (weather year, variant, gas-price context). Left of the line, the best all-electric option (with or without storage) beats the gas boiler; right of it, gas wins. ETS2 CO₂ (45 €/t).",
    axe_s: "electric − gas (€/MWh of steam)", gauche: "← electric wins", droite: "gas wins →",
    g_titre: "3. When gas goes up, electricity goes up too",
    g_aide: "POMMES set on TYNDP 2026: one context per gas price (15 to 65 €/MWh). The gas boiler pays that gas (and 45 €/t of CO₂, ETS2); the electricity is the one this same gas produced.",
    axe_g: "scenario gas price (€/MWh)", axe_g2: "€/MWh of steam",
    h_titre: "Assumptions: value, unit, source, status", h_aide: "They are read by the model (hypotheses.yaml): changing one changes the result.",
    th: ["assumption", "value", "unit", "source", "status"],
    pied: "Prices: {jeux}. Computation: pommes 0.9.0, pommes_craft 0.5.1, HiGHS; {n} solves, commit {commit}, {date}. Boiler costs: Danish Energy Agency, Technology Data for Industrial Process Heat (2026). Model price artefacts: steps, floor at 0 €/MWh, scarcity cap. fos-sur-mer and TYNDP 2024 prices: weather year different from TYNDP 2026's. Code (MIT) and notebook: folder E_vapeur of the pommes-case-studies repository.",
  },
};
const NOMS = {
  fr: {tyndp2024: "TYNDP 2024", tyndp2026: "TYNDP 2026 NT+", etage1_tyndp2026: "POMMES sur le TYNDP 2026", fos_sur_mer: "fos-sur-mer",
       gaz: "gaz seul", electrique: "électrique seul", electrique_stockage: "électrique + stockage", hybride: "hybride gaz-électrique", hybride_stockage: "hybride + stockage"},
  en: {tyndp2024: "TYNDP 2024", tyndp2026: "TYNDP 2026 NT+", etage1_tyndp2026: "POMMES on TYNDP 2026", fos_sur_mer: "fos-sur-mer",
       gaz: "gas only", electrique: "electric only", electrique_stockage: "electric + storage", hybride: "gas-electric hybrid", hybride_stockage: "hybrid + storage"},
};
const JEUX = ["tyndp2024", "tyndp2026", "etage1_tyndp2026", "fos_sur_mer"];
const CONFIGS = ["gaz", "electrique", "electrique_stockage", "hybride", "hybride_stockage"];
const S = {lang: new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr", annee: 2030, co2: "ets2", sto: "central"};
const R = D.tables.sites;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (x, d = 0) => x.toLocaleString(S.lang === "fr" ? "fr-FR" : "en-GB", {maximumFractionDigits: d, minimumFractionDigits: d});
const el = (tag, attrs = {}, txt) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt !== undefined) e.textContent = txt; return e; };
const tip = document.getElementById("tip");
function hover(node, html) {
  node.addEventListener("pointerenter", () => { tip.innerHTML = html; tip.style.display = "block"; });
  node.addEventListener("pointermove", e => { tip.style.left = Math.min(e.clientX + 12, innerWidth - 290) + "px"; tip.style.top = (e.clientY + 12) + "px"; });
  node.addEventListener("pointerleave", () => { tip.style.display = "none"; });
}
function seg(ctl, key, options, after) {
  const box = document.querySelector(`[data-ctl="${ctl}"]`); box.innerHTML = "";
  for (const [v, label] of options) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(S[key] === v));
    b.onclick = () => { S[key] = v; render(); }; box.appendChild(b);
  }
}
function width(svg) { return Math.max(300, Math.round(svg.getBoundingClientRect().width) || 640); }

// Les lignes du verdict pour l'année, le CO₂ et le coût du stockage choisis.
function verdict() {
  const grp = {ets2: "central", jeu: "central_co2_scenario", zero: "central_co2_0"}[S.co2];
  const rows = R.filter(r => r.annee === S.annee && r.groupe === grp);
  if (S.co2 === "ets2" && S.sto === "bas") {
    const bas = R.filter(r => r.annee === S.annee && r.groupe === "central_stockage_bas");
    return rows.map(r => bas.find(b => b.jeu === r.jeu && b.config === r.config) || r);
  }
  return rows;
}

function bars() {
  const t = T[S.lang], N = NOMS[S.lang], svg = document.getElementById("bars"); svg.innerHTML = "";
  const rows = verdict(), W = width(svg), L = 6, R2 = 34, top = 6, h = 13, gap = 3, block = CONFIGS.length * (h + gap) + 26;
  const H = top + block * JEUX.length + 30, xmax = Math.max(...rows.map(r => r.cout_vapeur)) * 1.05;
  const x = v => L + (W - L - R2) * v / xmax;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  for (let v = 0; v <= xmax; v += xmax > 80 ? 20 : 10) {
    svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - 26, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - 12, "text-anchor": "middle", class: "lbl"}, fmt(v)));
  }
  svg.appendChild(el("text", {x: W - 4, y: H - 0, "text-anchor": "end", class: "lbl"}, t.axe));
  JEUX.forEach((j, i) => {
    const y0 = top + i * block, rs = rows.filter(r => r.jeu === j);
    const best = rs.reduce((a, b) => (b.cout_vapeur < a.cout_vapeur ? b : a), rs[0]);
    svg.appendChild(el("text", {x: L, y: y0 + 13, style: "font-weight:600"}, N[j]));
    CONFIGS.forEach((c, k) => {
      const r = rs.find(q => q.config === c); if (!r) return;
      const y = y0 + 20 + k * (h + gap);
      const b = el("rect", {x: x(0), y, width: Math.max(1, x(r.cout_vapeur) - x(0)), height: h, rx: 3, fill: css("--c-" + c)});
      svg.appendChild(b);
      svg.appendChild(el("text", {x: x(r.cout_vapeur) + 4, y: y + h - 2, style: r === best ? "font-weight:700" : ""}, fmt(r.cout_vapeur)));
      const hit = el("rect", {x: 0, y: y - 1, width: W, height: h + 2, fill: "transparent"}); svg.appendChild(hit);
      hover(hit, `<b>${N[j]} · ${N[c]}</b><br>${fmt(r.cout_vapeur, 1)} €/MWh · ${fmt(r.cout_keur)} k€/an<br>` +
        `${S.lang === "fr" ? "gaz" : "gas"} ${fmt(r.gaz_mw, 2)} MW · ${S.lang === "fr" ? "électrique" : "electric"} ${fmt(r.elec_mw, 2)} MW · ${S.lang === "fr" ? "stockage" : "storage"} ${fmt(r.stockage_mwh, 1)} MWh<br>` +
        `${S.lang === "fr" ? "part électrique" : "electric share"} ${fmt(100 * r.part_electrique)} % · ${fmt(r.emissions_t)} tCO₂`);
    });
  });
  document.getElementById("legend_v").innerHTML = CONFIGS.map(c => `<span><i style="background:${css("--c-" + c)}"></i>${N[c]}</span>`).join("");
  // Lecture : la meilleure, et le duel tout électrique / gaz
  const fr = S.lang === "fr";
  const lignes = JEUX.map(j => {
    const rs = rows.filter(r => r.jeu === j), get = c => rs.find(r => r.config === c);
    const best = rs.reduce((a, b) => (b.cout_vapeur < a.cout_vapeur ? b : a));
    const el_ = Math.min(get("electrique").cout_vapeur, get("electrique_stockage").cout_vapeur), g = get("gaz").cout_vapeur;
    const duel = Math.abs(el_ - g) < 1 ? (fr ? "électrique et gaz à égalité" : "electric and gas tied")
      : el_ < g ? (fr ? `l'électrique bat le gaz de ${fmt(g - el_)} €/MWh` : `electric beats gas by ${fmt(g - el_)} €/MWh`)
      : (fr ? `le gaz bat l'électrique de ${fmt(el_ - g)} €/MWh` : `gas beats electric by ${fmt(el_ - g)} €/MWh`);
    return `<b>${N[j]}</b> : ${N[best.config]} (${fmt(best.cout_vapeur)} €/MWh, ${fmt(100 * best.part_electrique)} % ${fr ? "à l'électricité" : "electric"}) ; ${duel}`;
  });
  document.getElementById("read_v").innerHTML = (fr ? `En ${S.annee}, la solution la moins chère :<br>` : `In ${S.annee}, the cheapest option:<br>`) + lignes.join("<br>");
  document.getElementById("tab_v").innerHTML = `<thead><tr>${t.th_v.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr><td>${N[r.jeu]}</td><td>${N[r.config]}</td><td class="num">${fmt(r.cout_vapeur, 1)}</td><td class="num">${fmt(r.gaz_mw, 2)}</td><td class="num">${fmt(r.elec_mw, 2)}</td><td class="num">${fmt(r.stockage_mwh, 1)}</td><td class="num">${fmt(100 * r.part_electrique)} %</td><td class="num">${fmt(r.emissions_t)}</td></tr>`).join("") + "</tbody>";
}

// Une valeur par série : meilleure solution tout électrique − gaz seul (CO₂ de l'ETS2 par défaut).
function duels(annee) {
  const rows = R.filter(r => r.annee === annee && !r.groupe.startsWith("central_"));
  const key = r => `${r.jeu}|${r.scenario}|${r.meteo}|${r.groupe}`, m = new Map();
  for (const r of rows) { const k = key(r); if (!m.has(k)) m.set(k, {}); m.get(k)[r.config] = r; }
  return [...m.values()].filter(v => v.gaz && v.electrique).map(v => ({
    jeu: v.gaz.jeu, scenario: v.gaz.scenario, meteo: v.gaz.meteo, central: v.gaz.central, gazp: v.gaz.gaz,
    d: Math.min(v.electrique.cout_vapeur, (v.electrique_stockage || v.electrique).cout_vapeur) - v.gaz.cout_vapeur}));
}

function strip() {
  const t = T[S.lang], N = NOMS[S.lang], svg = document.getElementById("strip"); svg.innerHTML = "";
  const pts = duels(S.annee), W = width(svg), L = 6, R2 = 10, top = 30, rowH = 42, H = top + rowH * JEUX.length + 40;
  const lim = Math.max(10, ...pts.map(p => Math.abs(p.d))) * 1.08, x = v => L + (W - L - R2) * (v + lim) / (2 * lim);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  const step = lim > 40 ? 20 : 10;
  for (let v = -Math.floor(lim / step) * step; v <= lim; v += step) {
    svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - 34, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - 20, "text-anchor": "middle", class: "lbl"}, fmt(v)));
  }
  svg.appendChild(el("line", {x1: x(0), x2: x(0), y1: 16, y2: H - 34, stroke: css("--zero"), "stroke-width": 1.5}));
  svg.appendChild(el("text", {x: x(0) - 6, y: 12, "text-anchor": "end", class: "lbl"}, t.gauche));
  svg.appendChild(el("text", {x: x(0) + 6, y: 12, class: "lbl"}, t.droite));
  svg.appendChild(el("text", {x: W - R2, y: H - 4, "text-anchor": "end", class: "lbl"}, t.axe_s));
  JEUX.forEach((j, i) => {
    const yc = top + 18 + i * rowH;
    svg.appendChild(el("text", {x: L, y: yc - 8, class: "lbl"}, N[j]));
    pts.filter(p => p.jeu === j).forEach((p, k) => {
      const c = el("circle", {cx: x(p.d), cy: yc + 8 + ((k * 7) % 5 - 2) * 2.2, r: p.central ? 6 : 4.5, fill: css("--j-" + j),
        "fill-opacity": p.central ? 1 : 0.6, stroke: css("--surface"), "stroke-width": 1.5});
      svg.appendChild(c);
      hover(c, `<b>${N[j]}</b> · ${p.scenario} · ${p.meteo}<br>${S.lang === "fr" ? "gaz" : "gas"} ${fmt(p.gazp, 1)} €/MWh<br>${t.axe_s} : <b>${fmt(p.d, 1)}</b>`);
    });
  });
  document.getElementById("legend_s").innerHTML = JEUX.map(j => `<span><i style="background:${css("--j-" + j)};border-radius:50%"></i>${N[j]} · ${pts.filter(p => p.jeu === j).length}</span>`).join("");
  const n = pts.length, el_ = pts.filter(p => p.d < 0).length, fr = S.lang === "fr";
  document.getElementById("read_s").innerHTML = fr
    ? `En ${S.annee}, sur ${n} séries de prix, l'électrique (avec ou sans stockage) bat le gaz dans <b>${el_}</b> et perd dans <b>${n - el_}</b>. Dans les deux cas, l'hybride fait mieux que l'un et l'autre.`
    : `In ${S.annee}, out of ${n} price series, electric (with or without storage) beats gas in <b>${el_}</b> and loses in <b>${n - el_}</b>. Either way, the hybrid does better than both.`;
}

function gas() {
  const t = T[S.lang], N = NOMS[S.lang], svg = document.getElementById("gas"); svg.innerHTML = "";
  const rows = R.filter(r => r.famille === "gaz" && r.annee === S.annee), W = width(svg), H = W < 480 ? 250 : 290;
  const L = 40, R2 = 12, top = 10, B = 40, ymax = Math.max(...R.filter(r => r.famille === "gaz").map(r => r.cout_vapeur)) * 1.05;
  const x = v => L + (W - L - R2) * (v - 10) / 60, y = v => top + (H - top - B) * (1 - v / ymax);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  for (let v = 10; v <= 70; v += 10) { svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - B, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - B + 16, "text-anchor": "middle", class: "lbl"}, v)); }
  for (let v = 0; v <= ymax; v += 20) { svg.appendChild(el("line", {x1: L, x2: W - R2, y1: y(v), y2: y(v), class: "grid"}));
    svg.appendChild(el("text", {x: L - 6, y: y(v) + 4, "text-anchor": "end", class: "lbl"}, v)); }
  svg.appendChild(el("text", {x: W - R2, y: H - 4, "text-anchor": "end", class: "lbl"}, t.axe_g));
  svg.appendChild(el("text", {x: L, y: top + 4, class: "lbl", dx: 4}, t.axe_g2));
  for (const c of ["gaz", "electrique", "hybride"]) {
    const s = rows.filter(r => r.config === c).sort((a, b) => a.gaz - b.gaz);
    svg.appendChild(el("path", {d: s.map((r, k) => `${k ? "L" : "M"}${x(r.gaz).toFixed(1)},${y(r.cout_vapeur).toFixed(1)}`).join(" "), fill: "none", stroke: css("--c-" + c), "stroke-width": 2}));
    s.forEach(r => { const p = el("circle", {cx: x(r.gaz), cy: y(r.cout_vapeur), r: 4, fill: css("--c-" + c), stroke: css("--surface"), "stroke-width": 1.5});
      svg.appendChild(p); hover(p, `<b>${N[c]}</b><br>${S.lang === "fr" ? "gaz" : "gas"} ${fmt(r.gaz)} €/MWh → ${fmt(r.cout_vapeur, 1)} €/MWh`); });
  }
  document.getElementById("legend_g").innerHTML = ["gaz", "electrique", "hybride"].map(c => `<span><i style="background:${css("--c-" + c)}"></i>${N[c]}</span>`).join("");
  const cross = (() => { const g = rows.filter(r => r.config === "gaz").sort((a, b) => a.gaz - b.gaz), e = rows.filter(r => r.config === "electrique").sort((a, b) => a.gaz - b.gaz);
    for (let k = 0; k < g.length; k++) if (e[k].cout_vapeur < g[k].cout_vapeur) return g[k].gaz; return null; })();
  const fr = S.lang === "fr";
  document.getElementById("read_g").innerHTML = cross === null ? (fr ? "Le gaz reste moins cher que l'électrique sur toute la plage." : "Gas stays cheaper than electric over the whole range.")
    : cross <= 15 ? (fr ? `En ${S.annee}, l'électrique bat le gaz dès 15 €/MWh de gaz.` : `In ${S.annee}, electric beats gas from 15 €/MWh of gas.`)
    : (fr ? `En ${S.annee}, l'électrique ne bat le gaz qu'à partir de ${fmt(cross)} €/MWh de gaz : la pente des deux droites diffère peu, parce que le gaz fait aussi le prix de l'électricité.` : `In ${S.annee}, electric only beats gas from ${fmt(cross)} €/MWh of gas: the two slopes differ little, because gas also sets the electricity price.`);
}

function hyp() {
  const t = T[S.lang];
  document.getElementById("hyp").innerHTML = `<thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.hyp.map(h => `<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}</td><td>${h.statut}</td></tr>`).join("") + "</tbody>";
}

function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  document.getElementById("lang").textContent = t.lang;
  const ans = [[2030, "2030"], [2040, "2040"]];
  seg("annee", "annee", ans); seg("annee2", "annee", ans); seg("annee3", "annee", ans);
  seg("co2", "co2", [["ets2", t.co2_ets2], ["jeu", t.co2_jeu], ["zero", t.co2_0]]);
  seg("sto", "sto", [["central", t.sto_c], ["bas", t.sto_b]]);
  document.querySelector('[data-ctl="sto"]').closest("label").style.display = S.co2 === "ets2" ? "" : "none";
  bars(); strip(); gas(); hyp();
  const jeux = JEUX.map(j => `${D.meta.jeux[j].attribution || NOMS[S.lang][j]} (${D.meta.jeux[j].licence})`).join(" ; ");
  document.getElementById("pied").innerHTML = `<p>${t.pied.replace("{jeux}", jeux).replace("{n}", D.meta.n_resolutions)
    .replace("{commit}", D.meta.commit).replace("{date}", D.meta.date)}</p>`;
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr";
  const u = new URL(location.href); u.searchParams.set("lang", S.lang); history.replaceState(null, "", u); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let _rz; addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(render, 150); });
render();
</script>
