// Moyenne des 3 années météo, par (millions, recharge)
function agrege(rows) {
  const m = new Map();
  for (const r of rows) { const k = `${r.millions}|${r.recharge}`; if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
  return [...m.values()].map(g => { const o = {millions: g[0].millions, recharge: g[0].recharge};
    for (const c of Object.keys(g[0])) if (typeof g[0][c] === "number" && c !== "millions") o[c] = moy(g.map(r => r[c]));
    for (const c of Object.keys(g[0])) if (g[0][c] === null) o[c] = null;
    o.min = k => Math.min(...g.map(r => r[k])); o.max = k => Math.max(...g.map(r => r[k]));
    return o; }).sort((a, b) => a.millions - b.millions);
}
