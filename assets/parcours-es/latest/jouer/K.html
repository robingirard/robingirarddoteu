const get = (rows, jeu, rampe, res) => rows.find(r => r.jeu === jeu && r.rampe === rampe && !!r.reservoir === res);

function flex() {
  const t = T[S.lang], svg = document.getElementById("flex"); svg.innerHTML = "";
  const rows = fixes(S.annee, S.co2), W = width(svg), L = 6, R2 = 40, top = 6, h = 13, gap = 2, block = RAMPES.length * (h + gap) + 24;
  const H = top + block * JEUX.length + 30;
  const vals = rows.filter(r => r.valeur_flex !== null).map(r => r.valeur_flex);
  const xmax = Math.max(5, ...vals) * 1.08, x = v => L + (W - L - R2) * Math.max(0, v) / xmax;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  const step = xmax > 60 ? 20 : xmax > 25 ? 10 : 5;
  for (let v = 0; v <= xmax; v += step) {
    svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - 26, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - 12, "text-anchor": "middle", class: "lbl"}, fmt(v)));
  }
  svg.appendChild(el("text", {x: W - 4, y: H, "text-anchor": "end", class: "lbl"}, t.axe_f));
  const lignes = [];
  JEUX.forEach((j, i) => {
    const y0 = top + i * block;
    svg.appendChild(el("text", {x: L, y: y0 + 13, style: "font-weight:600"}, nom(j)));
    RAMPES.forEach((rp, k) => {
      const r = get(rows, j, rp, S.res), y = y0 + 20 + k * (h + gap);
      if (!r) { svg.appendChild(el("text", {x: x(0) + 2, y: y + h - 2, class: "lbl"}, `${t.rampe[rp]} : –`)); return; }
      svg.appendChild(el("rect", {x: x(0), y, width: Math.max(1, x(r.valeur_flex) - x(0)), height: h, rx: 3, fill: css("--r-" + rp)}));
      svg.appendChild(el("text", {x: x(r.valeur_flex) + 4, y: y + h - 2}, fmt(r.valeur_flex, 1)));
      const hit = el("rect", {x: 0, y: y - 1, width: W, height: h + 2, fill: "transparent"}); svg.appendChild(hit);
      hover(hit, `<b>${nom(j)} · ${t.rampe[rp]}${r.reservoir ? (fr() ? " + réservoir" : " + tank") : ""}</b><br>` +
        `${fmt(r.valeur_flex, 1)} €/t ${fr() ? "épargnés" : "saved"} · ${fmt(r.cout_t, 1)} €/t<br>` +
        `H₂ ${pct(r.part_h2)} · ${fr() ? "captage" : "capture"} ${pct(r.part_captage)} · ${fr() ? "gaz" : "gas"} ${pct(r.part_gaz)}<br>` +
        `${fmt(r.emissions_t, 2)} tCO₂/t · CO₂ ${fmt(r.co2)} €/t` + (r.reservoir ? `<br>${fr() ? "réservoir" : "tank"} ${fmt(r.reservoir_h, 1)} h` : ""));
    });
    const lib = get(rows, j, "libre", S.res), j1 = get(rows, j, "24", S.res), sem = get(rows, j, "168", S.res);
    if (lib && lib.valeur_flex > 0.05) {
      const part = r => r ? pct(r.valeur_flex / lib.valeur_flex) : "–";
      lignes.push(fr() ? `<b>${nom(j)}</b> : ${fmt(lib.valeur_flex, 1)} €/t pour le four libre ; une rampe d'un jour en garde ${part(j1)}, d'une semaine ${part(sem)}.`
        : `<b>${nom(j)}</b>: ${fmt(lib.valeur_flex, 1)} €/t for the free shaft; a one-day ramp keeps ${part(j1)}, a one-week ramp ${part(sem)}.`);
    } else if (lib) {
      lignes.push(fr() ? `<b>${nom(j)}</b> : la flexibilité ne vaut rien ici (${fmt(lib.valeur_flex, 1)} €/t) : un seul mode gagne toute l'année.`
        : `<b>${nom(j)}</b>: flexibility is worth nothing here (${fmt(lib.valeur_flex, 1)} €/t): one mode wins all year.`);
    }
  });
  document.getElementById("legend_f").innerHTML = RAMPES.map(rp => `<span><i style="background:${css("--r-" + rp)}"></i>${t.rampe[rp]}</span>`).join("");
  const seuil = rows[0] ? rows.map(r => r.seuil_h2) : [];
  document.getElementById("read_f").innerHTML = lignes.join("<br>") + (S.co2 !== "s" && S.res ? `<br><span class="note">${fr() ? "Avec réservoir, les variantes de CO₂ n'ont que les rampes « figé » et « 1 jour »." : "With a tank, the CO₂ variants only have the « frozen » and « 1 day » ramps."}</span>` : "");
  document.getElementById("tab_f").innerHTML = `<thead><tr>${t.th_f.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    rows.slice().sort((a, b) => JEUX.indexOf(a.jeu) - JEUX.indexOf(b.jeu) || a.reservoir - b.reservoir)
      .map(r => `<tr><td>${nom(r.jeu)}</td><td class="num">${fmt(r.co2, r.co2 % 1 ? 1 : 0)}</td><td>${t.rampe[r.rampe]}</td><td>${r.reservoir ? fmt(r.reservoir_h, 1) + " h" : "–"}</td><td class="num">${fmt(r.valeur_flex, 1)}</td><td class="num">${fmt(r.cout_t, 1)}</td><td class="num">${pct(r.part_h2)}</td><td class="num">${pct(r.part_captage)}</td><td class="num">${fmt(r.emissions_t, 2)}</td></tr>`).join("") + "</tbody>";
}

function tank() {
  const t = T[S.lang], svg = document.getElementById("tank"); svg.innerHTML = "";
  const rows = fixes(S.annee, "s").filter(r => r.jeu === S.jeu), ramps = ["fige", ...RAMPES];
  const W = width(svg), L = 78, R2 = 56, top = 8, rowH = 30, H = top + rowH * ramps.length + 34;
  const xmax = Math.max(5, ...rows.map(r => r.valeur_flex)) * 1.08, x = v => L + (W - L - R2) * Math.max(0, v) / xmax;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  const step = xmax > 60 ? 20 : xmax > 25 ? 10 : 5;
  for (let v = 0; v <= xmax; v += step) {
    svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - 30, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - 16, "text-anchor": "middle", class: "lbl"}, fmt(v)));
  }
  svg.appendChild(el("text", {x: W - 4, y: H - 2, "text-anchor": "end", class: "lbl"}, t.axe_r));
  ramps.forEach((rp, k) => {
    const y = top + 14 + k * rowH, a = get(rows, S.jeu, rp, false), b = get(rows, S.jeu, rp, true);
    svg.appendChild(el("text", {x: L - 8, y: y + 4, "text-anchor": "end"}, t.rampe[rp]));
    if (!a || !b) return;
    const col = rp === "fige" ? css("--muted") : css("--r-" + rp);
    svg.appendChild(el("line", {x1: x(a.valeur_flex), x2: x(b.valeur_flex), y1: y, y2: y, stroke: col, "stroke-width": 2}));
    svg.appendChild(el("circle", {cx: x(a.valeur_flex), cy: y, r: 5.5, fill: css("--surface"), stroke: col, "stroke-width": 2}));
    svg.appendChild(el("circle", {cx: x(b.valeur_flex), cy: y, r: 6, fill: col, stroke: css("--surface"), "stroke-width": 2}));
    svg.appendChild(el("text", {x: Math.max(x(a.valeur_flex), x(b.valeur_flex)) + 10, y: y + 4, class: "lbl"}, `${fmt(b.reservoir_h, 1)} h`));
    const hit = el("rect", {x: 0, y: y - rowH / 2, width: W, height: rowH, fill: "transparent"}); svg.appendChild(hit);
    hover(hit, `<b>${nom(S.jeu)} · ${t.rampe[rp]}</b><br>${fr() ? "sans réservoir" : "no tank"} : ${fmt(a.valeur_flex, 1)} €/t<br>` +
      `${fr() ? "avec réservoir" : "with tank"} : ${fmt(b.valeur_flex, 1)} €/t (${fmt(b.reservoir_mwh)} MWh, ${fmt(b.reservoir_h, 1)} h)`);
  });
  document.getElementById("legend_r").innerHTML = `<span><i style="border:2px solid var(--muted);background:transparent;border-radius:50%"></i>${t.sans}</span><span><i style="background:var(--muted);border-radius:50%"></i>${fr() ? "avec réservoir" : "with tank"}</span>`;
  const g = rp => { const a = get(rows, S.jeu, rp, false), b = get(rows, S.jeu, rp, true); return a && b ? [a, b] : null; };
  const f = g("fige"), s = g("168"), l = g("libre");
  if (!f || !l) { document.getElementById("read_r").innerHTML = ""; return; }
  document.getElementById("read_r").innerHTML = fr()
    ? `${nom(S.jeu)}, ${S.annee}. Un four figé avec réservoir épargne ${fmt(f[1].valeur_flex, 1)} €/t (réservoir de ${fmt(f[1].reservoir_h, 1)} h) ; un four libre sans réservoir, ${fmt(l[0].valeur_flex, 1)} €/t. ` +
      `Une rampe d'une semaine : ${fmt(s[0].valeur_flex, 1)} €/t sans réservoir, ${fmt(s[1].valeur_flex, 1)} avec (${fmt(s[1].reservoir_h, 1)} h). Le réservoir comble surtout l'écart des rampes lentes ; il ne remplace pas un four figé : tenir un mélange constant demanderait de stocker l'hydrogène sur des semaines.`
    : `${nom(S.jeu)}, ${S.annee}. A frozen shaft with a tank saves ${fmt(f[1].valeur_flex, 1)} €/t (tank of ${fmt(f[1].reservoir_h, 1)} h); a free shaft without a tank, ${fmt(l[0].valeur_flex, 1)} €/t. ` +
      `A one-week ramp: ${fmt(s[0].valeur_flex, 1)} €/t without a tank, ${fmt(s[1].valeur_flex, 1)} with (${fmt(s[1].reservoir_h, 1)} h). The tank mostly closes the gap of slow ramps; it does not replace a frozen shaft: holding a constant mix would mean storing hydrogen for weeks.`;
}

function series(svg, H, n, ymin, ymax, ticks) {
  const W = width(svg), L = 36, R2 = 8, top = 6, B = 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  const x = i => L + (W - L - R2) * i / n, y = v => top + (H - top - B) * (1 - (v - ymin) / (ymax - ymin));
  for (const v of ticks) { svg.appendChild(el("line", {x1: L, x2: W - R2, y1: y(v), y2: y(v), class: "grid"}));
    svg.appendChild(el("text", {x: L - 5, y: y(v) + 4, "text-anchor": "end", class: "lbl"}, v)); }
  for (let d = 0; d <= n / 24; d += 2) svg.appendChild(el("text", {x: x(d * 24), y: H - 6, "text-anchor": "middle", class: "lbl"}, `${fr() ? "j" : "d"}${d}`));
  return {x, y, W, L, R2};
}

function heures() {
  const t = T[S.lang];
  const r = R.find(q => q.central && q.annee === S.annee && q.jeu === S.jeu && q.config === S.cfg && q.famille === "rampe");
  const sp = document.getElementById("prix"), sm = document.getElementById("mix"), sd = document.getElementById("dec");
  sp.innerHTML = sm.innerHTML = sd.innerHTML = "";
  if (!r || !r.fenetre_prix) { document.getElementById("read_h").innerHTML = "–"; return; }
  const n = r.fenetre_prix.length, pmax = Math.min(400, Math.max(r.seuil_h2 * 1.3, ...r.fenetre_prix) * 1.05);
  const st = pmax > 200 ? 100 : pmax > 80 ? 40 : 20, tk = []; for (let v = 0; v <= pmax; v += st) tk.push(v);
  const a = series(sp, 150, n, 0, pmax, tk);
  const P = r.fenetre_prix.map(v => Math.min(v, pmax));
  sp.appendChild(el("path", {d: P.map((v, i) => `${i ? "L" : "M"}${a.x(i).toFixed(1)},${a.y(v).toFixed(1)}H${a.x(i + 1).toFixed(1)}`).join(""), fill: "none", stroke: css("--prix"), "stroke-width": 1.5}));
  sp.appendChild(el("line", {x1: a.L, x2: a.W - a.R2, y1: a.y(r.seuil_h2), y2: a.y(r.seuil_h2), stroke: css("--seuil"), "stroke-width": 2, "stroke-dasharray": "5 4"}));
  sp.appendChild(el("text", {x: a.W - a.R2 - 2, y: a.y(r.seuil_h2) - 5, "text-anchor": "end", class: "lbl"}, `${fmt(r.seuil_h2)} €/MWh`));
  const b = series(sm, 130, n, 0, 1, [0, 0.5, 1]);
  const h2 = r.fenetre_h2, cap = r.fenetre_captage;
  const area = (lo, hi) => { let d = ""; for (let i = 0; i < n; i++) d += `${i ? "L" : "M"}${b.x(i).toFixed(1)},${b.y(hi[i]).toFixed(1)}H${b.x(i + 1).toFixed(1)}`;
    for (let i = n - 1; i >= 0; i--) d += `L${b.x(i + 1).toFixed(1)},${b.y(lo[i]).toFixed(1)}H${b.x(i).toFixed(1)}`; return d + "Z"; };
  const z = h2.map(() => 0), s1 = h2.map((v, i) => v + cap[i]), one = h2.map(() => 1);
  sm.appendChild(el("path", {d: area(z, h2), fill: css("--m-h2")}));
  sm.appendChild(el("path", {d: area(h2, s1), fill: css("--m-captage")}));
  sm.appendChild(el("path", {d: area(s1, one), fill: css("--m-gaz")}));
  // survol : une heure
  const hit = el("rect", {x: b.L, y: 0, width: b.W - b.L - b.R2, height: 130, fill: "transparent"}); sm.appendChild(hit);
  const hitp = el("rect", {x: a.L, y: 0, width: a.W - a.L - a.R2, height: 150, fill: "transparent"}); sp.appendChild(hitp);
  for (const [node, sc] of [[hit, b], [hitp, a]]) {
    node.addEventListener("pointermove", e => { const bx = node.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - bx.left) / bx.width * n)));
      tip.innerHTML = `${fr() ? "jour" : "day"} ${Math.floor(i / 24)}, ${i % 24} h<br>${fmt(r.fenetre_prix[i], 1)} €/MWh<br>H₂ ${pct(h2[i])} · ${fr() ? "captage" : "capture"} ${pct(cap[i])} · ${fr() ? "gaz" : "gas"} ${pct(Math.max(0, 1 - h2[i] - cap[i]))}<br>${fr() ? "électrolyseur" : "electrolyser"} ${pct(r.fenetre_electrolyseur[i])}`;
      tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 12, innerWidth - 290) + "px"; tip.style.top = (e.clientY + 12) + "px"; });
    node.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  }
  document.getElementById("legend_h").innerHTML = [["h2", fr() ? "hydrogène" : "hydrogen"], ["captage", fr() ? "gaz + captage" : "gas + capture"], ["gaz", fr() ? "gaz" : "gas"]]
    .map(([k, l]) => `<span><i style="background:${css("--m-" + k)}"></i>${l}</span>`).join("") + `<span><i style="background:${css("--seuil")};height:3px;vertical-align:3px"></i>${fr() ? "prix de bascule" : "switch price"}</span>`;
  // déciles
  const W = width(sd), H = 120, L = 36, R2 = 8, top = 6, B = 22, n10 = 10, bw = (W - L - R2) / n10;
  sd.setAttribute("viewBox", `0 0 ${W} ${H}`); sd.setAttribute("height", H);
  const y = v => top + (H - top - B) * (1 - v);
  for (const v of [0, 0.5, 1]) { sd.appendChild(el("line", {x1: L, x2: W - R2, y1: y(v), y2: y(v), class: "grid"}));
    sd.appendChild(el("text", {x: L - 5, y: y(v) + 4, "text-anchor": "end", class: "lbl"}, pct(v))); }
  r.h2_par_decile.forEach((v, k) => {
    const rect = el("rect", {x: L + k * bw + 1, y: y(v), width: bw - 2, height: Math.max(0, y(0) - y(v)), rx: 3, fill: css("--m-h2")});
    sd.appendChild(rect); sd.appendChild(el("text", {x: L + (k + .5) * bw, y: H - 6, "text-anchor": "middle", class: "lbl"}, `D${k + 1}`));
    const hh = el("rect", {x: L + k * bw, y: 0, width: bw, height: H, fill: "transparent"}); sd.appendChild(hh);
    hover(hh, `${fr() ? "décile" : "decile"} ${k + 1} : H₂ ${pct(v)}`);
  });
  document.getElementById("read_h").innerHTML = fr()
    ? `Sur l'année : ${fmt(r.heures_tout_h2)} h tout hydrogène, ${fmt(r.heures_sans_h2)} h sans hydrogène, ${fmt(r.heures_mixtes)} h de mélange ; ${fmt(r.bascules)} bascules complètes équivalentes. ${fmt(r.heures_sous_seuil)} heures sont sous le prix de bascule (${fmt(r.seuil_h2)} €/MWh). L'électrolyseur tourne à ${pct(r.facteur_charge)} de sa puissance en moyenne et paie l'électricité ${fmt(r.prix_paye_h2, 1)} €/MWh (moyenne de la série : ${fmt(r.prix_moyen, 1)}).`
    : `Over the year: ${fmt(r.heures_tout_h2)} h all-hydrogen, ${fmt(r.heures_sans_h2)} h without hydrogen, ${fmt(r.heures_mixtes)} h of mix; ${fmt(r.bascules)} equivalent full switches. ${fmt(r.heures_sous_seuil)} hours are below the switch price (${fmt(r.seuil_h2)} €/MWh). The electrolyser runs at ${pct(r.facteur_charge)} of its capacity on average and pays ${fmt(r.prix_paye_h2, 1)} €/MWh for electricity (series mean: ${fmt(r.prix_moyen, 1)}).`;
}

// Réservoir que pommes choisit quand on lui en offre un, au même point (électrolyseur optimisé, four libre).
const tankOf = r => { const q = R.find(x => x.famille === "optimise" && x.rampe === "libre" && x.reservoir && x.jeu === r.jeu && x.annee === r.annee && x.co2 === r.co2); return q ? q.reservoir_h : null; };
// Même point, électrolyseur fixé, four libre, sans réservoir.
const fixOf = r => { const q = R.find(x => x.central && x.electrolyseur === "fixe" && x.rampe === "libre" && !x.reservoir && x.jeu === r.jeu && x.annee === r.annee && x.co2 === r.co2); return q ? q.cout_t : null; };
function optimise() {
  const t = T[S.lang];
  const rows = R.filter(r => r.famille === "optimise" && r.rampe === "libre" && !r.reservoir).sort((a, b) => a.annee - b.annee || JEUX.indexOf(a.jeu) - JEUX.indexOf(b.jeu) || a.co2 - b.co2 || a.reservoir - b.reservoir);
  document.getElementById("tab_o").innerHTML = `<thead><tr>${t.th_o.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr><td>${r.annee}</td><td>${nom(r.jeu)}</td><td class="num">${fmt(r.co2, r.co2 % 1 ? 1 : 0)}</td><td class="num">${fmt(r.electrolyseur_mw_e)}</td><td class="num">${fmt(tankOf(r), 1)}</td><td class="num">${pct(r.part_h2)}</td><td class="num">${fmt(r.valeur_flex, 1)}</td><td class="num">${fmt(r.cout_t, 1)}</td><td class="num">${fmt(fixOf(r), 1)}</td></tr>`).join("") + "</tbody>";
  const bati = rows.filter(r => r.electrolyseur_mw_e > 1);
  document.getElementById("read_o").innerHTML = fr()
    ? `pommes construit un électrolyseur dans ${bati.length} cas sur ${rows.length}. Là où il n'en construit pas, le four n'a que le gaz et le gaz avec captage : sa flexibilité ne vaut presque rien. Comparer les deux dernières colonnes : l'électrolyseur fixé coûte bien plus, par tonne, que ce que sa flexibilité rapporte.`
    : `pommes builds an electrolyser in ${bati.length} cases out of ${rows.length}. Where it builds none, the shaft only has gas and gas with capture: its flexibility is worth almost nothing. Compare the last two columns: the fixed electrolyser costs far more, per tonne, than its flexibility earns.`;
}

function hyp() {
  const t = T[S.lang];
  document.getElementById("hyp").innerHTML = `<thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.hyp.map(h => `<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}</td><td>${h.statut}</td></tr>`).join("") + "</tbody>";
  document.getElementById("pistes").innerHTML = D.pistes[S.lang].map(p => `<li>${p}</li>`).join("");
  document.getElementById("lim").innerHTML = t.lim.map(x => `<li>${x}</li>`).join("");
}

function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  document.getElementById("lang").textContent = t.lang;
  const ans = [[2030, "2030"], [2040, "2040"]];
  seg("annee", "annee", ans); seg("annee2", "annee", ans); seg("annee3", "annee", ans);
  seg("co2", "co2", [["s", t.co2_s], ...D.meta.co2_variantes.map(c => [c, `${c} €/t`])]);
  seg("res", "res", [[false, t.sans], [true, t.avec]]);
  const js = JEUX.map(j => [j, nom(j)]); seg("jeu", "jeu", js); seg("jeu2", "jeu", js);
  seg("cfg", "cfg", Object.entries(t.cfgs));
  flex(); tank(); heures(); optimise(); hyp();
  const jeux = JEUX.map(j => `${D.meta.jeux[j].attribution || nom(j)} (${D.meta.jeux[j].licence})`).join(" ; ");
  const v = D.meta.versions || {};
  document.getElementById("pied").innerHTML = `<p>${t.pied.replace("{jeux}", jeux).replace("{pommes}", v.pommes).replace("{craft}", v.pommes_craft)
    .replace("{n}", D.meta.n_resolutions).replace("{commit}", D.meta.commit_grille).replace("{date}", D.meta.date)}</p>`;
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr";
  const u = new URL(location.href); u.searchParams.set("lang", S.lang); history.replaceState(null, "", u); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let _rz; addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(render, 150); });
render();
</script>
