    h_titre: "Assumptions: value, unit, source, status", h_aide: "They are read by the model (hypotheses.yaml): changing one changes the result.",
    th: ["assumption", "value", "unit", "source", "status"],
    l_titre: "3. What the case leaves out",
    lim: [
      "A single price year: the 2030 (or 2040) revenue is held over the battery's 25 years, and 2040 is compared with the cost of a 2030 battery.",
      "Degradation: the battery runs ≈ {cyc} full cycles a year (central TYNDP 2026 series, 2 h), with no cost per cycle and no shortened lifetime.",
      "The cost of capital: 4 % is a planner's rate. At {taux} % over 25 years, a 2-hour battery costs {c_taux} €/kW/yr; over {duree} years at 4 %, {c_duree} (instead of {c0}).",
      "The central cost: the one pommes-tyndp takes from the TYNDP 2024 (192 €/kW + 171 €/kWh, 25 years, 650 €/MW/yr). The TYNDP 2024 document gives 716 €/kW for 4 h, 30 years and 17,912 €/MW/yr of O&M, i.e. {c_doc} €/kW/yr for 2 h: barely more.",
      "Perfect foresight: the battery knows the year's 8,760 prices in advance.",
      "Model prices: steps, hourly time step, floor at 0 €/MWh (never negative), scarcity cap (3,000 €/MWh; 1,000 to 2,864 in TYNDP 2026).",
      "Other revenues and costs: ancillary services (FCR, aFRR), capacity mechanism, grid tariff.",
    ],
    pied: "Prices: {jeux}. Computation: {versions}, HiGHS; {n} solves, grid at commit {grille}, page at commit {commit}, {date}; calibration of s at commit {cal}. Battery cost: TYNDP 2024 (ENTSO-E & ENTSOG) as taken by pommes-tyndp, NREL (2025), BloombergNEF (2025). “Scarcity hours” are those at 1,000 €/MWh or more. Code (MIT) and notebook: folder A_batteries of the pommes-case-studies repository.",
  },
};
const NOMS = {
  fr: {tyndp2024: "TYNDP 2024 (ENTSO-E)", tyndp2026: "TYNDP 2026 NT+ (ENTSO-E, provisoire)", etage1_tyndp2026: "POMMES sur le TYNDP 2026", fos_sur_mer: "fos-sur-mer (Jodry et al. 2026)"},
  en: {tyndp2024: "TYNDP 2024 (ENTSO-E)", tyndp2026: "TYNDP 2026 NT+ (ENTSO-E, draft)", etage1_tyndp2026: "POMMES on TYNDP 2026", fos_sur_mer: "fos-sur-mer (Jodry et al. 2026)"},
};
const JEUX = ["tyndp2024", "tyndp2026", "etage1_tyndp2026", "fos_sur_mer"];
const S = {lang: new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr",
           annee: 2030, duree: 2, cout: "tyndp2024", plafond: "avec", pente: D.calibration.s};
const SP = r => !!r.sans_plafond;
const V = D.tables.verdict, N = D.tables.nieme, C = D.tables.couts, SIGMAX = Math.max(...N.map(r => r.sigma));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const col = j => css("--c-" + j);
const fmt = (x, d = 0) => x.toLocaleString(S.lang === "fr" ? "fr-FR" : "en-GB", {maximumFractionDigits: d, minimumFractionDigits: d});
const cout = (d, v) => C.find(c => c.duree_h === d && c.variante === v).cout;
const el = (tag, attrs = {}, txt) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt !== undefined) e.textContent = txt; return e; };

function seg(ctl, key, options) {
  const box = document.querySelector(`[data-ctl="${ctl}"]`); box.innerHTML = "";
  for (const [v, label] of options) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(S[key] === v));
    b.onclick = () => { S[key] = v; render(); }; box.appendChild(b);
  }
}

// Une valeur par série : la version « sans plafond » si on la demande et qu'elle existe.
function series(annee, duree, plafond) {
  const raw = V.filter(r => r.annee === annee && r.duree_h === duree && !r.sans_plafond);
  if (plafond === "avec") return raw;
  const sans = new Map(V.filter(r => r.annee === annee && r.duree_h === duree && r.sans_plafond)
    .map(r => [r.jeu + r.scenario + r.meteo, r]));
  return raw.map(r => sans.get(r.jeu + r.scenario + r.meteo) || r);
}

function strip() {
  const t = T[S.lang], svg = document.getElementById("strip"); svg.innerHTML = "";
  const rows = series(S.annee, S.duree, S.plafond), c = cout(S.duree, S.cout);
  const W = Math.max(300, Math.round(svg.getBoundingClientRect().width) || 640), L = 4, R = 10, top = 14, rowH = 50, H = top + rowH * JEUX.length + 36;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const xmax = Math.max(c * 1.15, ...rows.map(r => r.revenu)) * 1.05;
  const x = v => L + (W - L - R) * v / xmax;
  let step = xmax > 150 ? 50 : xmax > 60 ? 20 : 10; if (W < 480 && xmax / step > 5) step *= 2;
  for (let v = 0; v <= xmax; v += step) {
    svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - 30, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - 16, "text-anchor": "middle", class: "lbl"}, fmt(v)));
  }
  svg.appendChild(el("text", {x: W - R, y: H - 2, "text-anchor": "end", class: "lbl"}, t.axe_rev));
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  JEUX.forEach((j, i) => {
    const y0 = top + i * rowH, yc = y0 + 30;
    svg.appendChild(el("text", {x: L, y: y0 + 11, class: "lbl"}, NOMS[S.lang][j]));
    const rs = rows.filter(r => r.jeu === j);
    rs.forEach((r, k) => {
      if (r.central) return;
      const jitter = ((k * 7919) % 13 - 6) * 1.2;
      svg.appendChild(el("circle", {cx: x(r.revenu), cy: yc + jitter, r: 3.2, fill: col(j), "fill-opacity": 0.45}));
    });
    rs.filter(r => r.central).forEach(r => {
      const cx = x(r.revenu), s = 7;
      svg.appendChild(el("path", {d: `M${cx},${yc - s} L${cx + s},${yc} L${cx},${yc + s} L${cx - s},${yc} Z`, fill: col(j), stroke: css("--surface"), "stroke-width": 1.5}));
    });
  });
  svg.appendChild(el("line", {x1: x(c), x2: x(c), y1: top - 4, y2: H - 30, stroke: css("--cost"), "stroke-width": 2, "stroke-dasharray": "5 3"}));
  svg.appendChild(el("text", {x: x(c) + 4, y: top + 4, fill: css("--cost"), style: `fill:${css("--cost")}`}, `${t.cout_l} ${fmt(c)}`));
  // Lecture
  const ok = rows.filter(r => r.revenu >= c).length;
  const cent = JEUX.map(j => rows.find(r => r.jeu === j && r.central)).filter(Boolean);
  const lo = Math.min(...rows.map(r => r.revenu)), hi = Math.max(...rows.map(r => r.revenu));
  const parts = cent.map(r => `${NOMS[S.lang][r.jeu].split(" (")[0]} ${fmt(r.revenu)}`).join(" · ");
  document.getElementById("read_v").innerHTML = S.lang === "fr"
    ? `En ${S.annee}, une batterie de ${S.duree} h gagne de <b>${fmt(lo)} à ${fmt(hi)} €/kW/an</b> selon la série (séries centrales : ${parts}). Son coût annuel est de <b>${fmt(c)} €/kW/an</b> : <span class="${ok ? "ok" : "no"}">${ok} série${ok > 1 ? "s" : ""} sur ${rows.length}</span> le couvre${ok > 1 ? "nt" : ""}.`
    : `In ${S.annee}, a ${S.duree}-hour battery earns <b>${fmt(lo)} to ${fmt(hi)} €/kW/yr</b> depending on the series (central series: ${parts}). Its annual cost is <b>${fmt(c)} €/kW/yr</b>: <span class="${ok ? "ok" : "no"}">${ok} series out of ${rows.length}</span> cover it.`;
  document.getElementById("legend_v").innerHTML = JEUX.map(j => {
    const n = rows.filter(r => r.jeu === j).length;
    return `<span><i style="background:${col(j)}"></i>${NOMS[S.lang][j]} · ${n}</span>`; }).join("");
}

// Revenu par kW en fonction de σ = s × N (interpolation linéaire entre les points calculés).
// « sans » : la version sans les heures au plafond si le jeu en a, sinon la série telle quelle (elle n'en a pas).
function courbe(j, plafond = S.plafond) {
  const c0 = V.filter(r => r.jeu === j && r.central && r.annee === 2030 && r.duree_h === 2);
  const n0 = N.filter(r => r.jeu === j);
  const sans = plafond === "sans" && n0.some(SP);
  const r0 = c0.find(r => SP(r) === sans) || c0.find(r => !SP(r));
  const pts = [[0, r0.revenu], ...n0.filter(r => SP(r) === sans).map(r => [r.sigma, r.revenu])].sort((a, b) => a[0] - b[0]);
  return sig => { if (sig > pts[pts.length - 1][0]) return null;
    for (let k = 1; k < pts.length; k++) if (sig <= pts[k][0]) {
      const [a, ra] = pts[k - 1], [b, rb] = pts[k]; return ra + (rb - ra) * (sig - a) / (b - a); }
    return pts[0][1]; };
}

// Taille de flotte jusqu'à laquelle le revenu couvre le coût : 0, Infinity (s = 0), null (au-delà de la grille)
function taille(f, s, c) {
  if (f(0) < c) return 0;
  if (s === 0) return Infinity;
  for (let n = 0; n <= 400; n += 0.05) { const v = f(s * n); if (v === null) return null; if (v < c) return n; }
  return null;
}
function curve() {
  const t = T[S.lang], svg = document.getElementById("curve"); svg.innerHTML = "";
  const s = S.pente, c = cout(2, S.cout), W = Math.max(300, Math.round(svg.getBoundingClientRect().width) || 640), H = W < 480 ? 260 : 300, L = 44, R = 10, top = 12, B = 40, NMAX = 30;
  document.getElementById("lab_s").textContent = t.lab_s.replace("{s}", fmt(s, 1));
  const fs = Object.fromEntries(JEUX.map(j => [j, courbe(j)]));
  const autre = S.plafond === "avec" ? "sans" : "avec";
  const fa = Object.fromEntries(JEUX.map(j => [j, courbe(j, autre)]));
  const ymax = Math.max(c, ...JEUX.map(j => fs[j](0))) * 1.12;
  const x = n => L + (W - L - R) * n / NMAX, y = v => top + (H - top - B) * (1 - v / ymax);
  for (let n = 0; n <= NMAX; n += W < 480 ? 10 : 5) {
    svg.appendChild(el("line", {x1: x(n), x2: x(n), y1: top, y2: H - B, class: "grid"}));
    svg.appendChild(el("text", {x: x(n), y: H - B + 16, "text-anchor": "middle", class: "lbl"}, n));
  }
  const ystep = ymax > 60 ? 20 : 10;
  for (let v = 0; v <= ymax; v += ystep) {
    svg.appendChild(el("line", {x1: L, x2: W - R, y1: y(v), y2: y(v), class: "grid"}));
    svg.appendChild(el("text", {x: L - 6, y: y(v) + 4, "text-anchor": "end", class: "lbl"}, v));
  }
  svg.appendChild(el("text", {x: W - R, y: H - 4, "text-anchor": "end", class: "lbl"}, t.axe_n));
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.appendChild(el("line", {x1: L, x2: W - R, y1: y(c), y2: y(c), stroke: css("--cost"), "stroke-width": 2, "stroke-dasharray": "5 3"}));
  svg.appendChild(el("text", {x: W - R - 2, y: y(c) - 5, "text-anchor": "end", style: `fill:${css("--cost")}`}, `${t.cout_l} ${fmt(c)} €/kW/an`.replace("/an", S.lang === "fr" ? "/an" : "/yr")));
  const lignes = [];
  for (const j of JEUX) {
    let d = "", last = null;
    for (let n = 0; n <= NMAX + 1e-9; n += 0.25) {
      const v = fs[j](s * n); if (v === null) break;
      d += (d ? " L" : "M") + x(n).toFixed(1) + "," + y(Math.max(v, 0)).toFixed(1); last = n;
    }
    svg.appendChild(el("path", {d, fill: "none", stroke: col(j), "stroke-width": 2.5}));
    // N* : revenu = coût, dans la version affichée et dans l'autre (avec ou sans les heures au plafond)
    const r0 = fs[j](0), nstar = taille(fs[j], s, c), nautre = taille(fa[j], s, c);
    lignes.push([j, r0, nstar, nautre]);
    if (nstar > 0 && nstar <= NMAX) svg.appendChild(el("circle", {cx: x(nstar), cy: y(c), r: 5, fill: col(j), stroke: css("--surface"), "stroke-width": 1.5}));
  }
  svg.appendChild(el("text", {x: 12, y: top + (H - top - B) / 2, class: "lbl", transform: `rotate(-90 12 ${top + (H - top - B) / 2})`, "text-anchor": "middle"}, t.axe_r2));
  document.getElementById("legend_n").innerHTML = JEUX.map(j => `<span><i style="background:${col(j)}"></i>${NOMS[S.lang][j]}</span>`).join("");
  const fr = S.lang === "fr";
  const gw = n => n === 0 ? "0 GW" : n === Infinity ? "∞" : n === null ? `> ${fmt(SIGMAX / s)} GW` : `${fmt(n, 1)} GW`;
  const txt = lignes.map(([j, r0, n, na]) => {
    const nom = NOMS[S.lang][j].split(" (")[0];
    const bis = n === na ? "" : (fr ? ` (${gw(na)} ${autre} les heures au plafond)` : ` (${gw(na)} ${autre === "sans" ? "without" : "with"} the scarcity hours)`);
    if (n === 0) return (fr ? `${nom} : pas rentable dès le premier GW (${fmt(r0)} €/kW/an)` : `${nom}: not profitable from the first GW (${fmt(r0)} €/kW/yr)`) + bis;
    if (n === Infinity) return fr ? `${nom} : rentable sans limite (preneur de prix)` : `${nom}: profitable without limit (price taker)`;
    if (n === null) return (fr ? `${nom} : rentable au-delà de ${fmt(SIGMAX / s)} GW (${t.hors})` : `${nom}: profitable beyond ${fmt(SIGMAX / s)} GW (${t.hors})`) + bis;
    return (fr ? `${nom} : rentable jusqu'à <b>${fmt(n, 1)} GW</b>` : `${nom}: profitable up to <b>${fmt(n, 1)} GW</b>`) + bis;
  });
  const qual = S.plafond === "avec" ? (fr ? "avec les heures au plafond" : "with the scarcity hours") : (fr ? "sans les heures au plafond" : "without the scarcity hours");
  document.getElementById("read_n").innerHTML = (fr ? `Avec s = ${fmt(s, 1)} €/MWh par GW, le coût « ${t["c_" + S.cout]} » (${fmt(c)} €/kW/an), ${qual} : ` : `With s = ${fmt(s, 1)} €/MWh per GW, the “${t["c_" + S.cout]}” cost (${fmt(c)} €/kW/yr), ${qual}: `) + txt.join(fr ? " ; " : "; ") + ".";
}

function cal() {
  const t = T[S.lang], K = D.calibration;
  const fr3 = K.lignes.filter(r => r.modele === "france");
  document.getElementById("cal_note").textContent = t.cal_note.replace("{s}", fmt(K.s, 1)).replace("{lo}", fmt(K.lo, 1)).replace("{hi}", fmt(K.hi, 1))
    .replace("{flo}", fmt(Math.min(...fr3.map(r => r.mediane)), 1)).replace("{fhi}", fmt(Math.max(...fr3.map(r => r.mediane)), 1))
    .replace("{fmax}", fmt(Math.max(...fr3.map(r => r.max)), 1));
  document.getElementById("cal").innerHTML = `<thead><tr>${t.cal_th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    K.lignes.map(r => `<tr><td>${t.cal_mod[r.modele]}</td><td>${r.annee}</td><td>${fmt(r.mediane, 2)}</td><td>${fmt(r.min, 2)} – ${fmt(r.max, 2)}</td><td>${r.n}</td></tr>`).join("") + "</tbody>";
}

function lim() {
  const t = T[S.lang], K = D.sensibilites;
  const cyc = V.find(r => r.jeu === "tyndp2026" && r.central && r.annee === 2030 && r.duree_h === 2 && !SP(r)).cycles;
  const v = {cyc: fmt(cyc), taux: fmt(K.taux * 100), duree: fmt(K.duree), c0: fmt(cout(2, "tyndp2024"), 1),
             c_taux: fmt(cout(2, `tyndp2024_taux${Math.round(K.taux * 100)}`), 1), c_duree: fmt(cout(2, `tyndp2024_${K.duree}ans`), 1),
             c_doc: fmt(cout(2, "tyndp2024_doc"), 1)};
  document.getElementById("lim").innerHTML = t.lim.map(x => `<li>${x.replace(/\{(\w+)\}/g, (_, k) => v[k])}</li>`).join("");
}
function hyp() {
  const t = T[S.lang];
  document.getElementById("hyp").innerHTML = `<thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.hyp.map(h => `<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}</td><td>${h.statut}</td></tr>`).join("") + "</tbody>";
}

function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.querySelector('[data-t="perimetre"]').textContent = D.perimetre[S.lang];
  document.getElementById("lang").textContent = t.lang;
  seg("annee", "annee", [[2030, "2030"], [2040, "2040"]]);
  seg("duree", "duree", [[1, "1 h"], [2, "2 h"], [4, "4 h"]]);
  const couts = ["tyndp2024", "nrel_2030", "bnef_europe", "bnef_chine"].map(v => [v, t["c_" + v]]);
  seg("cout", "cout", couts); seg("cout2", "cout", couts);
  seg("plafond", "plafond", [["avec", t.avec], ["sans", t.sans]]); seg("plafond2", "plafond", [["avec", t.avec], ["sans", t.sans]]);
  strip(); curve(); cal(); lim(); hyp();
  const jeux = JEUX.map(j => `${D.meta.jeux[j].attribution || NOMS[S.lang][j]} (${D.meta.jeux[j].licence})`).join(" ; ");
  const v = D.meta.versions || {}, versions = `pommes ${v.pommes}, pommes_craft ${v.pommes_craft}`;
  document.getElementById("pied").innerHTML = `<p>${t.pied.replace("{jeux}", jeux).replace("{versions}", versions).replace("{n}", D.meta.n_resolutions)
    .replace("{grille}", D.meta.commit_grille).replace("{commit}", D.meta.commit).replace("{date}", D.meta.date).replace("{cal}", D.calibration.commit)}</p>`;
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr";
  const u = new URL(location.href); u.searchParams.set("lang", S.lang); history.replaceState(null, "", u); render(); };
document.getElementById("pente").oninput = e => { S.pente = +e.target.value; curve(); };
document.getElementById("recal").onclick = () => { S.pente = D.calibration.s; document.getElementById("pente").value = S.pente; curve(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let _rz; addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(() => { strip(); curve(); }, 150); });
render();
</script>
