ase, not a forecast."},"hyp":[{"bloc":"site","nom":"production d'e-kérosène du site","valeur":"100","unite":"kt/an","source":"choix du cas, ordre de grandeur de l'obligation française de carburants de synthèse de 2030 : 1,2 % en moyenne 2030-2031 de ≈ 6,7 Mt de kérosène (soutes internationales France 2024 : 80,2 TWh, SDES SY032TFR)","statut":"choix du cas"},{"bloc":"site","nom":"soutes internationales France 2024 (kérosène)","valeur":"80.2","unite":"TWh","source":"SDES, bilan énergétique de la France 2024, produits raffinés aériens + maritimes + biokérosène (SY032TFR), cité par le Cerveau (CLM-energy-taxes-soutes-internationales-2024, vérifié)","statut":"vérifié"},{"bloc":"site","nom":"part minimale de carburants de synthèse dans l'aviation (moyenne 2030-2031)","valeur":"0.012","unite":"-","source":"règlement (UE) 2023/2405 (ReFuelEU Aviation), annexe I, point b) : 1,2 % en moyenne sur 2030-2031 (au moins 0,7 % chaque année), 2 % sur 2032-2034, 5 % dès 2035, 10 % en 2040, 35 % en 2050","statut":"vérifié"},{"bloc":"site","nom":"masse volumique du kérosène","valeur":"0.8","unite":"kg/L","source":"choix du cas (JET A : 0,775-0,84 kg/L) ; 1 t = 1 250 L, 1 L = 9,6 kWh (PCI)","statut":"choix du cas"},{"bloc":"site","nom":"pouvoir calorifique inférieur du kérosène","valeur":"43.2","unite":"MJ/kg","source":"Concawe/LBST/Aramco 2024 (eSAF), 43,2 GJ/t, repris par le Cerveau (CLM-saf-concawe-esaf-ft-importe-57-7)","statut":"repris"},{"bloc":"site","nom":"hydrogène par MWh (PCI)","valeur":"30.0","unite":"kg/MWh","source":"directive (UE) 2018/2001, annexe III, remplacée par la directive (UE) 2023/2413, art. 1(3) — même entrée que le cas D, texte relu le 17/11/2026","statut":"vérifié"},{"bloc":"synthese","nom":"voie de synthèse retenue","valeur":"Fischer-Tropsch direct (FT)","unite":"-","source":"choix du cas, argumenté : voie directe, une seule étape de synthèse, certifiée ASTM pour le carburéacteur ; la voie méthanol (MeTJ) ajoute une étape de méthanol (CAPEX 3 000 €/t/an, 0,58 const R = D.tables.sites;
const JEUX = D.meta.jeux_ordre;
const POSTES = ["elec", "electrolyseur", "stockage", "synthese", "co2", "ppa"];
const CO2O = ["cimenterie", "biogenique", "dac"];
const NOMS_CO2 = {fr: {cimenterie: "cimenterie (achat)", biogenique: "biogénique (achat)", dac: "captage dans l'air (DAC)"},
                  en: {cimenterie: "cement plant (purchased)", biogenique: "biogenic (purchased)", dac: "direct air capture (DAC)"}};
const S = {lang: new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr", annee: 2030,
           co2o: "cimenterie", jeu: "tyndp2026", config: "base"};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const col = k => css("--s" + (k + 1));
const fr = () => S.lang === "fr";
const fmt = (x, d = 0) => x === null || x === undefined ? "–" : (Math.abs(x) < 0.5 * 10 ** -d ? 0 : x).toLocaleString(fr() ? "fr-FR" : "en-GB", {maximumFractionDigits: d, minimumFractionDigits: d});
const pct = x => fmt(100 * x) + " %";
const el = (tag, attrs = {}, txt) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt !== undefined) e.textContent = txt; return e; };
const tip = document.getElementById("tip");
function hover(node, html) {
  node.addEventListener("pointerenter", () => { tip.innerHTML = html; tip.style.display = "block"; });
  node.addEventListener("pointermove", e => { tip.style.left = Math.min(e.clientX + 12, innerWidth - 310) + "px"; tip.style.top = (e.clientY + 12) + "px"; });
  node.addEventListener("pointerleave", () => { tip.style.display = "none"; });
}
function seg(ctl, key, options) {
  const box = document.querySelector(`[data-ctl="${ctl}"]`); box.innerHTML = "";
  for (const [v, label] of options) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(S[key] === v));
    b.onclick = () => { S[key] = v; render(); }; box.appendChild(b);
  }
}
function width(svg) { return Math.max(300, Math.round(svg.getBoundingClientRect().width) || 640); }
const table = (id, head, rows) => { document.getElementById(id).innerHTML = `<thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
  rows.map(r => `<tr>${r.map((c, i) => `<td${i ? ' class="num"' : ""}>${c}</td>`).join("")}</tr>`).join("") + "</tbody>"; };
const legend = (id, keys, names) => { document.getElementById(id).innerHTML = keys.map((k, i) => `<span><i style="background:${col(i)}"></i>${names[k]}</span>`).join(""); };

// poste d'un site, en €/L
const DL = () => D.meta.dens_l;
const poste = (r, p) => {
  const d = DL();
  switch (p) {
    case "elec": return (r.achat_electricity_u || 0) * d;
    case "electrolyseur": return ((r.invest_electrolyseur_u || 0) + (r.exploit_electrolyseur_u || 0)) * d;
    case "stockage": return ((r.invest_reservoir_u || 0) + (r.exploit_reservoir_u || 0)) * d;
    case "synthese": return ((r.invest_ft_u || 0) + (r.exploit_ft_u || 0)) * d;
    case "co2": return ((r.achat_co2_u || 0) + (r.invest_dac_u || 0) + (r.exploit_dac_u || 0) + (r.invest_stock_co2_u || 0) + (r.exploit_stock_co2_u || 0)) * d;
    case "ppa": return ((r.invest_pv_u || 0) + (r.exploit_pv_u || 0) + (r.invest_eolien_u || 0) + (r.exploit_eolien_u || 0)) * d;
  }
};
const ligne = (famille, cfg, co2, annee, jeu) => R.find(r => r.famille === famille && r.config === cfg && r.co2 === co2 &&
  r.annee === annee && r.jeu === jeu);

// Barres horizontales empilées, étiquette au-dessus (lisible à 360 px).
function hbars(svg, rows, unit, digits = 2) {
  svg.innerHTML = "";
  if (!rows.length) return;
  const W = width(svg), Lm = 6, Rm = 54, top = 4, rowH = 40, H = top + rowH * rows.length + rows.filter(r => r.sep).length * 8 + 46;
  const tot = r => r.parts.reduce((a, b) => a + b, 0);
  const xmax = Math.max(...rows.map(r => Math.max(tot(r), r.mark || 0)), 1) * 1.05;
  const x = v => Lm + (W - Lm - Rm) * v / xmax;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  const steps = [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500]; const step = steps.find(s => xmax / s <= 7) || 1000;
  for (let v = 0; v <= xmax; v += step) {
    svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - 36, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - 22, "text-anchor": "middle", class: "lbl"}, fmt(v, step < 1 ? 1 : 0)));
  }
  svg.appendChild(el("text", {x: W - 4, y: H - 3, "text-anchor": "end", class: "lbl"}, unit));
  let y = top;
  rows.forEach(r => {
    if (r.sep) y += 8;
    svg.appendChild(el("text", {x: Lm, y: y + 13, style: r.bold ? "font-weight:600" : ""}, r.label));
    let x0 = 0;
    r.parts.forEach((v, k) => { if (v <= 0) return;
      svg.appendChild(el("rect", {x: x(x0) + (x0 ? 1 : 0), y: y + 18, width: Math.max(0.5, x(x0 + v) - x(x0) - (x0 ? 1 : 0)), height: 14, rx: 2, fill: col(k)})); x0 += v; });
    if (r.mark) svg.appendChild(el("line", {x1: x(r.mark), x2: x(r.mark), y1: y + 15, y2: y + 35, stroke: css("--ink"), "stroke-width": 2, "stroke-dasharray": "3 3"}));
    svg.appendChild(el("text", {x: x(Math.max(x0, r.mark || 0)) + 5, y: y + 30}, fmt(x0, digits)));
    const hit = el("rect", {x: 0, y, width: W, height: rowH - 2, fill: "transparent"}); svg.appendChild(hit);
    if (r.tipHtml) hover(hit, r.tipHtml);
    y += rowH;
  });
}

  const t = T[S.lang];
  const rows = JEUX.map(j => {
    const r = ligne("co2", "base", S.co2o, S.annee, j);

      parts: POSTES.map(p => poste(r, p)),
      tipHtml: `<b>${D.meta.jeux_noms[j]} · ${S.annee}</b><br>${fmt(r.cout_l, 2)} €/L (${fmt(r.cout_t)} €/t)<br>` +
        POSTES.map(p => `${t.postes[p]} ${fmt(poste(r, p), 2)}`).join("<br>") +
        `<br>${fr() ? "prix moyen payé" : "mean price paid"} ${fmt(r.prix_moyen_paye, 1)} €/MWh`};
  }).filter(Boolean);
  hbars(document.getElementById("cout"), rows, t.axe_c);
  legend("legend_c", POSTES, t.postes);
  table("tab_c", t.th_c, rows.map(q => [q.label, fmt(q.r.cout_l, 2), fmt(q.r.cout_t), ...POSTES.map(p => fmt(poste(q.r, p), 2)), fmt(q.r.prix_moyen_paye, 1)]));
  const srt = rows.slice().sort((a, b) => a.r.cout_l - b.r.cout_l);

  document.getElementById("read_c").innerHTML = fr()
    ? `En ${S.annee}, avec du CO₂ ${NOMS_CO2.fr[S.co2o].split(" ")[0]}, le litre d'e-kérosène coûte de ${fmt(srt[0].r.cout_l, 2)} €/L (${srt[0].label}) à ${fmt(srt[srt.length-1].r.cout_l, 2)} €/L (${srt[srt.length-1].label}) selon le jeu de prix — le kérosène fossile de référence (EASA 2025) est à ${fmt(D.meta.ref_fossile_l, 2)} €/L. L'électricité en est ${pct(poste(srt[0].r, "elec") / srt[0].r.cout_l)} au moins cher.`

}

function leviers() {
  const t = T[S.lang], j = S.jeu;

  }).filter(Boolean);
  hbars(document.getElementById("origines"), rows, t.axe_c);
  table("tab_o", t.th_o, rows.map(q => [q.label, q.r.co2 === "dac" ? "–" : fmt(q.r.prix_co2_achat, 1), fmt(q.r.cout_l, 2),
    fmt(q.r.dac_t_h, 1), fmt(q.r.stock_co2_t), q.r.co2 === "dac" ? "1,46" : "–"]));
  const g = o => rows.find(q => q.label === NOMS_CO2[S.lang][o]);
  const c = g("cimenterie"), d = g("dac"), b = g("biogenique");
  if (!c || !d || !b) { document.getElementById("read_o").textContent = ""; return; }
  document.getElementById("read_o").innerHTML = (fr()
    ? `En ${S.annee} (${D.meta.jeux_noms[j]}) : CO₂ de cimenterie ${fmt(c.r.cout_l, 2)} €/L, biogénique ${fmt(b.r.cout_l, 2)} €/L, capté dans l'air sur place ${fmt(d.r.cout_l, 2)} €/L (le DAC consomme 1,46 MWh d'électricité par tonne de CO₂ et est construit à ${fmt(d.r.dac_t_h, 1)} t/h). À partir de 2041, seul le CO₂ biogénique ou atmosphérique comptera pour un carburant RFNBO (règlement 2023/1185).`
    : `In ${S.annee} (${D.meta.jeux_noms[j]}): cement-plant CO₂ ${fmt(c.r.cout_l, 2)} €/L, biogenic ${fmt(b.r.cout_l, 2)} €/L, captured from air on site ${fmt(d.r.cout_l, 2)} €/L (the DAC uses 1.46 MWh of electricity per tonne of CO₂ and is built at ${fmt(d.r.dac_t_h, 1)} t/h). From 2041, only biogenic or atmospheric CO₂ will count for an RFNBO fuel (Regulation 2023/1185).`);
}

function detail() {
  const t = T[S.lang];
  const cfgs = [...new Set(R.filter(r => r.annee === 2030 && r.jeu === "tyndp2026").map(r => r.config))];
  if (!cfgs.includes(S.config)) S.config = cfgs[0] || "base";
  const r = R.find(q => q.config === S.config && q.annee === 2030 && q.jeu === "tyndp2026" &&
                    q.co2 === (S.config.startsWith("rfnbo") ? "cimenterie" : S.co2o)) ||
            R.find(q => q.config === S.config && q.annee === 2030 && q.jeu === "tyndp2026");
  if (!r) return;
  const rows = POSTES.map(p => [t.postes[p], fmt(poste(r, p), 2), fmt(poste(r, p) / DL(), 0)]);
  table("tab_d", t.th_d, rows);
  document.getElementById("read_d").innerHTML = fr()
    ? `${t.leviers[S.config] || S.config} (TYNDP 2026 NT+, 2030, CO₂ ${NOMS_CO2.fr[r.co2]}) : ${fmt(r.cout_l, 2)} €/L. L'usine construit ${fmt(r.ft_t_h, 1)} t/h de synthèse, ${fmt(r.electrolyseur_mw_h2)} MW_H2 d'électrolyseur (${fmt(r.electrolyseur_mw_e)} MWₑ), ${fmt(r.reservoir_mwh)} MWh de réservoir${r.pv_mw ? `, ${fmt(r.pv_mw)} MW de PV et ${fmt(r.eolien_mw)} MW d'éolien (PPA)` : ""}${r.dac_t_h ? `, un DAC de ${fmt(r.dac_t_h, 1)} t/h` : ""}. Facteur de charge de la synthèse : ${pct(r.facteur_charge_ft)} ; prix moyen payé : ${fmt(r.prix_moyen_paye, 1)} €/MWh (moyenne du jeu ${fmt(r.prix_moyen, 1)}).`
    : `${t.leviers[S.config] || S.config} (TYNDP 2026 NT+, 2030, ${r.co2} CO₂): ${fmt(r.cout_l, 2)} €/L. The plant builds ${fmt(r.ft_t_h, 1)} t/h of synthesis, ${fmt(r.electrolyseur_mw_h2)} MW_H2 of electrolyser (${fmt(r.electrolyseur_mw_e)} MWe), ${fmt(r.reservoir_mwh)} MWh of tank${r.pv_mw ? `, ${fmt(r.pv_mw)} MW of PV and ${fmt(r.eolien_mw)} MW of wind (PPA)` : ""}${r.dac_t_h ? `, a ${fmt(r.dac_t_h, 1)} t/h DAC` : ""}. Synthesis load factor: ${pct(r.facteur_charge_ft)} ; mean price paid: ${fmt(r.prix_moyen_paye, 1)} €/MWh (set mean ${fmt(r.prix_moyen, 1)}).`;
  return cfgs;
}

function hyp() {
  const t = T[S.lang];
  document.getElementById("hyp").innerHTML = `<thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.hyp.map(h => `<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}</td><td>${h.statut}</td></tr>`).join("") + "</tbody>";
  document.getElementById("pistes").innerHTML = D.pistes[S.lang].map(p => `<li>${p}</li>`).join("");
}

function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  document.getElementById("lang").textContent = t.lang;
  seg("annee", "annee", [2030, 2040].map(a => [a, String(a)]));
  seg("jeu", "jeu", JEUX.map(j => [j, D.meta.jeux_noms[j]]));
  seg("co2o", "co2o", CO2O.map(o => [o, NOMS_CO2[S.lang][o]]));
  const cfgs = detail() || [];
  seg("config", "config", cfgs.map(c => [c, t.leviers[c] || c]));
  cout(); leviers(); regle(); origines(); hyp();
  document.getElementById("lim").innerHTML = t.lim.map(x => `<li>${x}</li>`).join("");
  const v = D.meta.versions || {};
  const jeuxTxt = JEUX.map(j => { const g = D.meta.jeux[j]; return `${D.meta.jeux_noms[j]} (${g.licence})`; }).join(", ");
  document.getElementById("pied").innerHTML = `<p>${t.pied.replace("{jeux}", jeuxTxt).replace("{pommes}", v.pommes).replace("{craft}", v.pommes_craft)
    .replace("{n}", D.meta.n_resolutions).replace("{commit}", D.meta.commit_grille).replace("{date}", D.meta.date)}</p>`;
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr";
  const u = new URL(location.href); u.searchParams.set("lang", S.lang); history.replaceState(null, "", u); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let _rz; addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(render, 150); });
render();
</script>
</body>
</html>
