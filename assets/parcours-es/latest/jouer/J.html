const DANS = {fr: {france: "en France", maroc: "au Maroc", chili: "au Chili", australie: "en Australie"}, en: {france: "in France", maroc: "in Morocco", chili: "in Chile", australie: "in Australia"}};
const dans = s => DANS[S.lang][s];
const fmt = (x, d = 0) => x === null || x === undefined ? "–" : (Math.abs(x) < 0.5 * 10 ** -d ? 0 : x).toLocaleString(fr() ? "fr-FR" : "en-GB", {maximumFractionDigits: d, minimumFractionDigits: d});
const pct = x => fmt(100 * x) + " %";
const el = (tag, attrs = {}, txt) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt !== undefined) e.textContent = txt; return e; };
const tip = document.getElementById("tip");

}

}
function width(svg) { return Math.max(300, Math.round(svg.getBoundingClientRect().width) || 640); }

const legend = (id, keys, names) => { document.getElementById(id).innerHTML = keys.map((k, i) => `<span><i style="background:${col(i)}"></i>${names[k]}</span>`).join(""); };
// Coût d'un poste (investissement + exploitation), par unité livrée.

const ligne = (famille, site, extra = {}) => R.find(r => r.famille === famille && r.site === site && Object.entries(extra).every(([k, v]) => r[k] === v));

// Barres horizontales empilées, une étiquette au-dessus de chaque barre (lisible à 360 px).
// rows : [{label, parts: [valeurs dans l'ordre des clés], tipHtml, range: [min, max] | null, mark: valeur | null, sep: bool}]
function hbars(svg, rows, unit, digits = 2) {
  svg.innerHTML = "";
  const W = width(svg), Lm = 6, Rm = 54, top = 4, rowH = 40, H = top + rowH * rows.length + rows.filter(r => r.sep).length * 8 + 46;
  const tot = r => r.parts.reduce((a, b) => a + b, 0);
  const xmax = Math.max(...rows.map(r => Math.max(tot(r), r.range ? r.range[1] : 0, r.mark || 0))) * 1.05;
  const x = v => Lm + (W - Lm - Rm) * v / xmax;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  const steps = [0.5, 1, 2, 5, 10, 20, 50, 100, 200]; const step = steps.find(s => xmax / s <= 7) || 500;
  for (let v = 0; v <= xmax; v += step) {
    svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - 36, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - 22, "text-anchor": "middle", class: "lbl"}, fmt(v, step < 1 ? 1 : 0)));
  }
  svg.appendChild(el("text", {x: W - 4, y: H - 3, "text-anchor": "end", class: "lbl"}, unit));
  let y = top;
  rows.forEach(r => {
    if (r.sep) y += 8;
    svg.appendChild(el("text", {x: Lm, y: y + 13, style: r.bold ? "font-weight:600" : ""}, r.label));
    let x0 = 0;
    r.parts.forEach((v, k) => { if (v <= 0) return;
      svg.appendChild(el("rect", {x: x(x0) + (x0 ? 1 : 0), y: y + 18, width: Math.max(0.5, x(x0 + v) - x(x0) - (x0 ? 1 : 0)), height: 14, rx: 2, fill: col(k)})); x0 += v; });
    if (r.range) {
      const yy = y + 25; svg.appendChild(el("line", {x1: x(r.range[0]), x2: x(r.range[1]), y1: yy, y2: yy, stroke: css("--ink"), "stroke-width": 1.5}));
      for (const v of r.range) svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: yy - 6, y2: yy + 6, stroke: css("--ink"), "stroke-width": 1.5}));
    }
    if (r.mark) svg.appendChild(el("line", {x1: x(r.mark), x2: x(r.mark), y1: y + 15, y2: y + 35, stroke: css("--ink"), "stroke-width": 2, "stroke-dasharray": "3 3"}));
    svg.appendChild(el("text", {x: x(Math.max(x0, r.range ? r.range[1] : 0, r.mark || 0)) + 5, y: y + 30}, fmt(x0, digits)));
    const hit = el("rect", {x: 0, y, width: W, height: rowH - 2, fill: "transparent"}); svg.appendChild(hit);
    if (r.tipHtml) hover(hit, r.tipHtml);
    y += rowH;
  });
}

function cout() {

    const r = ligne("meteo", s, {meteo: S.meteo}), all = R.filter(q => q.famille === "meteo" && q.site === s).map(q => q.cout);
    return {label: nom(s), bold: true, parts: POSTES.slice(0, 5).map(p => poste(r, p)), range: [Math.min(...all), Math.max(...all)], r,
      tipHtml: `<b>${nom(s)} · ${S.meteo}</b><br>${fmt(r.cout, 2)} €/kg<br>` + POSTES.slice(0, 5).map(p => `${t.postes[p]} ${fmt(poste(r, p), 2)}`).join("<br>") +
        `<br>${fr() ? "10 années" : "10 years"} : ${fmt(Math.min(...all), 2)} – ${fmt(Math.max(...all), 2)}`};
  });

      parts: LPOSTES.map(p => l[p]), mark: c === "ammoniac" ? l.ref_france : null,

    : `Delivered to Rotterdam, hydrogen from the three distant countries is cheapest ${dans(bests[0].site)} (${t.chaines[bests[0].chaine]}, ${fmt(bests[0].total, 2)} €/kg), against ${fmt(frRef.total, 2)} €/kg for hydrogen made in France. Turning ammonia back into hydrogen is costly: in Chile, ${fmt(crack.m, 2)} kg must be produced to deliver one. Ammonia delivered as such travels well: the ship weighs only a few cents per kg.`;
  // fer

      tipHtml: `<b>${nom(s)} · ${t.routes[rt]}</b><br>${fmt(f.total)} €/t` + FPOSTES.filter(p => f[p]).map(p => `<br>${t.fpostes[p]} ${fmt(f[p])}`).join("") +
        (f.chaine_h2 ? `<br>${fr() ? "chaîne de l'hydrogène" : "hydrogen chain"} : ${t.chaines[f.chaine_h2]}` : "")});
  }));

  const ferRow = R.find(r => r.famille === "fer" && r.site === "australie" && r.four === S.four);

    : ` Flexible furnace (Australia): an iron stock of ${fmt(ferRow.stock_fer_j, 1)} days, a hydrogen tank of ${fmt(ferRow.reservoir_h)} h: storing iron is far cheaper than storing hydrogen.`) : "";
  document.getElementById("read_f").innerHTML = !a ? "" : (fr()

    : `Australia: iron made on site and shipped comes to ${fmt(a.total)} €/t, against ${fmt(b.total)} €/t when shipping the hydrogen and ${fmt(c.total)} €/t for iron from the French site. The cheapest of the three countries: iron from ${nom(meilleur.origine)} (${fmt(meilleur.total)} €/t). ` +

  const ps = D.meta.reseau_prix;
  table("tab_r", t.th_r, SITES.map(s => { const r0 = ref(s);
    return [nom(s), fmt(r0.cout, 2), ...ps.map(p => { const r = R.find(q => q.famille === "reseau" && q.site === s && q.reseau === p);
      return r ? `${fmt(r.cout, 2)} (${pct(r.part_reseau)})` : "–"; })]; }));
  const m = R.find(q => q.famille === "reseau" && q.site === "france" && q.reseau === ps[1]);
  document.getElementById("read_r").innerHTML = fr()
    ? `Entre parenthèses, la part de l'électricité achetée au réseau. À ${ps[1]} €/MWh, le site français en achète ${pct(m.part_reseau)} et descend à ${fmt(m.cout, 2)} €/kg : le réseau remplace d'abord le stockage et les panneaux surdimensionnés qui ne servent que quelques jours par an.`
    : `In brackets, the share of electricity bought from the grid. At ${ps[1]} €/MWh, the French site buys ${pct(m.part_reseau)} and drops to ${fmt(m.cout, 2)} €/kg: the grid first replaces the storage and the oversized panels that only serve a few days a year.`;
}

function hyp() {
  const t = T[S.lang];
  document.getElementById("hyp").innerHTML = `<thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.hyp.map(h => `<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}</td><td>${h.statut}</td></tr>`).join("") + "</tbody>";
  document.getElementById("pistes").innerHTML = D.pistes[S.lang].map(p => `<li>${p}</li>`).join("");
  document.getElementById("lim").innerHTML = t.lim.map(x => `<li>${x}</li>`).join("");
}

function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  document.getElementById("lang").textContent = t.lang;
  seg("meteo", "meteo", D.meta.annees_meteo.map(a => [a, String(a)]));
  seg("site", "site", SITES.map(s => [s, nom(s)]));
  seg("niveau", "niveau", Object.entries(t.niv));
  seg("four", "four", Object.entries(t.fours));
  cout(); bati(); techs(); wacc(); livr(); reseau(); hyp();
  const v = D.meta.versions || {}, m = D.meta.meteo;
  document.getElementById("pied").innerHTML = `<p>${t.pied.replace("{meteo}", `${m.attribution} (${m.licence})`).replace("{pommes}", v.pommes).replace("{craft}", v.pommes_craft)
    .replace("{n}", D.meta.n_resolutions).replace("{commit}", D.meta.commit_grille).replace("{date}", D.meta.date)}</p>`;
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr";
  const u = new URL(location.href); u.searchParams.set("lang", S.lang); history.replaceState(null, "", u); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let _rz; addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(render, 150); });
render();
</script>
</body>
</html>
