    tableau: "The table (mean of the 3 weather years)",
    th_f: ["million", "charging", "hours < 10 €/MWh", "average price (€/MWh)", "price paid by EVs (€/MWh)", "charging peak (GW)", "gain per car (€/yr)"],
    n_titre: "3. RTE's N03 mix, corrected",
    n_aide: "The 2025 notebook called “N03” a mix with 39 GW of nuclear and 88 GW of onshore wind. RTE's report (Futurs énergétiques 2050, p. 204) says otherwise:",
    th_c: ["", "2025 notebook", "RTE, N03"],
    hy_titre: "Assumptions: value, unit, source, status", hy_aide: "They are read by the model (hypotheses.yaml): changing one changes the result.",
    th: ["assumption", "value", "unit", "source", "status"],
    pied: "Prices: {jeux}. System, EVs: TYNDP 2026 Scenarios, ENTSO-E & ENTSOG (draft, June 2026), CC BY 4.0; weather: PECD (TYNDP 2026, C3S). Computation: pommes 0.9.0, pommes_craft 0.5.1, HiGHS; {n} solves, commit {commit}, {date}. Code (MIT) and notebook: folder B_ve_pilotes of the pommes-case-studies repository.",
  },
};
const NOMS = {tyndp2024: "TYNDP 2024", tyndp2026: "TYNDP 2026 NT+", etage1_tyndp2026: "POMMES / TYNDP 2026", fos_sur_mer: "fos-sur-mer"};
const JEUX = ["tyndp2024", "tyndp2026", "etage1_tyndp2026", "fos_sur_mer"], COUL = {tyndp2024: "--c1", tyndp2026: "--c2", etage1_tyndp2026: "--c3", fos_sur_mer: "--c4"};
const S = {lang: new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr", annee: 2030, pente: D.meta.pente};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (x, d = 0) => x === null || x === undefined ? "–" : x.toLocaleString(S.lang === "fr" ? "fr-FR" : "en-GB", {maximumFractionDigits: d, minimumFractionDigits: d});
const el = (tag, attrs = {}, txt) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt !== undefined) e.textContent = txt; return e; };
const tip = document.getElementById("tip");
function hover(node, html) {
  node.addEventListener("pointerenter", () => { tip.innerHTML = html; tip.style.display = "block"; });
  node.addEventListener("pointermove", e => { tip.style.left = Math.min(e.clientX + 12, innerWidth - 290) + "px"; tip.style.top = (e.clientY + 12) + "px"; });
  node.addEventListener("pointerleave", () => { tip.style.display = "none"; });
}
function seg(ctl, key, options) {
  const box = document.querySelector(`[data-ctl="${ctl}"]`); box.innerHTML = "";
  for (const [v, label] of options) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(S[key] === v));
    b.onclick = () => { S[key] = v; render(); }; box.appendChild(b);
  }
}
function width(svg) { return Math.max(300, Math.round(svg.getBoundingClientRect().width) || 640); }
const moy = a => a.reduce((s, v) => s + v, 0) / a.length;

function strip() {
  const t = T[S.lang], svg = document.getElementById("strip"); svg.innerHTML = "";
  const rows = D.tables.prix.filter(r => r.annee === S.annee), W = width(svg), L = 6, R2 = 10, top = 8, rowH = 44, H = top + rowH * JEUX.length + 38;
  const xmax = Math.max(...D.tables.prix.map(r => r.gain)) * 1.05, x = v => L + (W - L - R2) * v / xmax;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  for (let v = 0; v <= xmax; v += 25) { svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - 30, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - 16, "text-anchor": "middle", class: "lbl"}, v)); }
  svg.appendChild(el("text", {x: W - R2, y: H - 2, "text-anchor": "end", class: "lbl"}, t.axe_p));
  JEUX.forEach((j, i) => {
    const yc = top + 22 + i * rowH;
    svg.appendChild(el("text", {x: L, y: yc - 10, class: "lbl"}, NOMS[j]));
    rows.filter(r => r.jeu === j).forEach((r, k) => {
      const c = el("circle", {cx: x(r.gain), cy: yc + 6 + ((k * 7) % 5 - 2) * 2.2, r: r.central ? 6.5 : 4, fill: css(COUL[j]), "fill-opacity": r.central ? 1 : 0.55, stroke: css("--surface"), "stroke-width": 1.2});
      svg.appendChild(c);
      hover(c, `<b>${NOMS[j]}</b> · ${r.scenario} · ${r.meteo}<br>${S.lang === "fr" ? "prix moyen" : "average price"} ${fmt(r.prix_moyen, 1)} €/MWh<br>${S.lang === "fr" ? "prix payé" : "price paid"} : ${fmt(r.prix_paye_naturelle, 1)} → ${fmt(r.prix_paye_pilotee, 1)} €/MWh<br><b>${fmt(r.gain)} €/an</b>`);
    });
  });
  document.getElementById("legend_p").innerHTML = JEUX.map(j => `<span><i style="background:${css(COUL[j])};border-radius:50%"></i>${NOMS[j]} · ${rows.filter(r => r.jeu === j).length}</span>`).join("");
  const c = rows.filter(r => r.central), fr = S.lang === "fr";
  document.getElementById("read_p").innerHTML = (fr ? `En ${S.annee}, séries centrales : ` : `In ${S.annee}, central series: `) +
    c.map(r => `${NOMS[r.jeu]} <b>${fmt(r.gain)} €</b> (${fmt(r.prix_paye_naturelle)} → ${fmt(r.prix_paye_pilotee)} €/MWh)`).join(" · ") +
    (fr ? `. Sur toutes les séries : ${fmt(Math.min(...rows.map(r => r.gain)))} à ${fmt(Math.max(...rows.map(r => r.gain)))} € par voiture et par an. Le gain tient à la forme des prix (l'écart entre heures chères et bon marché), plus qu'à leur niveau.`
        : `. Over all series: ${fmt(Math.min(...rows.map(r => r.gain)))} to ${fmt(Math.max(...rows.map(r => r.gain)))} € per car per year. The gain comes from the shape of prices (the gap between dear and cheap hours) more than from their level.`);
}

function agrege(rows) {
  const m = new Map();
  for (const r of rows) { const k = `${r.millions}|${r.pilotee}`; if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
  return [...m.values()].map(g => { const o = {millions: g[0].millions, pilotee: g[0].pilotee};
    for (const c of ["heures_prix_bas", "prix_moyen", "prix_paye_ve", "recharge_pointe_gw", "gain_vehicule", "prix_1000h_moins_cheres"])
      o[c] = g[0][c] === null ? null : moy(g.map(r => r[c])); return o; }).sort((a, b) => a.millions - b.millions);
}

function lines() {
  const t = T[S.lang], svg = document.getElementById("lines"); svg.innerHTML = "";
  const A = agrege(D.tables.france.filter(r => r.pente === S.pente));
  const W = width(svg), L = 44, R2 = 12, top = 10, B = 40, H = W < 480 ? 240 : 270;
  const ymax = Math.max(...D.tables.france.map(r => r.heures_prix_bas)) * 1.08, x = v => L + (W - L - R2) * v / 34, y = v => top + (H - top - B) * (1 - v / ymax);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  for (let v = 0; v <= ymax; v += 100) { svg.appendChild(el("line", {x1: L, x2: W - R2, y1: y(v), y2: y(v), class: "grid"}));
    svg.appendChild(el("text", {x: L - 6, y: y(v) + 4, "text-anchor": "end", class: "lbl"}, v)); }
  for (const v of [0, 8, 16.6, 25, 33]) svg.appendChild(el("text", {x: x(v), y: H - B + 16, "text-anchor": "middle", class: "lbl"}, fmt(v, v % 1 ? 1 : 0)));
  svg.appendChild(el("text", {x: W - R2, y: H - 4, "text-anchor": "end", class: "lbl"}, t.axe_fx));
  svg.appendChild(el("text", {x: L + 4, y: top + 10, class: "lbl"}, t.axe_f));
  const zero = A.find(a => a.millions === 0);
  for (const [pil, c] of [[false, "--c2"], [true, "--c1"]]) {
    const s = [zero, ...A.filter(a => a.millions > 0 && a.pilotee === pil)];
    svg.appendChild(el("path", {d: s.map((a, k) => `${k ? "L" : "M"}${x(a.millions).toFixed(1)},${y(a.heures_prix_bas).toFixed(1)}`).join(" "), fill: "none", stroke: css(c), "stroke-width": 2.2}));
    s.forEach(a => { const p = el("circle", {cx: x(a.millions), cy: y(a.heures_prix_bas), r: 4.5, fill: css(c), stroke: css("--surface"), "stroke-width": 1.5});
      svg.appendChild(p); hover(p, `<b>${fmt(a.millions, 1)} M · ${a.millions ? t[pil ? "pilotee" : "naturelle"] : "–"}</b><br>${fmt(a.heures_prix_bas)} h < 10 €/MWh<br>${t.th_f[4]} : ${fmt(a.prix_paye_ve, 1)}<br>${t.th_f[6]} : ${fmt(a.gain_vehicule)}`); });
  }
  document.getElementById("legend_f").innerHTML = `<span><i style="background:${css("--c2")}"></i>${t.naturelle}</span><span><i style="background:${css("--c1")}"></i>${t.pilotee}</span>`;
  const p166 = A.find(a => a.millions === 16.6 && a.pilotee), p33 = A.find(a => a.millions === 33 && a.pilotee), n166 = A.find(a => a.millions === 16.6 && !a.pilotee), fr = S.lang === "fr";
  document.getElementById("read_f").innerHTML = fr
    ? `Sans VE, la France a ${fmt(zero.heures_prix_bas)} heures sous 10 €/MWh. Les 16,6 millions de voitures du TYNDP en laissent ${fmt(n166.heures_prix_bas)} si elles rechargent en rentrant, <b>${fmt(p166.heures_prix_bas)}</b> si elles sont pilotées ; 33 millions de voitures pilotées n'en laissent que <b>${fmt(p33.heures_prix_bas)}</b>. Le gain du pilotage, lui, baisse peu : <b>${fmt(p166.gain_vehicule)} €</b> par voiture et par an à 16,6 millions, ${fmt(p33.gain_vehicule)} € à 33 millions — les voitures prennent la place des exports et des électrolyseurs. Mais la flotte pilotée crée sa propre pointe de recharge : ${fmt(p166.recharge_pointe_gw)} GW à 16,6 millions, contre ${fmt(n166.recharge_pointe_gw)} GW en recharge naturelle.`
    : `Without EVs, France has ${fmt(zero.heures_prix_bas)} hours below 10 €/MWh. TYNDP's 16.6 million cars leave ${fmt(n166.heures_prix_bas)} if they charge when getting home, <b>${fmt(p166.heures_prix_bas)}</b> if smart-charged; 33 million smart cars leave only <b>${fmt(p33.heures_prix_bas)}</b>. The smart-charging gain drops little: <b>${fmt(p166.gain_vehicule)} €</b> per car per year at 16.6 million, ${fmt(p33.gain_vehicule)} € at 33 million — cars take the place of exports and electrolysers. But the smart fleet creates its own charging peak: ${fmt(p166.recharge_pointe_gw)} GW at 16.6 million, against ${fmt(n166.recharge_pointe_gw)} GW with natural charging.`;
  document.getElementById("tab_f").innerHTML = `<thead><tr>${t.th_f.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    A.map(a => `<tr><td class="num">${fmt(a.millions, 1)}</td><td>${a.millions ? t[a.pilotee ? "pilotee" : "naturelle"] : "–"}</td><td class="num">${fmt(a.heures_prix_bas)}</td><td class="num">${fmt(a.prix_moyen, 1)}</td><td class="num">${fmt(a.prix_paye_ve, 1)}</td><td class="num">${fmt(a.recharge_pointe_gw)}</td><td class="num">${fmt(a.gain_vehicule)}</td></tr>`).join("") + "</tbody>";
}

function n03() {
  const t = T[S.lang], fr = S.lang === "fr";
  const L = fr ? [["nucléaire", "39 GW", "51 GW (24 historique + 27 nouveau)"], ["éolien terrestre", "88 GW", "43 GW"], ["éolien en mer", "–", "22 GW"], ["solaire", "70 GW", "70 GW"], ["bioénergies", "7 GW", "≈ 2 GW"], ["flexibilités de la demande", "–", "13 GW"], ["batteries", "à dimensionner", "1 GW"], ["STEP", "–", "8 GW"]]
    : [["nuclear", "39 GW", "51 GW (24 existing + 27 new)"], ["onshore wind", "88 GW", "43 GW"], ["offshore wind", "–", "22 GW"], ["solar", "70 GW", "70 GW"], ["bioenergy", "7 GW", "≈ 2 GW"], ["demand flexibility", "–", "13 GW"], ["batteries", "sized by the model", "1 GW"], ["pumped hydro", "–", "8 GW"]];
  document.getElementById("tab_c").innerHTML = `<thead><tr>${t.th_c.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` + L.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("") + "</tbody>";
  const R = D.tables.n03; if (!R.length) { document.getElementById("read_n").textContent = ""; return; }
  const nat = R.filter(r => !r.pilotee), pil = R.filter(r => r.pilotee);
  document.getElementById("read_n").innerHTML = fr
    ? `88 GW, c'est l'éolien total de N2 (52 terrestre + 36 en mer). Dans N03 corrigé, placé dans les années météo du TYNDP 2040 avec la consommation de RTE (645 TWh) et ses 35,9 millions de VE, le pilotage fait gagner <b>${fmt(Math.min(...pil.map(r => r.gain_vehicule)))} à ${fmt(Math.max(...pil.map(r => r.gain_vehicule)))} €</b> par voiture et par an, et les heures sous 10 €/MWh passent de ${fmt(moy(nat.map(r => r.heures_prix_bas)))} à ${fmt(moy(pil.map(r => r.heures_prix_bas)))}. Ordre de grandeur seulement : ce N03 importe ${fmt(moy(nat.map(r => r.import_twh)))} TWh par an, faute d'une disponibilité du nucléaire et d'une demande de 2050 calées (piste de mini-projet).`
    : `88 GW is N2's total wind (52 onshore + 36 offshore). In the corrected N03, placed in the TYNDP 2040 weather years with RTE's consumption (645 TWh) and 35.9 million EVs, smart charging saves <b>${fmt(Math.min(...pil.map(r => r.gain_vehicule)))} to ${fmt(Math.max(...pil.map(r => r.gain_vehicule)))} €</b> per car per year, and the hours below 10 €/MWh go from ${fmt(moy(nat.map(r => r.heures_prix_bas)))} to ${fmt(moy(pil.map(r => r.heures_prix_bas)))}. Order of magnitude only: this N03 imports ${fmt(moy(nat.map(r => r.import_twh)))} TWh a year, lacking a calibrated 2050 nuclear availability and demand (mini-project lead).`;
}

function hyp() {
  const t = T[S.lang];
  document.getElementById("hyp").innerHTML = `<thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.hyp.map(h => `<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}</td><td>${h.statut}</td></tr>`).join("") + "</tbody>";
}

function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  document.getElementById("lang").textContent = t.lang;
  seg("annee", "annee", [[2030, "2030"], [2040, "2040"]]);
  const pentes = [...new Set(D.tables.france.map(r => r.pente))].sort();
  seg("pente", "pente", pentes.map(p => [p, p === D.meta.pente ? t.p_calee : t.p_forte]));
  strip(); lines(); n03(); hyp();
  const jeux = JEUX.map(j => `${D.meta.jeux[j].attribution || NOMS[j]} (${D.meta.jeux[j].licence})`).join(" ; ");
  document.getElementById("pied").innerHTML = `<p>${t.pied.replace("{jeux}", jeux).replace("{n}", D.meta.n_resolutions)
    .replace("{commit}", D.meta.commit).replace("{date}", D.meta.date)}</p>`;
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr";
  const u = new URL(location.href); u.searchParams.set("lang", S.lang); history.replaceState(null, "", u); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let _rz; addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(render, 150); });
render();
</script>
