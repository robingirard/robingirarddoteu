  for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt !== undefined) e.textContent = txt; return e; };
const tip = document.getElementById("tip");
function hover(node, html) {
  node.addEventListener("pointerenter", () => { tip.innerHTML = html; tip.style.display = "block"; });
  node.addEventListener("pointermove", e => { tip.style.left = Math.min(e.clientX + 12, innerWidth - 290) + "px"; tip.style.top = (e.clientY + 12) + "px"; });
  node.addEventListener("pointerleave", () => { tip.style.display = "none"; });
}
function seg(ctl, key, options) {
  const box = document.querySelector(`[data-ctl="${ctl}"]`); box.innerHTML = "";
  for (const [v, label] of options) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(S[key] === v));
    b.onclick = () => { S[key] = v; render(); }; box.appendChild(b);
  }
}
const fr = () => S.lang === "fr";
const sto = r => (r.reservoir_mwh + r.cavite_mwh) / 1000;
function info(r) {
  const N = NOMS[S.lang];
  return `<b>${N[r.jeu]} · ${N[r.config]}</b><br>${fmt(r.cout_kg, 2)} €/kg · ${fmt(r.cout_meur, 1)} M€/${fr() ? "an" : "yr"}<br>` +
    `${fr() ? "électrolyseur" : "electrolyser"} ${fmt(r.electrolyseur_mw_e)} MWe (${fr() ? "facteur de charge" : "load factor"} ${fmt(100 * r.facteur_charge)} %)` +
    (r.reformeur_mw > 0.5 ? `<br>${fr() ? "reformeur gardé" : "reformer kept"} ${fmt(r.reformeur_mw)} MW` : "") +
    (sto(r) > 0.001 ? `<br>${fr() ? "stockage" : "storage"} ${fmt(sto(r), 2)} GWh` : "") +
    (r.pv_mw + r.eolien_mw > 0.5 ? `<br>PPA : PV ${fmt(r.pv_mw)} MW, ${fr() ? "éolien" : "wind"} ${fmt(r.eolien_mw)} MW` : "") +
    `<br>${fr() ? "part électrolytique" : "electrolytic share"} ${fmt(100 * r.part_electrolytique)} %` +
    (r.regle !== "aucune" ? ` · RFNBO ${fmt(100 * r.part_rfnbo)} %` : "") + ` · ${fmt(r.emissions_kt)} ktCO₂`;
}

function barres(svgId, rows, configs, coul, legendId) {
  const N = NOMS[S.lang], t = T[S.lang], svg = document.getElementById(svgId); svg.innerHTML = "";
  const W = Math.max(300, Math.round(svg.getBoundingClientRect().width) || 640), L = 6, R2 = 40, top = 6, h = 12, gap = 3;
  const block = configs.length * (h + gap) + 26, H = top + block * JEUX.length + 30;
  const xmax = Math.max(...rows.map(r => r.cout_kg)) * 1.05, x = v => L + (W - L - R2) * v / xmax;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  for (let v = 0; v <= xmax; v += 1) {
    svg.appendChild(el("line", {x1: x(v), x2: x(v), y1: top, y2: H - 26, class: "grid"}));
    svg.appendChild(el("text", {x: x(v), y: H - 12, "text-anchor": "middle", class: "lbl"}, fmt(v)));
  }
  svg.appendChild(el("text", {x: W - 4, y: H, "text-anchor": "end", class: "lbl"}, t.axe));
  JEUX.forEach((j, i) => {
    const y0 = top + i * block, rs = rows.filter(r => r.jeu === j && configs.includes(r.config));
    if (!rs.length) return;
    const best = rs.reduce((a, b) => (b.cout_kg < a.cout_kg ? b : a));
    svg.appendChild(el("text", {x: L, y: y0 + 13, style: "font-weight:600"}, N[j]));
    configs.forEach((c, k) => {
      const r = rs.find(q => q.config === c); if (!r) return;
      const y = y0 + 20 + k * (h + gap);
      svg.appendChild(el("rect", {x: x(0), y, width: Math.max(1, x(r.cout_kg) - x(0)), height: h, rx: 3, fill: css("--s" + coul[c])}));
      svg.appendChild(el("text", {x: x(r.cout_kg) + 4, y: y + h - 2, style: r === best ? "font-weight:700" : ""}, fmt(r.cout_kg, 2)));
      const hit = el("rect", {x: 0, y: y - 1, width: W, height: h + 2, fill: "transparent"}); svg.appendChild(hit); hover(hit, info(r));
    });
  });
  document.getElementById(legendId).innerHTML = configs.map(c => `<span><i style="background:${css("--s" + coul[c])}"></i>${N[c]}</span>`).join("");
}
function tableau(id, rows) {
  const t = T[S.lang], N = NOMS[S.lang];
  document.getElementById(id).innerHTML = `<thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr><td>${N[r.jeu]}</td><td>${N[r.config]}</td><td class="num">${fmt(r.cout_kg, 2)}</td><td class="num">${fmt(r.electrolyseur_mw_e)}</td><td class="num">${fmt(sto(r), 2)}</td><td class="num">${fmt(r.pv_mw)}</td><td class="num">${fmt(r.eolien_mw)}</td><td class="num">${fmt(100 * r.part_electrolytique)} %</td><td class="num">${fmt(100 * r.facteur_charge)} %</td><td class="num">${fmt(r.emissions_kt)}</td></tr>`).join("") + "</tbody>";
}

function section1() {
  const N = NOMS[S.lang];
  let rows = R.filter(r => r.groupe === "central" && r.annee === S.annee && SANS.includes(r.config));
  if (S.annee === 2030 && S.capex === "bas") {
    const bas = R.filter(r => r.groupe === "capex_bas");
    rows = rows.map(r => bas.find(b => b.jeu === r.jeu && b.config === r.config) || r);
  }
  barres("bars1", rows, SANS, COUL1, "legend1"); tableau("tab1", rows);
  const lignes = JEUX.map(j => {
    const get = c => rows.find(r => r.jeu === j && r.config === c); if (!get("electrolyseur")) return "";
    const best = SANS.map(get).reduce((a, b) => (b.cout_kg < a.cout_kg ? b : a));
    const cav = get("electrolyseur").cout_kg - get("electrolyseur_cavite").cout_kg;
    const elmin = Math.min(...["electrolyseur", "electrolyseur_reservoir", "electrolyseur_cavite"].map(c => get(c).cout_kg));
    const hyb = elmin - get("hybride").cout_kg;
    return fr() ? `<b>${N[j]}</b> : le moins cher, ${N[best.config]} (${fmt(best.cout_kg, 2)} €/kg) ; la cavité fait gagner ${fmt(cav, 2)} €/kg à l'électrolyseur ; se passer du reformeur coûte ${fmt(hyb, 2)} €/kg.`
      : `<b>${N[j]}</b>: cheapest, ${N[best.config]} (${fmt(best.cout_kg, 2)} €/kg); the cavern saves the electrolyser ${fmt(cav, 2)} €/kg; doing without the reformer costs ${fmt(hyb, 2)} €/kg.`;
  }).filter(Boolean);
  document.getElementById("read1").innerHTML = lignes.join("<br>");
}

function section2() {
  const N = NOMS[S.lang], configs = S.part === "100" ? R100 : R42;
  const rows = R.filter(r => r.groupe === "central" && r.annee === 2030 && configs.includes(r.config));
  barres("bars2", rows, configs, COUL2, "legend2"); tableau("tab2", rows);
  const [base, mois, heure] = S.part === "100" ? ["electrolyseur", "rfnbo_mensuelle", "rfnbo_horaire"] : ["hybride", "rfnbo42_mensuelle", "rfnbo42_horaire"];
  const lignes = JEUX.map(j => {
    const get = c => rows.find(r => r.jeu === j && r.config === c); if (!get(heure)) return "";
    const m = get(mois), h = get(heure), d = h.cout_kg - m.cout_kg;
    let s = fr() ? `<b>${N[j]}</b> : passer du mensuel à l'horaire coûte <b>${fmt(d, 2)} €/kg</b> (${fmt(100 * d / m.cout_kg)} %) ; ${h.heures_prix_bas} h sous le seuil de ${fmt(h.seuil_prix_bas)} €/MWh`
      : `<b>${N[j]}</b>: moving from monthly to hourly costs <b>${fmt(d, 2)} €/kg</b> (${fmt(100 * d / m.cout_kg)} %); ${h.heures_prix_bas} h below the ${fmt(h.seuil_prix_bas)} €/MWh threshold`;
    const sc = get("rfnbo_horaire_sans_clause");
    if (S.part === "100" && sc) s += fr() ? ` ; sans la clause, ${fmt(sc.cout_kg - h.cout_kg, 2)} €/kg de plus` : `; without the clause, ${fmt(sc.cout_kg - h.cout_kg, 2)} €/kg more`;
    return s + ".";
  }).filter(Boolean);
  document.getElementById("read2").innerHTML = lignes.join("<br>");
}

function hyp() {
  const t = T[S.lang];
  document.getElementById("hyp").innerHTML = `<thead><tr>${t.thh.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    D.hyp.map(h => `<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}</td><td>${h.statut}</td></tr>`).join("") + "</tbody>";
}

function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById("perimetre").textContent = D.perimetre[S.lang];
  document.getElementById("lang").textContent = t.lang;
  seg("annee", "annee", [[2030, "2030"], [2040, "2040"]]);
  seg("capex", "capex", [["annee", t.capex_a], ["bas", t.capex_b]]);
  document.getElementById("lab_capex").style.display = S.annee === 2030 ? "" : "none";
  seg("part", "part", [["100", "100 %"], ["42", "42 %"]]);
  section1(); section2(); hyp();
  const jeux = JEUX.map(j => `${D.meta.jeux[j].attribution || NOMS[S.lang][j]} (${D.meta.jeux[j].licence})`).join(" ; ");
  document.getElementById("pied").innerHTML = `<p>${t.pied.replace("{jeux}", jeux).replace("{n}", D.meta.n_resolutions)
    .replace("{commit}", D.meta.commit).replace("{date}", D.meta.date)}</p>`;
}
document.getElementById("lang").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr";
  const u = new URL(location.href); u.searchParams.set("lang", S.lang); history.replaceState(null, "", u); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
let _rz; addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(render, 150); });
render();
</script>
</body>
</html>
