<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Une base horizontale et une montée sur la première diagonale : une pente qui s'élève depuis
       un sol. Ne pas croiser les deux droites au centre, cela donnerait un « ≠ ». Le pendant PNG
       est engendré par make_icons.py, avec une variante à marge pour le rognage rond d'Android. -->
  <rect width="100" height="100" fill="#2563eb"/>
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="14" y1="86" x2="86" y2="86"/>
    <line x1="14" y1="86" x2="86" y2="14"/>
  </g>
</svg>
