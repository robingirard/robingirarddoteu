<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Révise STI2D</title>
  <meta name="description" content="Entraînement au bac STI2D : répétition espacée et progression par compétences.">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Révise STI2D">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./vendor/katex/katex.min.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app" class="app"><p class="loading">Chargement…</p></div>
  <noscript><p class="error">Cette application a besoin de JavaScript.</p></noscript>

  <!-- content.js : généré par tools/build_content.py (window.CONTENT = {...}) -->
  <script src="./content.js"></script>
  <!-- KaTeX (formules mathématiques), embarqué dans vendor/ pour fonctionner hors connexion -->
  <script src="./vendor/katex/katex.min.js"></script>
  <script type="module" src="./js/main.js"></script>
  <script>
    // Service worker uniquement en http(s) : rend l'appli utilisable hors-ligne une fois installée.
    if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
    // Message d'aide si le module principal n'a pas démarré. En local (file://) la cause est connue
    // et immédiate ; en ligne, c'est presque toujours une mise à jour à moitié installée, alors on
    // laisse au chargement le temps d'aboutir sur un téléphone lent avant de proposer la réparation.
    const enLigne = location.protocol.startsWith('http');
    setTimeout(() => {
      if (window.__RS_STARTED) return;
      const app = document.getElementById('app');
      app.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'error';
      if (!window.CONTENT) {
        p.textContent = "Le fichier content.js est introuvable : lancez « make » pour générer le contenu.";
      } else if (!enLigne) {
        p.textContent = "L'application n'a pas pu démarrer. Si vous avez ouvert le fichier directement (file://), servez le dossier avec « make serve » (ou « python3 -m http.server ») et ouvrez http://localhost:8000.";
      } else {
        p.textContent = "L'application n'a pas pu démarrer : la mise à jour s'est installée à moitié. Le bouton ci-dessous vide le cache et recharge ; ta progression, enregistrée à part, n'est pas touchée.";
      }
      app.appendChild(p);
      if (enLigne && window.CONTENT) {
        const b = document.createElement('button');
        b.className = 'btn';
        b.textContent = 'Réparer et recharger';
        b.addEventListener('click', async () => {
          b.disabled = true;
          try {
            if ('serviceWorker' in navigator) {
              const rs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(rs.map((r) => r.unregister()));
            }
            if (window.caches) {
              const ks = await caches.keys();
              await Promise.all(ks.map((k) => caches.delete(k)));
            }
          } catch { /* on recharge quand même */ }
          location.reload();
        });
        app.appendChild(b);
      }
    }, enLigne ? 8000 : 2500);
  </script>
</body>
</html>
